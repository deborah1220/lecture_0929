 fill=\"none\"/>' +\n       '<\/g>';\n\n  // 트리 앞에 놓인 선물들\n  var GIFTS = [\n    { x: 150, y: 358, w: 38, h: 32, a: '#E8556A', b: '#FFD34D' },\n    { x: 194, y: 368, w: 30, h: 24, a: '#5BC5A0', b: '#FFF3E3' },\n    { x: 344, y: 366, w: 28, h: 24, a: '#8FB9FF', b: '#E8556A' },\n    { x: 378, y: 358, w: 36, h: 30, a: '#C4A6FF', b: '#FFD34D' },\n    { x: 418, y: 370, w: 26, h: 22, a: '#FFD34D', b: '#3FD68A' }\n  ];\n  GIFTS.forEach(function (gf) {\n    var cx = gf.x + gf.w / 2;\n    g += '<g>' +\n         '<ellipse cx=\"' + cx + '\" cy=\"' + (gf.y + gf.h + 4) + '\" rx=\"' + (gf.w * .6) + '\" ry=\"6\" fill=\"rgba(10,30,50,.18)\"/>' +\n         '<rect x=\"' + gf.x + '\" y=\"' + gf.y + '\" width=\"' + gf.w + '\" height=\"' + gf.h + '\" rx=\"6\" fill=\"' + gf.a + '\"/>' +\n         '<rect x=\"' + gf.x + '\" y=\"' + gf.y + '\" width=\"' + gf.w + '\" height=\"' + (gf.h * .3) + '\" rx=\"6\" fill=\"rgba(255,255,255,.18)\"/>' +\n         '<rect x=\"' + (cx - 5) + '\" y=\"' + gf.y + '\" width=\"10\" height=\"' + gf.h + '\" fill=\"' + gf.b + '\"/>' +\n         '<rect x=\"' + gf.x + '\" y=\"' + (gf.y + gf.h / 2 - 5) + '\" width=\"' + gf.w + '\" height=\"10\" fill=\"' + gf.b + '\"/>' +\n         '<path d=\"M' + cx + ' ' + gf.y + ' q-16 -16 -3 -17 q10 0 3 17 q16 -16 3 -17 q-10 0 -3 17Z\" fill=\"' + gf.b + '\"/>' +\n         '<\/g>';\n  });\n\n  // 반짝이\n  for (var k2 = 0; k2 < 10; k2++) {\n    var sx = 40 + (k2 * 53) % 500, sy = 60 + (k2 * 37) % 260;\n    g += '<circle class=\"tw\" cx=\"' + sx + '\" cy=\"' + sy + '\" r=\"1.8\" fill=\"#FFFFFF\" style=\"animation-delay:' + (k2 * .3) + 's\"/>';\n  }\n\n  // 소원 장식\n  wishes.forEach(function (w, i) {\n    var p = slot(i);\n    g += ornament(w.shape, w.color, p.x, p.y, i, w.who);\n  });\n\n  $('tree').innerHTML = g;\n  [].forEach.call($('tree').querySelectorAll('.orn'), function (el) {\n    el.addEventListener('click', function () { openCard(parseInt(el.dataset.i, 10)); });\n  });\n}\n\n/* 소원 카드 */\nfunction openCard(i) {\n  cIdx = i; var w = wishes[i]; if (!w) return;\n  $('cWho').textContent = w.who + ' 의 소원';\n  $('cWish').textContent = w.wish;\n  $('card').classList.add('show');\n  beep(1046, .12);\n}\n$('cClose').addEventListener('click', function () { $('card').classList.remove('show'); });\n$('cPrev').addEventListener('click', function () { cIdx = (cIdx - 1 + wishes.length) % wishes.length; openCard(cIdx); });\n$('cNext').addEventListener('click', function () { cIdx = (cIdx + 1) % wishes.length; openCard(cIdx); });\n$('cDel').addEventListener('click', function () {\n  if (!confirm('이 소원을 트리에서 내릴까요?')) return;\n  wishes.splice(cIdx, 1); save(); $('card').classList.remove('show'); render(); toast('소원을 내렸어요');\n});\n\n/* 고르기 버튼 */\nvar SHAPE_LABEL = { ball: '⚪', star: '⭐', sock: '🧦', cane: '🍬', snow: '❄', bell: '🔔',\n                    heart: '💗', gift: '🎁', ginger: '🍪', ribbon: '🎀', pinecone: '🌰', light: '💡' };\nSHAPES.forEach(function (sh, i) {\n  var b = document.createElement('button');\n  b.textContent = SHAPE_LABEL[sh] || '⚪';\n  if (i === 0) b.className = 'on';\n  b.addEventListener('click', function () {\n    shape = sh;\n    [].forEach.call($('shapes').children, function (x) { x.classList.remove('on'); });\n    b.classList.add('on'); beep(880, .07);\n  });\n  $('shapes').appendChild(b);\n});\nCOLORS.forEach(function (c, i) {\n  var b = document.createElement('button');\n  b.style.background = c; b.title = '색 고르기';\n  if (i === 0) b.className = 'on';\n  b.addEventListener('click', function () {\n    color = c;\n    [].forEach.call($('colors').children, function (x) { x.classList.remove('on'); });\n    b.classList.add('on'); beep(760, .07);\n  });\n  $('colors').appendChild(b);\n});\n\n/* 걸기 */\n$('hangBtn').addEventListener('click', function () {\n  var who = $('who').value.trim(), wish = $('wish').value.trim();\n  if (!who) { toast('이름을 써 주세요'); $('who').focus(); return; }\n  if (!wish) { toast('소원을 써 주세요'); $('wish').focus(); return; }\n  if (wishes.length >= MAX) { toast('트리가 가득 찼어요!'); return; }\n  wishes.push({ who: who, wish: wish, shape: shape, color: color });\n  save(); $('wish').value = ''; $('who').value = '';\n  render(); jingle(); toast('🎄 트리에 걸었어요!');\n});\n$('shuffleBtn').addEventListener('click', function () {\n  wishes.sort(function () { return Math.random() - .5; }); save(); render(); beep(700, .1);\n});\n$('resetBtn').addEventListener('click', function () {\n  if (!confirm('트리의 소원을 모두 지울까요?')) return;\n  wishes = []; save(); render(); toast('트리를 비웠어요');\n});\n$('fsBtn').addEventListener('click', function () {\n  if (document.fullscreenElement) { document.exitFullscreen(); this.textContent = '⛶'; }\n  else if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen(); this.textContent = '✕'; }\n});\ndocument.addEventListener('keydown', function (e) { if (e.key === 'Escape') $('card').classList.remove('show'); });\n\nfunction render() {\n  $('countChip').textContent = '소원 ' + wishes.length + '개';\n  $('list').innerHTML = wishes.map(function (w, i) {\n    return '<span data-i=\"' + i + '\">' + esc(w.who) + '<\/span>';\n  }).join('');\n  [].forEach.call($('list').children, function (el) {\n    el.addEventListener('click', function () { openCard(parseInt(el.dataset.i, 10)); });\n  });\n  drawTree();\n}\nrender();\n<\/script>\n<\/body>\n<\/html>\n", "prompt": "한 문장씩 차례로 넣어 보세요. 한 단계마다 결과를 눌러 보고 다음으로 넘어갑니다.\n\n1단계 · 기본 만들기\n우리 반 소원 트리를 만들어줘. 이름과 소원을 쓰고 버튼을 누르면 화면의 크리스마스트리에 장식이 하나씩 걸려. 초등학생용으로 크고 예쁘게.\n\n2단계 · 소원 읽기\n트리에 걸린 장식을 누르면 그 친구의 소원이 편지처럼 크게 뜨게 해줘. 이전·다음으로 넘겨 볼 수 있게.\n\n3단계 · 내 장식 고르기\n장식 모양(방울·별·양말·지팡이 사탕·눈꽃·종·하트·선물·진저브레드·리본·솔방울·전구)과 색깔을 골라서 걸 수 있게 해줘.\n\n4단계 · 이름표 달기\n장식 아래에 작은 이름을 써 줘. 밤하늘에서도 잘 보이게.\n\n5단계 · 트리 예쁘게\n층마다 물결 모양인 트리로 그리고, 가지에 눈이 쌓이고 금색 줄 장식과 전구가 반짝이게 해줘. 꼭대기 별에는 빛무리도.\n\n6단계 · 배경에 이야기 넣기\n밤하늘에 초승달과 별, 눈사람, 창문에 불 켜진 오두막을 넣고, 루돌프가 앞에서 끄는 산타 썰매가 하늘을 가로질러 날아가게 해줘. 선물은 트리를 가리지 않게 옆으로.\n\n7단계 · 교실에서 쓰기\n새로고침해도 소원이 남아 있게 하고, 교실 TV용 전체화면 버튼도 넣어줘.\n\n※ 지금은 한 기기(브라우저)에만 저장돼요. 아이들이 각자 패드로 걸게 하려면 실습 ⑤처럼 구글 시트(Apps Script) 연결이 필요합니다."}]</script>
<script>
  var items = JSON.parse(document.getElementById('data').textContent);

  // 템플릿·도움말도 목록에서 볼 수 있게 페이지로 만들어 둡니다
  function docPage(title, body) {
    return '<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">' +
      '<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">' +
      '<style>body{font-family:"Gowun Dodum",sans-serif;background:#FFF7EA;color:#26324B;margin:0;padding:26px 30px;line-height:1.6}' +
      'h1,h2,h3,.k{font-family:"Jua",sans-serif;font-weight:400}h1{font-size:30px;margin:0 0 6px}' +
      'p.sub{color:#6B7390;margin:0 0 18px}h2{font-size:21px;margin:22px 0 10px}' +
      '.row{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center;background:#fff;border:3px solid #F0E2C6;' +
      'border-radius:16px;padding:12px 16px;margin-bottom:8px}.k{color:#2F7DE1;font-size:17px}.v{font-size:17px}' +
      '.v small{display:block;color:#6B7390;font-size:14px}' +
      '.tip{background:#FFE58A;border-radius:14px;padding:12px 16px;margin-top:14px;font-size:16px}' +
      '.help{display:grid;grid-template-columns:1fr 1fr;gap:12px}.help div{background:#fff;border:3px solid #F0E2C6;border-radius:18px;padding:16px}' +
      '.help h3{margin:0 0 6px;font-size:19px}.say{display:inline-block;margin-top:8px;background:#FFF7EA;border-radius:10px;padding:4px 10px;font-size:15px}' +
      '</style></head><body>' + title + body + '</body></html>';
  }

  var TPL = [
    ['새로 만들 때', '[누가] 쓰는 [무엇] 만들어줘. [이걸 하면] [이렇게 돼]. 초등 [학년]용, [분위기] 디자인.'],
    ['기능 더할 때', '[기존 기능]은 그대로 두고, [새 기능]을 추가해줘.'],
    ['고칠 때', '지금은 [A]인데 [B]가 되게 고쳐줘.'],
    ['디자인', '글씨 더 크게 해줘. 배경은 [색]으로, 버튼은 아래로 옮겨줘.'],
    ['오류', '이 오류 고쳐줘: [메시지 붙여넣기]'],
    ['망했을 때', '처음부터 다시. [지금까지 잘 된 것]만 먼저 만들어줘.']
  ];
  var MAGIC = [
    ['폰용', '휴대폰에서도 잘 보이게 해줘.', '폰으로 보는 학생·학부모용'],
    ['저장', '새로고침해도 지워지지 않게 해줘.', '입력 내용이 날아가지 않게'],
    ['TV용', 'TV에 크게 띄울 거야. 교실 뒤에서도 보이게 해줘.', '교실 뒤에서도 보이게'],
    ['쉽게', '초등 1학년도 쓸 수 있게 단순하게 해줘.', '메뉴는 줄이고 그림 중심'],
    ['인쇄', '인쇄하면 A4 한 장에 예쁘게 나오게 해줘.', '종이로 뽑을 때'],
    ['파일 하나', 'HTML 파일 하나로 만들어줘.', '어디든 올리기 쉽게']
  ];
  function rowsHtml(rows) {
    return rows.map(function (r) {
      return '<div class="row"><span class="k">' + r[0] + '</span><span class="v">' + r[1] +
        (r[2] ? '<small>' + r[2] + '</small>' : '') + '</span></div>';
    }).join('');
  }
  items.push({
    icon: '🎁', title: '가져가는 요청 문장 템플릿', desc: '',
    html: docPage('<h1>가져가는 요청 문장 템플릿</h1><p class="sub">[ ] 안만 우리 반에 맞게 바꿔서 붙여넣으세요.</p>',
      rowsHtml(TPL) + '<h2>덧붙이면 확 좋아지는 한 문장</h2>' + rowsHtml(MAGIC) +
      '<p class="tip">처음부터 다 말하지 말고, 기본이 만들어진 다음 하나씩 덧붙이기. 잘 될 때마다 저장하세요.</p>')
  });
  items.push({
    icon: '🚑', title: '막힐 때는 이렇게', desc: '',
    html: docPage('<h1>막힐 때는 이렇게</h1><p class="sub">오류는 읽지 않아도 돼요. 그대로 붙여넣고 고치게 합니다.</p>',
      '<div class="help">' +
      '<div><h3>🔧 결과가 이상해요</h3><p>무엇이 어떻게 달라야 하는지 구체적으로 말해요.</p><span class="say">"지금은 [A]인데 [B]가 되게 고쳐줘"</span></div>' +
      '<div><h3>⚠️ 오류 메시지가 떠요</h3><p>메시지를 통째로 복사해서 붙여넣어요. 읽을 필요 없어요.</p><span class="say">"이 오류 고쳐줘: [메시지]"</span></div>' +
      '<div><h3>↩️ 점점 더 망가져요</h3><p>새 대화를 열고 잘 된 부분까지만 다시 요청해요.</p><span class="say">"처음부터 다시. [잘 된 것]만 먼저 만들어줘"</span></div>' +
      '<div><h3>🐢 느려요·멈춰요</h3><p>요청이 너무 커요. 기능을 잘게 나눠서 하나씩 요청해요.</p><span class="say">"[기존 기능]은 그대로 두고, [새 기능]을 추가해줘"</span></div>' +
      '</div>')
  });

  var menu = document.getElementById('menu');
  var frame = document.getElementById('frame');
  var viewer = document.getElementById('viewer');
  var current = null;

  items.forEach(function (it, i) {
    var b = document.createElement('button');
    b.innerHTML = '<span class="ic"></span><span><span class="t"></span><span class="d"></span></span>';
    b.querySelector('.ic').textContent = it.icon;
    b.querySelector('.t').textContent = it.title;
    b.querySelector('.d').textContent = it.desc || '';
    b.addEventListener('click', function () { show(i, true); });
    menu.appendChild(b);
  });

  function show(i, fromClick) {
    current = items[i];
    [].forEach.call(menu.children, function (b, k) { b.classList.toggle('on', k === i); });
    document.getElementById('vname').textContent = current.title;
    var pr = document.getElementById('prompt');
    var pb = document.getElementById('pBtn'), cb = document.getElementById('cpBtn');
    document.getElementById('dlBtn').hidden = !current.file;
    if (current.prompt) { pb.hidden = false; cb.hidden = false; document.getElementById('ptext').textContent = current.prompt; }
    else { pb.hidden = true; cb.hidden = true; pr.classList.remove('open'); pb.classList.remove('on'); }
    frame.srcdoc = current.html;
  }

  document.getElementById('cpBtn').addEventListener('click', function () {
    copy(current && current.prompt ? current.prompt : '');
  });
  document.getElementById('pBtn').addEventListener('click', function () {
    var on = document.getElementById('prompt').classList.toggle('open');
    this.classList.toggle('on', on);
  });
  document.getElementById('copyBtn').addEventListener('click', function () {
    copy(current && current.prompt ? current.prompt : '');
  });
  document.getElementById('fullBtn').addEventListener('click', function () {
    var on = viewer.classList.toggle('full');
    this.textContent = on ? '닫기' : '크게 보기';
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && viewer.classList.contains('full')) document.getElementById('fullBtn').click();
  });

  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove('show'); }, 1800);
  }
  function copy(text) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    if (ok) { toast('복사했어요'); return; }
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(function () { toast('복사했어요'); }, function () { toast('문장을 길게 눌러 복사해 주세요'); });
    } else { toast('문장을 길게 눌러 복사해 주세요'); }
  }

  var downloads = null;
  (async function () {
    try { downloads = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { downloads = null; }
    document.getElementById('dlBtn').hidden = false; // 파일로 열면 브라우저 기본 저장을 써요
  })();
  function saveBlob(name, text) {
    var url = URL.createObjectURL(new Blob([text], { type: 'text/html;charset=utf-8' }));
    var a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    toast('파일을 받았어요');
  }
  document.getElementById('dlBtn').addEventListener('click', async function () {
    if (!current) return;
    if (!downloads) { saveBlob(current.file, current.html); return; }
    try {
      await downloads.save({ filename: current.file, data: current.html });
      toast('파일을 받았어요');
    } catch (e) {
      var c = e && e.code;
      if (c === 'declined') return;
      if (c === 'rate_limited') { toast('잠시 뒤에 다시 눌러 주세요'); return; }
      toast('여기서는 파일을 받을 수 없어요');
      document.getElementById('dlBtn').hidden = true;
    }
  });
  show(1);
</script>
</body>
</html>
