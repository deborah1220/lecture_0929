+ ((k * 29) % 22);\n    g += '<circle cx=\"' + fx2 + '\" cy=\"' + fy2 + '\" r=\"4\" fill=\"' + ['#FF8FB1', '#FFD84D', '#C86BD8'][k % 3] + '\"/>';\n  }\n  arrivedAnimals(score()).forEach(function (a, idx) {\n    var art = ART[a.key] ? ART[a.key]() : '<text y=\"0\" font-size=\"30\" text-anchor=\"middle\">' + a.icon + '<\/text>';\n    g += '<g transform=\"translate(' + a.x + ' ' + a.y + ') scale(' + (a.s || 1) + ')\">' +\n         (a.air ? '' : '<ellipse cx=\"0\" cy=\"1\" rx=\"16\" ry=\"4\" fill=\"rgba(60,80,50,.18)\"/>') +\n         '<g class=\"hop\" style=\"animation-delay:' + (idx * .45) + 's\">' + art + '<\/g><\/g>';\n  });\n  var left = ANIMALS.filter(function (a) { return score() / GOAL < a.at; })[0];\n  g += '<text x=\"260\" y=\"26\" text-anchor=\"middle\" font-size=\"16\" fill=\"#3F6B4A\" font-family=\"Jua, sans-serif\">' +\n       (left ? left.icon + ' ' + left.name + '까지 ' + Math.max(1, Math.ceil(left.at * GOAL) - score()) + '점!' : '🎉 모든 친구가 모였어요!') +\n       '<\/text>';\n  document.getElementById('forest').innerHTML = g;\n}\nfunction showTab(which) {\n  var pot = which === 'pot';\n  // SVG에는 hidden 속성이 잘 안 먹어서 display로 바꿔요\n  document.getElementById('plant').style.display = pot ? 'block' : 'none';\n  document.getElementById('forest').style.display = pot ? 'none' : 'block';\n  document.getElementById('badge').style.display = pot ? '' : 'none';\n  document.getElementById('tabPot').classList.toggle('on', pot);\n  document.getElementById('tabForest').classList.toggle('on', !pot);\n}\ndocument.getElementById('tabPot').onclick = function () { showTab('pot'); };\ndocument.getElementById('tabForest').onclick = function () { showTab('forest'); };\n\n/* ---------- 실천 올리기 패널 ---------- */\nfunction drawPanel() {\n  var el = document.getElementById('panel');\n  if (!state.planted) {\n    el.innerHTML = '<h2>🌰 씨앗 뿌리기<\/h2><p style=\"margin-bottom:14px;color:var(--muted)\">우리 반 화분에 씨앗을 뿌리면 함께 키우기가 시작돼요. 물·종이·전기·일회용품을 아낄 때마다 화분이 자라고, 우리 숲에 동물 친구들이 하나씩 찾아와요.<\/p><button class=\"plant-btn\" id=\"plantBtn\">🌰 씨앗 뿌리기<\/button>';\n    document.getElementById('plantBtn').onclick = async function () {\n      this.disabled = true; state = await store.send({ plant: true }); burst('🌰'); render(); toast('씨앗을 뿌렸어요! 이제 함께 키워요 🌱');\n    };\n    return;\n  }\n  if (!me) {\n    el.innerHTML = '<h2>👋 나는 누구예요?<\/h2><p style=\"margin-bottom:12px;color:var(--muted)\">내 패드라면 한 번만 고르면 돼요.<\/p><div class=\"who\" id=\"who\"><\/div>';\n    STUDENTS.forEach(function (n) {\n      var b = document.createElement('button'); b.textContent = n;\n      b.onclick = function () { me = n; try { localStorage.setItem(ME_KEY, n); } catch (e) {} chosen = []; render(); };\n      document.getElementById('who').appendChild(b);\n    });\n    return;\n  }\n  var mine = todayRecs().filter(function (r) { return r.name === me; }).map(function (r) { return r.act; });\n  el.innerHTML = '<h2>' + esc(me) + '의 오늘 실천<\/h2><p style=\"color:var(--muted);font-size:15px\">오늘 한 것을 모두 골라서 올려 주세요.<\/p>' +\n    '<div class=\"acts\">' + ACTIONS.map(function (a) {\n      var did = mine.indexOf(a.key) >= 0, on = chosen.indexOf(a.key) >= 0;\n      return '<button class=\"act' + (did ? ' did' : '') + (on ? ' on' : '') + '\" data-k=\"' + a.key + '\"' + (did ? ' disabled' : '') + '>' +\n        '<span class=\"g\">' + (did ? '✔ 완료' : a.fx + ' ' + a.gives) + '<\/span><span class=\"e\">' + a.emoji + '<\/span><span class=\"t\">' + a.title + '<\/span><span class=\"d\">' + a.desc + '<\/span><\/button>';\n    }).join('') + '<\/div>' +\n    '<button class=\"send\" id=\"sendBtn\"' + (chosen.length ? '' : ' disabled') + '>🌱 화분에 올리기<\/button>' +\n    '<p class=\"hint\">' + (mine.length === ACTIONS.length ? '오늘 실천을 모두 올렸어요. 최고예요! 🌟' : '같은 실천은 하루에 한 번만 올릴 수 있어요') + '<\/p>';\n  el.querySelectorAll('.act:not(.did)').forEach(function (b) {\n    b.onclick = function () {\n      var k = b.dataset.k, i = chosen.indexOf(k);\n      if (i >= 0) chosen.splice(i, 1); else chosen.push(k);\n      drawPanel();\n    };\n  });\n  document.getElementById('sendBtn').onclick = async function () {\n    if (!chosen.length) return;\n    this.disabled = true; this.textContent = '올리는 중…';\n    var before = stageIdx(), beforeFriends = arrivedAnimals(score()).length;\n    var recs = chosen.map(function (k) { return { d: TODAY, name: me, act: k }; });\n    var fx = chosen.map(function (k) { return actOf(k).fx; });\n    try {\n      state = await store.send({ records: recs });\n      chosen = []; fx.forEach(function (f, i) { setTimeout(function () { burst(f); }, i * 250); });\n      render();\n      var nowF = arrivedAnimals(score());\n      if (nowF.length > beforeFriends) {\n        var nf = nowF[nowF.length - 1];\n        showTab('forest');\n        toast(nf.icon + ' ' + nf.name + '이(가) 우리 숲에 놀러 왔어요!');\n      } else {\n        toast(stageIdx() > before ? '🎉 화분이 ' + STAGES[stageIdx()].name + '(으)로 자랐어요!' : '고마워요! 화분이 좋아해요 💚');\n      }\n    } catch (e) { toast('올리지 못했어요. 인터넷을 확인하고 다시 눌러 주세요'); drawPanel(); }\n  };\n}\n\n/* ---------- 오늘 현황과 소식 ---------- */\nfunction drawToday() {\n  var t = todayRecs();\n  var max = Math.max(3, STUDENTS.length);\n  document.getElementById('gauges').innerHTML = ACTIONS.map(function (a) {\n    var c = t.filter(function (r) { return r.act === a.key; }).length;\n    return '<div class=\"gg\"><span>' + a.fx + ' ' + a.gives + '<\/span><span class=\"bar\"><i style=\"width:' + Math.min(100, c / max * 100) + '%;background:' + a.color + '\"><\/i><\/span><b>' + c + '<\/b><\/div>';\n  }).join('');\n  var people = {}; t.forEach(function (r) { people[r.name] = 1; });\n  document.getElementById('stat').innerHTML = '<span>🙋 오늘 참여 ' + Object.keys(people).length + ' / ' + STUDENTS.length + '명<\/span><span>🌿 오늘 실천 ' + t.length + '개<\/span>';\n  var feed = document.getElementById('feed');\n  var recent = t.slice(-10).reverse();\n  feed.innerHTML = recent.length ? '' : '<li class=\"empty\">아직 소식이 없어요. 첫 실천을 올려 볼까요?<\/li>';\n  recent.forEach(function (r) {\n    var a = actOf(r.act); if (!a) return;\n    var li = document.createElement('li');\n    li.textContent = r.name + ' 님이 ' + a.title + '를 해서 ' + a.fx + ' ' + a.gives + josa(a.gives) + ' 주었어요';\n    feed.appendChild(li);\n  });\n}\n\nfunction render() { drawPlant(); drawForest(); drawPanel(); drawToday(); }\n\n/* ---------- 효과와 알림 ---------- */\nfunction burst(emoji) {\n  var fx = document.getElementById('fx');\n  for (var i = 0; i < 5; i++) {\n    var s = document.createElement('span'); s.textContent = emoji;\n    s.style.left = (30 + Math.random() * 40) + '%'; s.style.top = (10 + Math.random() * 15) + '%';\n    s.style.animationDelay = (i * 0.12) + 's';\n    fx.appendChild(s); setTimeout(function (n) { n.remove(); }.bind(null, s), 2000);\n  }\n}\nfunction toast(m) { var t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove('show'); }, 2200); }\nfunction josa(w) { var c = w.charCodeAt(w.length - 1); return (c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28) ? '을' : '를'; }\nfunction esc(s) { return String(s).replace(/[&<>\"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]; }); }\n\n/* ---------- 선생님 메뉴 ---------- */\ndocument.getElementById('meBtn').onclick = function () { me = null; try { localStorage.removeItem(ME_KEY); } catch (e) {} chosen = []; render(); };\ndocument.getElementById('resetBtn').onclick = async function () {\n  if (!confirm('화분과 모든 기록을 지우고 처음부터 시작할까요?')) return;\n  var code = '';\n  if (SCRIPT_URL) { code = prompt('선생님 비밀번호를 넣어 주세요 (Apps Script의 RESET_CODE)') || ''; if (!code) return; }\n  state = await store.send({ reset: true, code: code }); render(); toast('빈 화분으로 돌아갔어요');\n};\ndocument.getElementById('demoBtn').onclick = async function () {\n  if (SCRIPT_URL) { toast('시연용 버튼은 시연 모드에서만 써요'); return; }\n  var recs = [], d = new Date();\n  state.records.forEach(function (r) { var x = new Date(r.d + 'T12:00:00'); if (x < d) d = x; });\n  for (var k = 1; recs.length < 20 && k < 60; k++) {\n    d.setDate(d.getDate() - 1);\n    STUDENTS.forEach(function (n) { if (recs.length < 20) recs.push({ d: dayKey(d), name: n, act: ACTIONS[(k + recs.length) % ACTIONS.length].key }); });\n  }\n  if (!state.planted) await store.send({ plant: true });\n  state = await store.send({ records: recs }); burst('✨'); render(); toast('시연용 실천 20개를 더했어요');\n};\n\n/* ---------- 시작 ---------- */\n(async function () {\n  try { state = await store.load(); } catch (e) { toast('기록을 불러오지 못했어요'); }\n  render();\n  if (SCRIPT_URL) setInterval(async function () { try { state = await store.load(); drawPlant(); drawToday(); } catch (e) {} }, 30000);\n})();\n<\/script>\n<\/body>\n<\/html>\n", "prompt": "우리 반이 함께 키우는 환경 화분 사이트를 만들어줘. 처음엔 빈 화분이고 '씨앗 뿌리기'를 누르면 시작돼. 학생이 자기 이름을 고르고 오늘 한 실천(물 아끼기, 종이 아끼기, 전기 아끼기, 일회용품 줄이기)을 골라 올리면, 물은 💧, 종이는 거름, 전기는 햇빛, 일회용품은 나비가 되어 화분에 가. 실천이 쌓일수록 새싹 → 떡잎 → 나무 → 꽃 → 열매로 자라. '우리 숲' 화면도 따로 있어서, 점수가 오를수록 나무가 늘어나고 나비·다람쥐·여우·사슴·곰 같은 동물 친구가 하나씩 찾아와 평화롭게 지내. 같은 실천은 하루에 한 번만. 초등학생이 패드로 쓰기 좋게 크고 귀엽게.\n\n(심화) 여러 패드에서 함께 키우려면: \"구글 시트에 기록이 모이도록 Apps Script 코드도 만들어줘\""}, {"icon": "🏃", "title": "실습 ⑥ 수학 달리기 게임", "desc": "학년(1~6)에 맞는 문제로 달리고 점프하는 게임.", "file": "실습6_수학달리기.html", "html": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>수학 달리기<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Jua&display=swap\" rel=\"stylesheet\">\n<style>\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n  html, body { height: 100%; }\n  body { font-family: 'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif; background: #BDE9FF; color: #4A3A2A; overflow: hidden; }\n  .game { position: relative; width: 100%; height: 100%; }\n  canvas { display: block; width: 100%; height: 100%; background: #BDE9FF; }\n\n  .hud { position: absolute; top: 10px; left: 12px; right: 12px; display: flex; align-items: center; gap: 8px;\n         font-size: clamp(16px, 2.2vw, 22px); z-index: 2; pointer-events: none; flex-wrap: wrap; }\n  .hud > span { background: rgba(255,255,255,.88); border-radius: 999px; padding: 4px 14px; }\n  .hud button { pointer-events: auto; font-family: inherit; font-size: clamp(14px, 1.8vw, 18px); border: none;\n                background: rgba(255,255,255,.88); border-radius: 999px; padding: 5px 13px; cursor: pointer; }\n  .hud .q { margin-left: auto; font-size: clamp(18px, 3vw, 30px); padding: 5px 22px; }\n\n  .keys { position: absolute; left: 12px; right: 12px; bottom: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; z-index: 2; }\n  .keys button { font-family: inherit; font-size: clamp(18px, 2.6vw, 26px); padding: 12px; border: none; border-radius: 18px;\n                 background: rgba(255,180,61,.92); color: #fff; cursor: pointer; box-shadow: 0 5px 0 rgba(217,139,28,.9); }\n  .keys button:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(217,139,28,.9); }\n\n  .cover { position: absolute; inset: 0; background: rgba(74,58,42,.74); color: #fff; display: flex; flex-direction: column;\n           align-items: center; justify-content: center; text-align: center; padding: 16px; gap: 8px; overflow-y: auto; z-index: 3; }\n  .cover.hide { display: none; }\n  .cover h2 { font-size: clamp(24px, 5vw, 40px); }\n  .cover p { font-size: clamp(14px, 2vw, 18px); line-height: 1.5; }\n  .lbl { font-size: clamp(13px, 1.7vw, 16px); opacity: .85; margin-top: 2px; }\n  .chars { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }\n  .chars button { font-size: 30px; width: 54px; height: 54px; border-radius: 16px; border: 3px solid rgba(255,255,255,.5); background: rgba(255,255,255,.12); cursor: pointer; padding: 0; }\n  .chars button.on { background: #fff; border-color: #fff; transform: scale(1.08); }\n  .opts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }\n  .opts button { font-family: inherit; font-size: clamp(14px, 1.8vw, 17px); padding: 6px 16px; border-radius: 999px; border: 3px solid #fff; background: transparent; color: #fff; cursor: pointer; }\n  .opts button.on { background: #fff; color: #4A3A2A; }\n  .start { font-family: inherit; font-size: clamp(20px, 3vw, 26px); padding: 10px 38px; border: none; border-radius: 999px; background: #56C46B; color: #fff; cursor: pointer; margin-top: 4px; }\n  button:focus-visible { outline: 4px solid #fff; outline-offset: 3px; }\n<\/style>\n<\/head>\n<body>\n<div class=\"game\">\n  <canvas id=\"cv\"><\/canvas>\n\n  <div class=\"hud\">\n    <span id=\"hearts\">❤️❤️❤️<\/span>\n    <span id=\"score\">0점<\/span>\n    <span id=\"coins\">🪙 0<\/span>\n    <span id=\"items\"><\/span>\n    <span id=\"best\"><\/span>\n    <button id=\"soundBtn\" title=\"소리 켜기/끄기\">🔊<\/button>\n    <button id=\"fsBtn\" title=\"전체 화면\">⛶<\/button>\n    <span class=\"q\" id=\"question\">준비!<\/span>\n  <\/div>\n\n  <div class=\"keys\">\n    <button id=\"jumpBtn\">⬆️ 점프<\/button>\n    <button id=\"downBtn\">⬇️ 내려오기<\/button>\n  <\/div>\n\n  <div class=\"cover\" id=\"cover\">\n    <h2 id=\"ctitle\">🏃 수학 달리기<\/h2>\n    <p id=\"ctext\">달리다가 <b>점프<\/b>해서 정답이 있는 곳으로!<br>\n      위 칸이 정답이면 점프, 아래 칸이 정답이면 그냥 달려요.<br>\n      🪙 코인과 ⭐🧲💡💖 아이템도 먹어 보세요!<\/p>\n    <div class=\"lbl\">캐릭터 고르기<\/div>\n    <div class=\"chars\" id=\"charsel\"><\/div>\n    <div class=\"lbl\">학년 고르기 (학년에 맞는 문제가 나와요)<\/div>\n    <div class=\"opts\" id=\"opsel\"><\/div>\n    <div class=\"lbl\">달리는 속도<\/div>\n    <div class=\"opts\" id=\"lvsel\"><\/div>\n    <button class=\"start\" id=\"startBtn\">시작하기<\/button>\n  <\/div>\n<\/div>\n\n<script>\n/* ▼ 고치는 부분 ─────────────────────────────────── */\n// 고를 수 있는 캐릭터 (색만 바꿔도 새 캐릭터가 돼요)\nvar CHARACTERS = [\n  { name: '빨강이',  skin: '#F7C9A3', shirt: '#E5383B', pants: '#2F5BD0', cap: '#E5383B', hair: '#4A3222', shoe: '#6B4A2F' },\n  { name: '초록이',  skin: '#F7C9A3', shirt: '#2E9E4B', pants: '#F0F0F0', cap: '#2E9E4B', hair: '#3B2A1A', shoe: '#5A4030' },\n  { name: '보라공주', skin: '#FAD7BC', shirt: '#C86BD8', pants: '#C86BD8', cap: null,     hair: '#F2C94C', shoe: '#8E44AD', longHair: true },\n  { name: '파랑로봇', skin: '#9FB3D1', shirt: '#4A7BD4', pants: '#37506F', cap: null,     hair: null,      shoe: '#2C3E50', robot: true },\n  { name: '공룡',    skin: '#63C267', shirt: '#63C267', pants: '#4FAF54', cap: null,      hair: null,      shoe: '#3E8E42', spikes: true },\n  { name: '고양이',  skin: '#D8CFC4', shirt: '#F2A65A', pants: '#B99A7B', cap: null,      hair: null,      shoe: '#7A5C42', ears: true }\n];\nfunction ri(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }\nfunction gcd(a, b) { return b ? gcd(b, a % b) : a; }\nfunction frac(n, d) { var g = gcd(n, d) || 1; var nn = n / g, dd = d / g; return dd === 1 ? String(nn) : nn + '/' + dd; }\n\n// 학년별 문제 만들기 (여기를 바꾸면 우리 반 수준에 맞출 수 있어요)\nvar GRADES = [\n  { g: 1, label: '1학년', speed: 125, make: function () {\n      if (Math.random() < .5) { var a = ri(1, 9), b = ri(1, 9 - Math.min(8, a)); return { text: a + ' + ' + b, ans: a + b }; }\n      var x = ri(3, 9), y = ri(1, x - 1); return { text: x + ' − ' + y, ans: x - y };\n  } },\n  { g: 2, label: '2학년', speed: 145, make: function () {\n      var r = Math.random();\n      if (r < .35) { var a = ri(11, 49), b = ri(11, 49); return { text: a + ' + ' + b, ans: a + b }; }\n      if (r < .7) { var x = ri(21, 99), y = ri(11, x - 1); return { text: x + ' − ' + y, ans: x - y }; }\n      var m = ri(2, 5), n = ri(2, 9); return { text: m + ' × ' + n, ans: m * n };\n  } },\n  { g: 3, label: '3학년', speed: 165, make: function () {\n      var r = Math.random();\n      if (r < .4) { var m = ri(2, 9), n = ri(2, 9); return { text: m + ' × ' + n, ans: m * n }; }\n      if (r < .7) { var q = ri(2, 9), d = ri(2, 9); return { text: (q * d) + ' ÷ ' + d, ans: q }; }\n      var a = ri(120, 799), b = ri(110, 200); return { text: a + ' + ' + b, ans: a + b };\n  } },\n  { g: 4, label: '4학년', speed: 180, make: function () {\n      var r = Math.random();\n      if (r < .4) { var a = ri(12, 49), b = ri(3, 9); return { text: a + ' × ' + b, ans: a * b }; }\n      if (r < .7) { var q = ri(11, 40), d = ri(3, 9); return { text: (q * d) + ' ÷ ' + d, ans: q }; }\n      var x = ri(11, 25), y = ri(11, 20); return { text: x + ' × ' + y, ans: x * y };\n  } },\n  { g: 5, label: '5학년', speed: 195, make: function () {\n      var r = Math.random();\n      if (r < .35) { var d = ri(5, 9), a = ri(1, d - 2), b = ri(1, d - a - 1); return { text: frac(a, d) + ' + ' + frac(b, d), ans: frac(a + b, d) }; }\n      if (r < .7) { var x = (ri(11, 89) / 10), y = (ri(11, 89) / 10); return { text: x.toFixed(1) + ' + ' + y.toFixed(1), ans: (x + y).toFixed(1) }; }\n      var gg = ri(2, 9), m = gg * ri(2, 6), n = gg * ri(2, 6); return { text: m + ' 와 ' + n + ' 의 최대공약수', ans: gcd(m, n) };\n  } },\n  { g: 6, label: '6학년', speed: 210, make: function () {\n      var r = Math.random();\n      if (r < .35) { var b = ri(3, 7), a = ri(1, b - 1), d = ri(3, 7), c = ri(1, d - 1); return { text: frac(a, b) + ' × ' + frac(c, d), ans: frac(a * c, b * d) }; }\n      if (r < .7) { var base = ri(2, 20) * 10, pct = [10, 20, 25, 50][Math.floor(Math.random() * 4)]; return { text: base + ' 의 ' + pct + '%', ans: base * pct / 100 }; }\n      var x = (ri(11, 59) / 10), y = ri(2, 9); return { text: x.toFixed(1) + ' × ' + y, ans: (x * y).toFixed(1) };\n  } }\n];\nvar SPEEDS = [\n  { key: 'slow', label: '느리게', rate: .8 },\n  { key: 'normal', label: '보통', rate: 1 },\n  { key: 'fast', label: '빠르게', rate: 1.25 }\n];\nvar LIVES = 3;          // 하트 개수\nvar JUMP = 820;         // 점프 힘 (크면 더 높이 뛰어요)\nvar GRAVITY = 2100;     // 중력 (크면 더 빨리 떨어져요)\nvar COIN_POINT = 5;     // 코인 하나 점수\nvar FEVER_AT = 3;       // 몇 번 연속 맞히면 피버 타임?\n// 먹을 수 있는 아이템 (나오는 확률은 아래 ITEM_CHANCE)\nvar ITEMS = [\n  { key: 'star',   icon: '⭐', name: '방패별',  desc: '한 번 틀려도 하트가 안 줄어요', time: 8 },\n  { key: 'magnet', icon: '🧲', name: '자석',    desc: '코인이 저절로 붙어요',        time: 7 },\n  { key: 'bulb',   icon: '💡', name: '힌트등',  desc: '정답 블록이 반짝여요',        gates: 3 },\n  { key: 'heart',  icon: '💖', name: '하트',    desc: '하트를 하나 채워요' }\n];\nvar ITEM_CHANCE = .6;   // 문제마다 아이템이 나올 확률\n/* ▲ 고치는 부분 끝 ─────────────────────────────── */\n\nif (!window.requestAnimationFrame) window.requestAnimationFrame = function (f) { return setTimeout(function () { f(Date.now()); }, 16); };\nvar cv = document.getElementById('cv'), ctx = cv.getContext('2d');\nvar W = 900, H = 420, GROUND = 336, PLAT_Y = 206;\nvar K = 1, OFFY = 0, TOPPAD = 0;   // 화면 크기에 맞춘 확대 비율\nfunction resize() {\n  var r = cv.getBoundingClientRect();\n  cv.width = Math.max(320, Math.round(r.width));\n  cv.height = Math.max(240, Math.round(r.height));\n  K = Math.min(2.4, Math.max(.5, Math.min(cv.width / 760, cv.height / 430)));\n  W = cv.width / K;\n  H = Math.min(cv.height / K, 560);          // 세로가 아주 긴 화면은 아래쪽만 사용\n  var keysH = cv.height > cv.width * 1.3 ? 92 : 0;       // 세로 화면에서는 버튼 자리를 비워 둬요\n  OFFY = Math.max(0, cv.height - keysH - H * K);          // 남는 위쪽은 하늘로 채워요\n  TOPPAD = OFFY / K;\n  GROUND = H - 70;                                   // 바닥 (발이 닿는 높이)\n  PLAT_Y = GROUND - Math.min(150, Math.max(115, H * .33));   // 위 발판 높이\n  if (G) { G.x = Math.round(W * .15); if (G.y > GROUND) G.y = GROUND; }\n  if (!running) idleFrame();\n}\nwindow.addEventListener('resize', resize);\ndocument.addEventListener('fullscreenchange', resize);\nvar hero = CHARACTERS[0], grade = GRADES[2], speedSet = SPEEDS[1];\nvar G = null, running = false, last = 0;\nvar BEST_KEY = 'math-run-best', best = 0;\ntry { best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0; } catch (e) {}\nfunction showBest() { document.getElementById('best').textContent = best ? '🏅 최고 ' + best + '점' : ''; }\n\nvar AC = null, soundOn = true;\nfunction beep(freq, dur, type, vol) {\n  if (!soundOn) return;\n  try {\n    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();\n    var o = AC.createOscillator(), g = AC.createGain();\n    o.type = type || 'square'; o.frequency.value = freq;\n    g.gain.value = vol || .06;\n    o.connect(g); g.connect(AC.destination);\n    o.start();\n    g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + (dur || .12));\n    o.stop(AC.currentTime + (dur || .12) + .02);\n  } catch (e) {}\n}\nfunction sfxJump() { beep(620, .1); setTimeout(function () { beep(880, .08); }, 60); }\nfunction sfxCoin() { beep(1180, .07, 'triangle', .07); setTimeout(function () { beep(1560, .1, 'triangle', .07); }, 60); }\nfunction sfxGood() { [523, 659, 784].forEach(function (f, i) { setTimeout(function () { beep(f, .1, 'square', .05); }, i * 70); }); }\nfunction sfxBad() { beep(180, .25, 'sawtooth', .05); }\nfunction sfxItem() { [660, 880, 1100].forEach(function (f, i) { setTimeout(function () { beep(f, .09, 'triangle', .06); }, i * 60); }); }\nfunction sfxFever() { [784, 988, 1175, 1568].forEach(function (f, i) { setTimeout(function () { beep(f, .1, 'triangle', .06); }, i * 80); }); }\n\nfunction findIn(a, f) { for (var i = 0; i < a.length; i++) if (f(a[i])) return a[i]; return null; }\nfunction rnd(n) { return Math.floor(Math.random() * n) + 1; }\n\nfunction makeQuestion() {\n  var q = grade.make();\n  var ansStr = String(q.ans);\n  var wrong = ansStr, guard = 0;\n  while (wrong === ansStr && guard++ < 40) {\n    if (ansStr.indexOf('/') >= 0) {                      // 분수\n      var parts = ansStr.split('/'), n = parseInt(parts[0], 10), d = parseInt(parts[1], 10);\n      wrong = Math.random() < .5 ? frac(Math.max(1, n + (Math.random() < .5 ? 1 : -1)), d) : frac(n, Math.max(2, d + 1));\n    } else if (ansStr.indexOf('.') >= 0) {               // 소수\n      var v = parseFloat(ansStr) + [0.1, -0.1, 1, -1, 0.5][Math.floor(Math.random() * 5)];\n      wrong = Math.max(0, v).toFixed(1);\n    } else {                                             // 자연수\n      var num = parseInt(ansStr, 10);\n      var gap = num > 100 ? [1, 10, 100, 9][Math.floor(Math.random() * 4)] : [1, 2, 3, 10][Math.floor(Math.random() * 4)];\n      var cand = num + gap * (Math.random() < .5 ? 1 : -1);\n      if (cand < 0 || (cand === 0 && num > 3)) cand = num + gap;\n      wrong = String(cand);\n    }\n  }\n  if (wrong === ansStr) wrong = String(ansStr) + '0';\n  var topIsAnswer = Math.random() < .5;\n  return { text: q.text + ' = ?', ans: ansStr, top: topIsAnswer ? ansStr : wrong, bottom: topIsAnswer ? wrong : ansStr, topIsAnswer: topIsAnswer };\n}\n\nfunction newGame() {\n  G = { x: Math.round(W * .15), y: GROUND, vy: 0, onPlat: false, run: 0, score: 0, lives: LIVES, combo: 0,\n        gates: [], coins: [], items: [], bits: [], t: 0, speed: grade.speed * speedSet.rate, shake: 0, pops: [], dust: [],\n        fever: 0, hurt: 0, coinCount: 0, shield: 0, magnet: 0, hintGates: 0, over: false };\n  addGate(); updateHud();\n}\nfunction addGate() {\n  var g = { x: W + 140, q: makeQuestion(), done: false };\n  G.gates.push(g);\n  // 정답 쪽으로 가는 길에 코인 놓기\n  var top = g.q.topIsAnswer;\n  if (Math.random() < ITEM_CHANCE) {\n    var it = ITEMS[Math.floor(Math.random() * ITEMS.length)];\n    G.items.push({ x: g.x - 420, y: (Math.random() < .5 ? PLAT_Y - 120 : GROUND - 60), kind: it, t: 0 });\n  }\n  for (var i = 0; i < 5; i++) {\n    G.coins.push({\n      x: g.x - 250 + i * 42,\n      y: top ? PLAT_Y - 40 - Math.sin(i / 4 * Math.PI) * 46 : GROUND - 34,\n      got: false, t: i\n    });\n  }\n}\nfunction updateHud() {\n  document.getElementById('hearts').textContent = '❤️'.repeat(Math.max(0, G.lives)) + '🤍'.repeat(Math.max(0, LIVES - G.lives));\n  document.getElementById('score').textContent = G.score + '점';\n}\n\n/* 조작 */\nfunction jump() {\n  if (!running || !G || G.over) return;\n  if (G.y >= GROUND - 1 || G.onPlat) { G.vy = -JUMP; G.onPlat = false; puff(); sfxJump(); }\n}\nfunction dropDown() {\n  if (!running || !G || G.over) return;\n  if (G.onPlat) { G.onPlat = false; G.y += 2; G.vy = 60; }\n  else if (G.y < GROUND) G.vy += 420;\n}\ndocument.addEventListener('keydown', function (e) {\n  if (e.key === 'ArrowU llStyle = 'rgba(255,120,120,.4)';\n    g2.beginPath(); g2.arc(10, headY + 5, 3.5, 0, 7); g2.fill();\n  }\n  g2.restore();\n}\nfunction roundRectIn(g2, x, y, w, h, r) {\n  g2.beginPath();\n  g2.moveTo(x + r, y); g2.arcTo(x + w, y, x + w, y + h, r); g2.arcTo(x + w, y + h, x, y + h, r);\n  g2.arcTo(x, y + h, x, y, r); g2.arcTo(x, y, x + w, y, r); g2.closePath();\n}\nfunction drawHero(x, y, t, airborne) { drawChar(ctx, x + 10, y, t, airborne, hero); }\n\nfunction roundRect(x, y, w, h, r) {\n  ctx.beginPath();\n  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);\n  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();\n}\n\nfunction draw() {\n  ctx.setTransform(K, 0, 0, K, 0, OFFY);\n  ctx.save();\n  if (G.shake > 0) ctx.translate((Math.random() - .5) * 10, (Math.random() - .5) * 10);\n  background(G.t, G.t * G.speed);\n\n  G.gates.forEach(function (g) {\n    ctx.fillStyle = '#C0703A'; ctx.fillRect(g.x - 84, PLAT_Y + 4, 188, 20);\n    ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 2;\n    for (var bb = 0; bb < 5; bb++) ctx.strokeRect(g.x - 84 + bb * 38, PLAT_Y + 4, 38, 20);\n    ctx.fillStyle = '#8C4E23'; ctx.fillRect(g.x - 84, PLAT_Y + 22, 188, 4);\n    if (!g.done) {\n      ctx.fillStyle = 'rgba(255,255,255,.94)'; roundRect(g.x - 100, 54, 232, 44, 22); ctx.fill();\n      ctx.fillStyle = '#4A3A2A';\n      ctx.font = (g.q.text.length > 14 ? 22 : 28) + 'px Jua, sans-serif'; ctx.textAlign = 'center';\n      ctx.fillText(g.q.text, g.x + 16, 86);\n    }\n    [[PLAT_Y - 42, g.q.top], [GROUND - 6, g.q.bottom]].forEach(function (pair, idx) {\n      var bx = g.x - 40, by = pair[0] - 78;\n      var isAnswer = (idx === 0) === g.q.topIsAnswer;\n      if (!g.done && G.hintGates > 0 && isAnswer) {\n        ctx.save(); ctx.shadowColor = '#FFE066'; ctx.shadowBlur = 20 + Math.sin(G.t * 10) * 10;\n      }\n      ctx.fillStyle = g.done ? '#CFC6B8' : '#F5B324';\n      roundRect(bx, by, 112, 70, 12); ctx.fill();\n      ctx.strokeStyle = g.done ? '#AFA595' : '#B97B15'; ctx.lineWidth = 6; ctx.stroke();\n      ctx.fillStyle = g.done ? '#BDB4A6' : '#FFD873';\n      [[10, 10], [96, 10], [10, 56], [96, 56]].forEach(function (p) {\n        ctx.beginPath(); ctx.arc(bx + p[0], by + p[1], 4, 0, 7); ctx.fill();\n      });\n      var label = String(pair[1]);\n      ctx.fillStyle = '#4A3A2A';\n      ctx.font = (label.length > 4 ? 28 : label.length > 3 ? 32 : 38) + 'px Jua, sans-serif';\n      ctx.textAlign = 'center';\n      ctx.fillText(label, bx + 56, by + 50);\n      if (!g.done && G.hintGates > 0 && isAnswer) ctx.restore();\n    });\n  });\n\n  G.dust.forEach(function (d) {\n    ctx.globalAlpha = Math.max(0, .5 - d.t); ctx.fillStyle = '#fff';\n    ctx.beginPath(); ctx.arc(d.x - 6, d.y - 2, 5 + d.t * 18, 0, 7); ctx.fill(); ctx.globalAlpha = 1;\n  });\n\n  // 코인\n  G.coins.forEach(function (co) {\n    var w = Math.abs(Math.cos(co.t * 5)) * 16 + 4;\n    ctx.fillStyle = '#F7C948'; ctx.strokeStyle = '#C99A15'; ctx.lineWidth = 3;\n    ctx.beginPath(); ctx.ellipse(co.x, co.y, w / 2, 14, 0, 0, 7); ctx.fill(); ctx.stroke();\n  });\n  // 아이템\n  G.items.forEach(function (im) {\n    var fy = im.y + Math.sin(im.t * 4) * 8;\n    ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.beginPath(); ctx.arc(im.x, fy, 24, 0, 7); ctx.fill();\n    ctx.strokeStyle = '#FFB43D'; ctx.lineWidth = 4; ctx.stroke();\n    ctx.font = '30px serif'; ctx.textAlign = 'center';\n    ctx.fillText(im.kind.icon, im.x, fy + 11);\n  });\n  // 블록 조각\n  G.bits.forEach(function (bt) {\n    ctx.globalAlpha = Math.max(0, 1 - bt.t / .8); ctx.fillStyle = bt.c;\n    ctx.fillRect(bt.x, bt.y, 9, 9); ctx.globalAlpha = 1;\n  });\n\n  if (G.shield > 0) {\n    ctx.strokeStyle = 'rgba(255,196,60,' + (.5 + Math.sin(G.t * 8) * .3) + ')'; ctx.lineWidth = 4;\n    ctx.beginPath(); ctx.arc(G.x + 10, G.y - 36, 38, 0, 7); ctx.stroke();\n  }\n  if (!(G.hurt > 0 && Math.floor(G.hurt * 12) % 2)) {\n    if (G.fever > 0) { ctx.save(); ctx.shadowColor = '#FFD34D'; ctx.shadowBlur = 22; }\n    drawHero(G.x, G.y, G.run, !(G.y >= GROUND - 1 || G.onPlat));\n    if (G.fever > 0) ctx.restore();\n  }\n  if (G.fever > 0) {\n    ctx.fillStyle = 'rgba(255,196,60,' + (.12 + Math.sin(G.t * 14) * .05) + ')'; ctx.fillRect(0, 0, W, H);\n    ctx.fillStyle = '#E58A00'; ctx.font = '30px Jua, sans-serif'; ctx.textAlign = 'left';\n    ctx.fillText('🔥 피버 타임! 점수 2배', 20, 140);\n  }\n\n  G.pops.forEach(function (p) {\n    ctx.globalAlpha = Math.max(0, 1 - p.t); ctx.fillStyle = p.color;\n    ctx.font = '28px Jua, sans-serif'; ctx.textAlign = 'center';\n    ctx.fillText(p.text, p.x, p.y); ctx.globalAlpha = 1;\n  });\n  ctx.restore();\n}\n\nfunction loop(now) {\n  if (!running) return;\n  if (!now) now = Date.now();\n  var dt = Math.min(.05, (now - last) / 1000); last = now;\n  update(dt); draw();\n  requestAnimationFrame(loop);\n}\n\n/* 시작 화면에서도 캐릭터가 달려요 */\nvar idleT = 0;\nfunction idleFrame() {\n  ctx.setTransform(K, 0, 0, K, 0, OFFY);\n  background(idleT, idleT * 120);\n  drawChar(ctx, Math.round(W * .15) + 10, GROUND, idleT * 12, false, hero);\n}\nfunction idleLoop() {\n  if (running) return;\n  idleT += .05;\n  idleFrame();\n  requestAnimationFrame(idleLoop);\n}\n\n/* 고르기 버튼 */\nfunction buildChoices(box, list, isOn, onPick, labelOf) {\n  list.forEach(function (item) {\n    var b = document.createElement('button');\n    b.textContent = labelOf(item);\n    if (isOn(item)) b.className = 'on';\n    b.addEventListener('click', function () {\n      onPick(item);\n      for (var i = 0; i < box.children.length; i++) box.children[i].classList.remove('on');\n      b.classList.add('on');\n    });\n    box.appendChild(b);\n  });\n}\n(function () {\n  var box = document.getElementById('charsel');\n  CHARACTERS.forEach(function (c) {\n    var b = document.createElement('button');\n    b.title = c.name;\n    var mini = document.createElement('canvas');\n    mini.width = 54; mini.height = 54; mini.style.width = '46px'; mini.style.height = '46px';\n    var m = mini.getContext('2d');\n    m.save(); m.translate(27, 50); m.scale(.62, .62); drawChar(m, 0, 0, 1.2, false, c); m.restore();\n    b.appendChild(mini);\n    if (c === hero) b.className = 'on';\n    b.addEventListener('click', function () {\n      hero = c;\n      for (var i = 0; i < box.children.length; i++) box.children[i].classList.remove('on');\n      b.classList.add('on');\n    });\n    box.appendChild(b);\n  });\n})();\nbuildChoices(document.getElementById('opsel'), GRADES,\n  function (g) { return g.g === grade.g; }, function (g) { grade = g; }, function (g) { return g.label; });\nbuildChoices(document.getElementById('lvsel'), SPEEDS,\n  function (v) { return v.key === speedSet.key; }, function (v) { speedSet = v; }, function (v) { return v.label; });\n\nfunction startGame() {\n  if (running) return;\n  document.getElementById('cover').classList.add('hide');\n  newGame();\n  document.getElementById('coins').textContent = '🪙 0';\n  document.getElementById('items').textContent = '';\n  running = true;\n  last = (window.performance && performance.now) ? performance.now() : Date.now();\n  requestAnimationFrame(loop);\n}\ndocument.getElementById('soundBtn').addEventListener('click', function () {\n  soundOn = !soundOn; this.textContent = soundOn ? '🔊' : '🔇';\n  if (soundOn) beep(880, .08);\n});\nshowBest();\ndocument.getElementById('fsBtn').addEventListener('click', function () {\n  var el = document.querySelector('.game');\n  if (document.fullscreenElement) { document.exitFullscreen(); this.textContent = '⛶'; }\n  else if (el.requestFullscreen) { el.requestFullscreen(); this.textContent = '✕'; }\n});\nvar startBtn = document.getElementById('startBtn');\n['click', 'touchend'].forEach(function (ev) {\n  startBtn.addEventListener(ev, function (e) { e.preventDefault(); startGame(); });\n});\ndocument.getElementById('cover').addEventListener('click', function (e) { if (e.target.id === 'cover') startGame(); });\n\nresize();\nidleLoop();\n<\/script>\n<\/body>\n<\/html>\n", "prompt": "쿠키런처럼 옆으로 달리는 수학 게임을 만들어줘. 캐릭터가 계속 달리고, 앞에서 문제와 숫자 두 개가 다가와. 위 발판 위에 숫자 하나, 바닥에 숫자 하나가 있어서 위가 정답이면 점프해서 발판에 올라타고, 아래가 정답이면 그냥 달려. 맞히면 점수가 오르고 틀리면 하트가 하나 줄어. 하트 3개를 다 쓰면 점수가 뜨고 다시 하기. 시작 화면에서 캐릭터(동물 이모지 8개)와 초1~6학년 중 학년과 달리는 속도를 고를 수 있게. 다리가 움직이며 진짜 달리는 것처럼 보이게, 폰에서도 버튼으로 할 수 있게.\n\n고치기 미션: 연속으로 맞히면 콤보 점수 / 달릴수록 빨라지게 / 코인 먹기 추가"}, {"icon": "🎄", "title": "실습 ⑦ 크리스마스 타임캡슐 (심화)", "desc": "편지를 선물 상자에 넣고 크리스마스에 열어요.", "file": "실습7_크리스마스타임캡슐.html", "html": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>우리 반 크리스마스 타임캡슐<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap\" rel=\"stylesheet\">\n<style>\n  :root { --ink:#F3F0FF; --deep:#101736; --card:rgba(255,255,255,.1); --line:rgba(255,255,255,.22);\n          --red:#FF5C6E; --green:#3FD68A; --gold:#FFD34D; --sky:#7CC5FF; }\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n  html, body { height: 100%; }\n  body { font-family: 'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif; color: var(--ink);\n         background: linear-gradient(180deg, #0B1030 0%, #1B2560 45%, #2E3C86 100%); overflow: hidden; }\n  .j, h1, h2, button { font-family: 'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-weight: normal; }\n\n  .snow { position: fixed; inset: 0; pointer-events: none; z-index: 0; }\n  .snow i { position: absolute; top: -10px; color: #fff; opacity: .85; animation: fallSnow linear infinite; }\n  @keyframes fallSnow { to { transform: translateY(105vh) rotate(180deg); } }\n\n  .wrap { position: relative; z-index: 1; height: 100%; max-width: 1500px; margin: 0 auto; padding: 12px 18px 16px;\n          display: flex; flex-direction: column; gap: 10px; }\n  header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }\n  header h1 { font-size: clamp(20px, 2.5vw, 32px); }\n  .chip { background: rgba(255,255,255,.14); border-radius: 999px; padding: 5px 14px; font-size: 15px; }\n  .chip.gold { background: rgba(255,211,77,.22); color: #FFE9A8; }\n  header .right { margin-left: auto; display: flex; gap: 6px; }\n  header .right button { font-size: 15px; border: none; background: rgba(255,255,255,.16); color: #fff; border-radius: 999px; padding: 6px 14px; cursor: pointer; }\n\n  .main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.35fr .65fr; gap: 12px; }\n  .col { display: flex; flex-direction: column; gap: 10px; min-height: 0; }\n\n  .stage { flex: 1; min-height: 0; border-radius: 28px; background: rgba(255,255,255,.07); border: 3px solid var(--line);\n           position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 10px; }\n  .stage svg { width: 100%; height: 100%; }\n  .count { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); text-align: center; }\n  .count .d { font-family: 'Jua', sans-serif; font-size: clamp(28px, 4.5vw, 52px); color: var(--gold); text-shadow: 0 0 22px rgba(255,211,77,.5); }\n  .count .s { font-size: 15px; opacity: .85; }\n\n  .panel { background: var(--card); border: 3px solid var(--line); border-radius: 24px; padding: 14px; min-height: 0; overflow-y: auto; }\n  .panel h2 { font-size: 19px; margin-bottom: 8px; color: #FFE9A8; }\n  .panel.grow { flex: 1; }\n  .qs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }\n  .qs button { font-family: 'Jua', sans-serif; font-size: 14px; border: 3px solid var(--line); background: rgba(255,255,255,.08);\n               color: #fff; border-radius: 999px; padding: 6px 12px; cursor: pointer; }\n  .qs button.on { background: linear-gradient(180deg, #FF8798, var(--red)); border-color: #E1394D; }\n  input[type=text], textarea { width: 100%; border: 3px solid var(--line); border-radius: 14px; padding: 10px 12px;\n                               font: inherit; font-size: 16px; background: rgba(0,0,0,.25); color: #fff; }\n  textarea { height: 120px; resize: none; margin-top: 8px; }\n  .send { width: 100%; margin-top: 10px; font-family: 'Jua', sans-serif; font-size: 20px; border: none; border-radius: 999px;\n          padding: 12px; background: linear-gradient(180deg, #62E6A3, var(--green)); color: #06351F; cursor: pointer; box-shadow: 0 6px 0 #21A967; }\n  .send:active { transform: translateY(4px); box-shadow: 0 2px 0 #21A967; }\n  .names { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }\n  .names span { background: rgba(255,255,255,.12); border-radius: 999px; padding: 4px 12px; font-size: 14px; }\n  .teacher { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }\n  .teacher button { font-size: 14px; border: 3px solid var(--line); background: rgba(255,255,255,.08); color: #fff; border-radius: 999px; padding: 6px 12px; cursor: pointer; }\n\n  /* 편지 보기 */\n  .letter { position: absolute; inset: 0; background: rgba(8,12,36,.92); display: none; align-items: center; justify-content: center; z-index: 5; padding: 18px; }\n  .letter.show { display: flex; }\n  .paper { background: #FFF9EC; color: #3A3050; border-radius: 26px; padding: 26px 28px; width: min(640px, 100%); max-height: 90%; overflow-y: auto;\n           box-shadow: 0 18px 40px rgba(0,0,0,.4); animation: pop .35s ease-out; }\n  @keyframes pop { from { transform: scale(.7) rotate(-3deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }\n  .paper .q { font-family: 'Jua', sans-serif; color: #E1394D; font-size: 18px; }\n  .paper .who { font-family: 'Jua', sans-serif; font-size: 26px; margin: 4px 0 12px; }\n  .paper .body { font-size: 20px; line-height: 1.7; white-space: pre-wrap; }\n  .paper .when { font-size: 14px; color: #8E86A8; margin-top: 14px; }\n  .paper .btns { display: flex; gap: 8px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }\n  .paper button { font-family: 'Jua', sans-serif; font-size: 17px; border: none; border-radius: 999px; padding: 10px 20px; cursor: pointer;\n                  background: #3A3050; color: #fff; }\n  .paper button.ghost { background: #EDE7F6; color: #3A3050; }\n\n  .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); background: #fff; color: #1B2560;\n           font-family: 'Jua', sans-serif; padding: 10px 22px; border-radius: 999px; opacity: 0; transition: opacity .25s; z-index: 9; }\n  .toast.show { opacity: 1; }\n\n  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 4px solid var(--gold); outline-offset: 2px; }\n  @media (prefers-reduced-motion: reduce) { .snow i, .paper { animation: none; } }\n  @media (max-width: 900px) {\n    body { overflow: auto; } .wrap { height: auto; }\n    .main { grid-template-columns: 1fr; } .stage { min-height: 380px; }\n  }\n<\/style>\n<\/head>\n<body>\n<div class=\"snow\" id=\"snow\"><\/div>\n\n<div class=\"wrap\">\n  <header>\n    <h1>🎄 우리 반 크리스마스 타임캡슐<\/h1>\n    <span class=\"chip\" id=\"countChip\">🎁 0개<\/span>\n    <span class=\"chip gold\" id=\"lockChip\">🔒 잠겨 있어요<\/span>\n    <div class=\"right\">\n      <button id=\"fsBtn\" title=\"전체 화면\">⛶<\/button>\n    <\/div>\n  <\/header>\n\n  <div class=\"main\">\n    <div class=\"col\">\n      <div class=\"stage\" id=\"stage\">\n        <div class=\"count\">\n          <div class=\"d\" id=\"dday\"><\/div>\n          <div class=\"s\" id=\"ddaySub\"><\/div>\n        <\/div>\n        <svg id=\"scene\" viewBox=\"0 0 520 360\" preserveAspectRatio=\"xMidYMax meet\" aria-label=\"크리스마스 트리와 선물\"><\/svg>\n\n        <div class=\"letter\" id=\"letter\">\n          <div class=\"paper\">\n            <div class=\"q\" id=\"lq\"><\/div>\n            <div class=\"who\" id=\"lwho\"><\/div>\n            <div class=\"body\" id=\"lbody\"><\/div>\n            <div class=\"when\" id=\"lwhen\"><\/div>\n            <div class=\"btns\">\n              <button class=\"ghost\" id=\"lPrev\">◀ 이전<\/button>\n              <button class=\"ghost\" id=\"lNext\">다음 ▶<\/button>\n              <button id=\"lClose\">닫기<\/button>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"col\">\n      <div class=\"panel\">\n        <h2>✏️ 타임캡슐에 넣기<\/h2>\n        <div class=\"qs\" id=\"qs\"><\/div>\n        <input type=\"text\" id=\"who\" maxlength=\"12\" placeholder=\"내 이름 (별명도 좋아요)\" autocomplete=\"off\">\n        <textarea id=\"body\" maxlength=\"300\" placeholder=\"크리스마스의 나에게 하고 싶은 말을 써 보세요\"><\/textarea>\n        <button class=\"send\" id=\"sendBtn\">🎁 선물 상자에 넣기<\/button>\n        <div class=\"names\" id=\"names\"><\/div>\n      <\/div>\n\n      <div class=\"panel grow\">\n        <h2>🔑 선생님 메뉴<\/h2>\n        <p style=\"font-size:15px;opacity:.85;line-height:1.6\">\n          내용은 여는 날까지 아무도 볼 수 없어요. 개수와 이름만 보입니다.<br>\n          이 기기(브라우저)에만 저장되니, 연수에서는 한 대에 띄워 두고 돌아가며 써 보세요.\n        <\/p>\n        <div class=\"teacher\">\n          <button id=\"peekBtn\">🔓 미리 열어 보기<\/button>\n          <button id=\"resetBtn\">🗑 모두 지우기<\/button>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n<div class=\"toast\" id=\"toast\"><\/div>\n\n<script>\n/* ▼ 고치는 부분 ─────────────────────────────────── */\nvar OPEN_DATE = '2026-12-25';         // 타임캡슐을 여는 날\nvar TEACHER_CODE = '1225';            // 미리 열어 볼 때 쓰는 선생님 비밀번호\nvar QUESTIONS = [\n  '올해 가장 기뻤던 일',\n  '크리스마스의 나에게',\n  '고마운 친구에게',\n  '내년에 해 보고 싶은 일',\n  '지금 내 꿈은'\n];\n/* ▲ 고치는 부분 끝 ───────────────────────────────── */\n\nvar KEY = 'xmas-capsule-v1';\nvar caps = [], q = QUESTIONS[0], unlocked = false, lIdx = 0;\ntry { caps = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { caps = []; }\nfunction save() { try { localStorage.setItem(KEY, JSON.stringify(caps)); } catch (e) { toast('이 브라우저에 저장할 수 없어요'); } }\nvar $ = function (id) { return document.getElementById(id); };\nfunction esc(t) { return String(t).replace(/[&<>\"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]; }); }\nfunction toast(m) { var t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove('show'); }, 2000); }\n\nvar AC = null;\nfunction beep(f, dur, type, vol) {\n  try {\n    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();\n    var o = AC.createOscillator(), g = AC.createGain();\n    o.type = type || 'triangle'; o.frequency.value = f; g.gain.value = vol || .05;\n    o.connect(g); g.connect(AC.destination); o.start();\n    g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + (dur || .12));\n    o.stop(AC.currentTime + (dur || .12) + .02);\n  } catch (e) {}\n}\nfunction jingle() { [784, 988, 1175, 1568].forEach(function (f, i) { setTimeout(function () { beep(f, .14); }, i * 110); }); }\n\n/* 눈 내리기 */\n(function () {\n  var box = $('snow');\n  for (var i = 0; i < 60; i++) {\n    var s = document.createElement('i');\n    s.textContent = ['❄', '❅', '•'][i % 3];\n    s.style.left = Math.random() * 100 + '%';\n    s.style.fontSize = (8 + Math.random() * 16) + 'px';\n    s.style.animationDuration = (7 + Math.random() * 9) + 's';\n    s.style.animationDelay = (-Math.random() * 12) + 's';\n    box.appendChild(s);\n  }\n})();\n\n/* D-day */\nfunction daysLeft() {\n  var open = new Date(OPEN_DATE + 'T00:00:00');\n  var now = new Date(); now.setHours(0, 0, 0, 0);\n  return Math.round((open - now) / 86400000);\n}\nfunction isOpenDay() { return daysLeft() <= 0; }\n\n/* 트리와 선물 그리기 */\nfunction drawScene() {\n  var n = caps.length, g = '';\n  g += '<rect x=\"0\" y=\"286\" width=\"520\" height=\"74\" fill=\"#F2F6FF\" opacity=\".92\"/>';\n  g += '<path d=\"M0 292 q90 -18 170 0 t180 -2 q90 -14 170 4 L520 360 L0 360Z\" fill=\"#FFFFFF\" opacity=\".9\"/>';\n  // 별\n  g += '<g><path d=\"M260 22 l7 16 17 2 -12 12 3 17 -15 -8 -15 8 3 -17 -12 -12 17 -2Z\" fill=\"#FFD34D\"/><\/g>';\n  // 트리\n  [[62, 120], [96, 152], [132, 186]].forEach(function (t, i) {\n    var y = 92 + i * 52;\n    g += '<path d=\"M260 ' + y + ' l' + t[1] / 2 + ' ' + (t[0] + 20) + ' h-' + t[1] + 'Z\" fill=\"' + ['#2FA36A', '#279059', '#1F7D4C'][i] + '\"/>';\n  });\n  g += '<rect x=\"246\" y=\"286\" width=\"28\" height=\"26\" rx=\"6\" fill=\"#7A4A26\"/>';\n  // 트리 장식 (선물 수만큼 반짝)\n  var orn = Math.min(18, n);\n  for (var o = 0; o < orn; o++) {\n    var oy = 130 + (o % 6) * 26, ox = 260 + ((o % 2 ? 1 : -1) * (14 + (o % 5) * 12));\n    g += '<circle cx=\"' + ox + '\" cy=\"' + oy + '\" r=\"6\" fill=\"' + ['#FF5C6E', '#FFD34D', '#7CC5FF', '#FF9EC4'][o % 4] + '\">' +\n         '<animate attributeName=\"opacity\" values=\"1;.35;1\" dur=\"' + (1.6 + (o % 4) * .4) + 's\" repeatCount=\"indefinite\"/><\/circle>';\n  }\n  // 선물 상자\n  var cols = [['#FF5C6E', '#FFD34D'], ['#7CC5FF', '#FF5C6E'], ['#FFD34D', '#3FD68A'], ['#C4A6FF', '#FFD34D'], ['#3FD68A', '#FF9EC4']];\n  for (var i2 = 0; i2 < n; i2++) {\n    var side = i2 % 2, k = Math.floor(i2 / 2);          // 트리 양옆으로 나란히 쌓아요\n    var row = Math.floor(k / 4), col = k % 4;\n    var baseX = side ? 318 : 48;\n    var bx = baseX + col * 38 + (row % 2 ? 16 : 0), by = 302 - row * 34;\n    var c = cols[i2 % cols.length], size = 30;\n    g += '<g class=\"gift\" data-i=\"' + i2 + '\" style=\"cursor:pointer\">' +\n         '<rect x=\"' + bx + '\" y=\"' + by + '\" width=\"' + size + '\" height=\"' + size + '\" rx=\"5\" fill=\"' + c[0] + '\"/>' +\n         '<rect x=\"' + (bx + size / 2 - 3) + '\" y=\"' + by + '\" width=\"6\" height=\"' + size + '\" fill=\"' + c[1] + '\"/>' +\n         '<rect x=\"' + bx + '\" y=\"' + (by + size / 2 - 3) + '\" width=\"' + size + '\" height=\"6\" fill=\"' + c[1] + '\"/>' +\n         '<path d=\"M' + (bx + size / 2) + ' ' + by + ' q-10 -12 -2 -12 q6 0 2 12 q10 -12 2 -12 q-6 0 -2 12Z\" fill=\"' + c[1] + '\"/><\/g>';\n  }\n  if (!n) g += '<text x=\"260\" y=\"330\" text-anchor=\"middle\" font-size=\"16\" fill=\"#3A3050\" font-family=\"Jua, sans-serif\">아직 선물이 없어요. 첫 번째로 넣어 볼까요?<\/text>';\n  $('scene').innerHTML = g;\n  [].forEach.call($('scene').querySelectorAll('.gift'), function (el) {\n    el.addEventListener('click', function () { openLetter(parseInt(el.dataset.i, 10)); });\n  });\n}\n\n/* 편지 열기 */\nfunction openLetter(i) {\n  if (!unlocked && !isOpenDay()) { beep(220, .18, 'sawtooth'); toast('🔒 ' + daysLeft() + '일 더 기다려야 열려요!'); return; }\n  lIdx = i; showLetter();\n}\nfunction showLetter() {\n  var c = caps[lIdx]; if (!c) return;\n  $('lq').textContent = c.q;\n  $('lwho').textContent = c.who + ' 의 편지';\n  $('lbody').textContent = c.body;\n  $('lwhen').textContent = c.at + ' 에 넣었어요 · ' + (lIdx + 1) + ' / ' + caps.length;\n  $('letter').classList.add('show');\n  jingle();\n}\n\n/* 보여주기 */\nfunction render() {\n  var n = caps.length;\n  $('countChip').textContent = '🎁 ' + n + '개';\n  var d = daysLeft();\n  $('dday').textContent = d > 0 ? 'D-' + d : (d === 0 ? '🎄 오늘이 여는 날!' : '🎁 열어 보세요');\n  $('ddaySub').textContent = d > 0 ? OPEN_DATE + ' 에 열어요' : '선물 상자를 눌러 편지를 읽어요';\n  $('lockChip').textContent = (unlocked || isOpenDay()) ? '🔓 열 수 있어요' : '🔒 잠겨 있어요';\n  $('names').innerHTML = caps.map(function (c) { return '<span>' + esc(c.who) + '<\/span>'; }).join('');\n  drawScene();\n}\n\n/* 질문 버튼 */\nQUESTIONS.forEach(function (text, i) {\n  var b = document.createElement('button');\n  b.textContent = text;\n  if (i === 0) b.className = 'on';\n  b.addEventListener('click', function () {\n    q = text;\n    [].forEach.call($('qs').children, function (x) { x.classList.remove('on'); });\n    b.classList.add('on');\n    $('body').placeholder = text + ' 을(를) 써 보세요';\n    beep(880, .08);\n  });\n  $('qs').appendChild(b);\n});\n\n$('sendBtn').addEventListener('click', function () {\n  var who = $('who').value.trim(), body = $('body').value.trim();\n  if (!who) { toast('이름을 써 주세요'); $('who').focus(); return; }\n  if (!body) { toast('하고 싶은 말을 써 주세요'); $('body').focus(); return; }\n  var now = new Date();\n  caps.push({ who: who, q: q, body: body, at: (now.getMonth() + 1) + '월 ' + now.getDate() + '일' });\n  save(); $('body').value = ''; render();\n  jingle(); toast('🎁 선물 상자에 담았어요!');\n});\n$('lClose').addEventListener('click', function () { $('letter').classList.remove('show'); });\n$('lPrev').addEventListener('click', function () { lIdx = (lIdx - 1 + caps.length) % caps.length; showLetter(); });\n$('lNext').addEventListener('click', function () { lIdx = (lIdx + 1) % caps.length; showLetter(); });\n$('peekBtn').addEventListener('click', function () {\n  if (unlocked) { unlocked = false; render(); toast('다시 잠갔어요 🔒'); return; }\n  var code = prompt('선생님 비밀번호를 넣어 주세요');\n  if (code === TEACHER_CODE) { unlocked = true; render(); toast('잠금을 풀었어요 🔓'); }\n  else if (code !== null) toast('비밀번호가 달라요');\n});\n$('resetBtn').addEventListener('click', function () {\n  if (!confirm('타임캡슐을 모두 지울까요? 되돌릴 수 없어요.')) return;\n  caps = []; save(); render(); toast('비웠어요');\n});\n$('fsBtn').addEventListener('click', function () {\n  if (document.fullscreenElement) { document.exitFullscreen(); this.textContent = '⛶'; }\n  else if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen(); this.textContent = '✕'; }\n});\ndocument.addEventListener('keydown', function (e) { if (e.key === 'Escape') $('letter').classList.remove('show'); });\n\n$('body').placeholder = QUESTIONS[0] + ' 을(를) 써 보세요';\nrender();\n<\/script>\n<\/body>\n<\/html>\n", "prompt": "한 문장씩 차례로 넣어 보세요. 한 단계마다 결과를 눌러 보고 다음으로 넘어갑니다.\n\n1단계 · 기본 만들기\n우리 반 크리스마스 타임캡슐 사이트를 만들어줘. 이름과 하고 싶은 말을 써서 넣으면 화면의 크리스마스트리 아래에 선물 상자가 하나씩 쌓여. 초등학생용으로 크고 예쁘게.\n\n2단계 · 잠그기\n넣은 내용은 크리스마스까지 아무도 못 보게 잠가줘. 화면에는 선물 개수와 이름만 보이게.\n\n3단계 · 며칠 남았는지\n크리스마스까지 며칠 남았는지 D-90처럼 크게 보여줘. 잠긴 선물을 누르면 \"90일 더 기다려야 열려요!\"라고 알려주고.\n\n4단계 · 열어 보기\n크리스마스가 되면 선물을 눌러 편지를 읽을 수 있게 해줘. 이전·다음으로 넘겨 보고, 선생님 비밀번호로 미리 열어 보는 것도 되게.\n\n5단계 · 무엇을 쓸지 도와주기\n'올해 가장 기뻤던 일', '크리스마스의 나에게', '고마운 친구에게' 같은 질문을 버튼으로 골라서 쓰게 해줘.\n\n6단계 · 분위기 내기\n밤하늘에 눈이 내리고 트리에 전구가 반짝이게 해줘. 편지를 넣으면 종소리가 나고.\n\n※ 지금은 한 기기(브라우저)에만 저장돼요. 아이들이 각자 패드로 쓰게 하려면 실습 ⑤처럼 구글 시트(Apps Script) 연결이 필요합니다."}, {"icon": "🌷", "title": "실습 ⑧ 우리 반 기분 꽃밭 (심화)", "desc": "매일 기분을 기록하고 연속 참여 별을 모아요.", "file": "실습3_오늘의기분판_플러스.html", "html": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>우리 반 기분 꽃밭<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap\" rel=\"stylesheet\">\n<style>\n  :root {\n    --sky: #DDF1FF; --grass: #B8E6A5; --soil: #F6E3C4; --ink: #4A3B5C;\n    --muted: #8C7FA3; --card: #FFFFFF; --pink: #FF8FB1; --line: #F2E6F7;\n  }\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n  body {\n    font-family: 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;\n    color: var(--ink); min-height: 100vh;\n    background: linear-gradient(180deg, var(--sky) 0%, var(--sky) 55%, var(--grass) 55%, var(--grass) 100%);\n    background-attachment: fixed;\n  }\n  .j, h1, h2, button { font-family: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-weight: normal; }\n  .wrap { max-width: 1000px; margin: 0 auto; padding: 22px 16px 48px; }\n\n  header { text-align: center; position: relative; }\n  .sun { font-size: 46px; position: absolute; right: 6px; top: -4px; }\n  .date { display: inline-block; background: #fff; border-radius: 999px; padding: 6px 18px; font-size: 18px; color: var(--muted); }\n  h1 { font-size: clamp(32px, 7vw, 56px); margin: 8px 0 2px; }\n  .hello { font-size: 18px; color: var(--muted); }\n\n  /* 기분 꽃밭 요약 */\n  .garden {\n    margin: 22px auto 24px; background: var(--soil); border-radius: 28px;\n    padding: 14px 18px; border: 4px dashed #E8CFA3; text-align: center;\n  }\n  .garden .flowers { font-size: 38px; min-height: 50px; letter-spacing: 4px; line-height: 1.3; }\n  .garden .empty { font-size: 17px; color: #B49A74; padding: 10px 0; }\n  .counts { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; }\n  .counts span { background: #fff; border-radius: 999px; padding: 3px 12px; font-size: 16px; }\n\n  /* 학생 카드 */\n  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }\n  .kid {\n    background: var(--card); border-radius: 26px; padding: 14px 10px 12px; text-align: center;\n    border: 4px solid var(--line); cursor: pointer; position: relative; transition: transform .15s;\n  }\n  .kid:hover { transform: translateY(-3px); }\n  .kid:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }\n  .kid.done { border-color: var(--c, var(--pink)); background: var(--bg, #fff); }\n  .kid .face { font-size: 50px; line-height: 1.1; }\n  .kid .mood { position: absolute; top: 8px; right: 10px; font-size: 30px; }\n  .kid .name { font-family: 'Jua', sans-serif; font-size: 22px; margin: 4px 0; }\n  .kid .state { font-size: 14px; color: var(--muted); min-height: 20px; }\n  .week { display: flex; justify-content: center; gap: 4px; margin-top: 8px; }\n  .week i { width: 18px; height: 18px; border-radius: 50%; background: #F1EDF5; font-style: normal; font-size: 11px; line-height: 18px; }\n  .week i.on { background: #FFE27A; }\n  .week i.today { outline: 2px solid var(--pink); }\n  .streak { font-size: 13px; color: #E07A00; margin-top: 4px; min-height: 18px; }\n\n  /* 고르기 창 */\n  .modal { position: fixed; inset: 0; background: rgba(74,59,92,.45); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 20; }\n  .modal.show { display: flex; }\n  .box { background: #fff; border-radius: 32px; padding: 26px 22px; width: min(560px, 100%); text-align: center; animation: pop .25s ease-out; }\n  .box h2 { font-size: 30px; }\n  .box .q { color: var(--muted); margin: 4px 0 16px; font-size: 17px; }\n  .moods { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }\n  .moods button {\n    border: 4px solid transparent; border-radius: 22px; padding: 10px 2px; cursor: pointer;\n    background: var(--bg); color: var(--ink); font-size: 16px;\n  }\n  .moods button b { display: block; font-size: 40px; font-weight: normal; line-height: 1.2; }\n  .moods button.on { border-color: var(--c); transform: scale(1.06); }\n  .note-area { display: none; margin-top: 16px; text-align: left; }\n  .note-area.show { display: block; }\n  .note-area label { font-family: 'Jua', sans-serif; font-size: 18px; }\n  .note-area textarea { width: 100%; margin-top: 6px; border: 3px solid var(--line); border-radius: 16px; padding: 10px 12px; font: inherit; font-size: 17px; resize: none; }\n  .actions { display: flex; gap: 10px; justify-content: center; margin-top: 18px; }\n  .actions button { font-size: 22px; border: none; border-radius: 999px; padding: 10px 28px; cursor: pointer; }\n  .ok { background: var(--pink); color: #fff; }\n  .ok:disabled { opacity: .4; cursor: default; }\n  .cancel { background: #F1EDF5; color: var(--ink); }\n  button:focus-visible { outline: 4px solid var(--ink); outline-offset: 2px; }\n\n  .yay { position: fixed; inset: 0; pointer-events: none; display: none; align-items: center; justify-content: center; z-index: 30; }\n  .yay.show { display: flex; }\n  .yay div { background: #fff; border-radius: 30px; padding: 20px 34px; font-family: 'Jua', sans-serif; font-size: clamp(26px, 5vw, 38px); box-shadow: 0 10px 0 rgba(74,59,92,.15); animation: pop .3s ease-out; text-align: center; }\n\n  /* 선생님 기록 */\n  .teacher { margin-top: 30px; text-align: center; }\n  .teacher > button { font-size: 18px; background: #fff; color: var(--ink); border: 3px solid #fff; border-radius: 999px; padding: 8px 20px; cursor: pointer; }\n  .record { display: none; margin-top: 14px; background: #fff; border-radius: 24px; padding: 16px; overflow-x: auto; }\n  .record.show { display: block; }\n  table { border-collapse: collapse; width: 100%; min-width: 520px; }\n  th, td { padding: 8px 6px; text-align: center; border-bottom: 2px solid var(--line); }\n  th { font-family: 'Jua', sans-serif; font-weight: normal; font-size: 17px; }\n  td { font-size: 24px; }\n  td.nm { font-family: 'Jua', sans-serif; font-size: 18px; text-align: left; }\n  td small { display: block; font-size: 12px; color: var(--muted); max-width: 110px; margin: 0 auto; }\n  .reset { margin-top: 12px; font-size: 15px; background: none; border: none; color: var(--muted); text-decoration: underline; cursor: pointer; }\n\n  @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }\n  @keyframes sway { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }\n  .sun { animation: sway 4s ease-in-out infinite; }\n  @media (prefers-reduced-motion: reduce) { .sun, .box, .yay div { animation: none; } .kid { transition: none; } }\n  @media (max-width: 480px) { .moods { grid-template-columns: repeat(3, 1fr); } }\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <header>\n    <span class=\"sun\" aria-hidden=\"true\">🌤️<\/span>\n    <span class=\"date\" id=\"date\"><\/span>\n    <h1>🌷 우리 반 기분 꽃밭 🌷<\/h1>\n    <p class=\"hello\">내 이름을 눌러서 오늘 기분을 심어 주세요<\/p>\n  <\/header>\n\n  <section class=\"garden\" aria-label=\"오늘의 기분 꽃밭\">\n    <div class=\"flowers\" id=\"flowers\"><\/div>\n    <div class=\"counts\" id=\"counts\"><\/div>\n  <\/section>\n\n  <main class=\"grid\" id=\"grid\"><\/main>\n\n  <div class=\"teacher\">\n    <button id=\"recBtn\">📒 이번 주 기록 보기<\/button>\n    <div class=\"record\" id=\"record\">\n      <table id=\"table\"><\/table>\n      <button class=\"reset\" id=\"resetBtn\">기록 모두 지우기<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div class=\"modal\" id=\"modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"mTitle\">\n  <div class=\"box\">\n    <h2 id=\"mTitle\"><\/h2>\n    <p class=\"q\">오늘 기분은 어때요?<\/p>\n    <div class=\"moods\" id=\"moods\"><\/div>\n    <div class=\"note-area\" id=\"noteArea\">\n      <label for=\"note\">선생님께 한마디 (안 써도 괜찮아요)<\/label>\n      <textarea id=\"note\" rows=\"2\" maxlength=\"60\" placeholder=\"무슨 일이 있었는지 살짝 알려 줄래요?\"><\/textarea>\n    <\/div>\n    <div class=\"actions\">\n      <button class=\"cancel\" id=\"cancelBtn\">닫기<\/button>\n      <button class=\"ok\" id=\"okBtn\" disabled>심기 🌱<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div class=\"yay\" id=\"yay\"><div id=\"yayText\"><\/div><\/div>\n\n<script>\n/* ▼ 고치는 부분 ───────────────────────────────── */\n// 실습용 가짜 이름이에요. 실제로 쓸 때도 별명이나 번호를 추천해요.\nvar STUDENTS = [\n  { name: '토끼', face: '🐰' },\n  { name: '곰돌이', face: '🐻' },\n  { name: '여우', face: '🦊' },\n  { name: '판다', face: '🐼' },\n  { name: '고양이', face: '🐱' },\n  { name: '강아지', face: '🐶' },\n  { name: '병아리', face: '🐥' },\n  { name: '햄스터', face: '🐹' }\n];\n// flower: 꽃밭에 피는 꽃, ask: 한마디 칸을 보여줄지\nvar MOODS = [\n  { key: 'great', emoji: '🤩', label: '신나요',   flower: '🌻', color: '#FFB800', bg: '#FFF4CC', ask: false },\n  { key: 'good',  emoji: '😊', label: '좋아요',   flower: '🌷', color: '#FF8FB1', bg: '#FFE6EF', ask: false },\n  { key: 'soso',  emoji: '😐', label: '그냥요',   flower: '🌱', color: '#6CC08B', bg: '#E4F6EA', ask: false },\n  { key: 'sad',   emoji: '😢', label: '속상해요', flower: '🌧️', color: '#5EA8F2', bg: '#E2F0FF', ask: true },\n  { key: 'angry', emoji: '😠', label: '화나요',   flower: '🌵', color: '#F2705E', bg: '#FFE4E0', ask: true }\n];\n/* ▲ 고치는 부분 끝 ─────────────────────────────── */\n\nvar KEY = 'mood-garden-v1';\nvar DAYS = ['일', '월', '화', '수', '목', '금', '토'];\n\nfunction dayKey(d) {\n  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');\n}\nvar today = new Date();\nvar TODAY = dayKey(today);\n\n// 기록: { '2026-09-29': { '토끼': { mood: 'good', note: '' } } }\nvar log = {};\ntry { log = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { log = {}; }\nfunction save() { try { localStorage.setItem(KEY, JSON.stringify(log)); } catch (e) {} }\n\nfunction moodOf(k) { return MOODS.find(function (m) { return m.key === k; }); }\nfunction thisWeek() { // 월~금\n  var d = new Date(today); var diff = (d.getDay() + 6) % 7; d.setDate(d.getDate() - diff);\n  var out = []; for (var i = 0; i < 5; i++) { var x = new Date(d); x.setDate(d.getDate() + i); out.push(x); } return out;\n}\nfunction streak(name) { // 오늘(또는 어제)부터 거꾸로, 주말은 건너뛰고 연속 참여일\n  var n = 0, d = new Date(today);\n  if (!(log[TODAY] && log[TODAY][name])) d.setDate(d.getDate() - 1);\n  for (var guard = 0; guard < 400; guard++) {\n    var wd = d.getDay();\n    if (wd === 0 || wd === 6) { d.setDate(d.getDate() - 1); continue; }\n    var k = dayKey(d);\n    if (log[k] && log[k][name]) { n++; d.setDate(d.getDate() - 1); } else break;\n  }\n  return n;\n}\n\ndocument.getElementById('date').textContent =\n  today.getFullYear() + '년 ' + (today.getMonth() + 1) + '월 ' + today.getDate() + '일 ' + DAYS[today.getDay()] + '요일';\n\nfunction render() {\n  var todayLog = log[TODAY] || {};\n  var week = thisWeek();\n\n  // 꽃밭\n  var fl = document.getElementById('flowers');\n  var picked = STUDENTS.filter(function (s) { return todayLog[s.name]; });\n  if (!picked.length) fl.innerHTML = '<div class=\"empty\">아직 꽃이 없어요. 첫 번째로 심어 볼까요?<\/div>';\n  else fl.textContent = picked.map(function (s) { return moodOf(todayLog[s.name].mood).flower; }).join('');\n  document.getElementById('counts').innerHTML = MOODS.map(function (m) {\n    var c = picked.filter(function (s) { return todayLog[s.name].mood === m.key; }).length;\n    return c ? '<span>' + m.emoji + ' ' + m.label + ' ' + c + '명<\/span>' : '';\n  }).join('') + '<span>🙋 참여 ' + picked.length + ' / ' + STUDENTS.length + '<\/span>';\n\n  // 카드\n  var grid = document.getElementById('grid');\n  grid.innerHTML = '';\n  STUDENTS.forEach(function (s, i) {\n    var t = todayLog[s.name]; var m = t ? moodOf(t.mood) : null;\n    var el = document.createElement('div');\n    el.className = 'kid' + (m ? ' done' : '');\n    el.tabIndex = 0; el.setAttribute('role', 'button');\n    if (m) { el.style.setProperty('--c', m.color); el.style.setProperty('--bg', m.bg); }\n    var st = streak(s.name);\n    el.innerHTML =\n      (m ? '<span class=\"mood\">' + m.emoji + '<\/span>' : '') +\n      '<div class=\"face\">' + s.face + '<\/div>' +\n      '<div class=\"name\"><\/div>' +\n      '<div class=\"state\">' + (m ? m.label : '아직이에요') + '<\/div>' +\n      '<div class=\"week\">' + week.map(function (d) {\n        var k = dayKey(d), on = log[k] && log[k][s.name];\n        return '<i class=\"' + (on ? 'on' : '') + (k === TODAY ? ' today' : '') + '\" title=\"' + DAYS[d.getDay()] + '\">' + (on ? '⭐' : DAYS[d.getDay()]) + '<\/i>';\n      }).join('') + '<\/div>' +\n      '<div class=\"streak\">' + (st >= 2 ? '🔥 ' + st + '일 연속!' : '') + '<\/div>';\n    el.querySelector('.name').textContent = s.name;\n    el.setAttribute('aria-label', s.name + ' 기분 고르기');\n    el.addEventListener('click', function () { openPick(i); });\n    el.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPick(i); } });\n    grid.appendChild(el);\n  });\n\n  if (document.getElementById('record').classList.contains('show')) renderTable();\n}\n\n// 고르기 창\nvar cur = null, sel = null;\nvar moodsEl = document.getElementById('moods');\nMOODS.forEach(function (m) {\n  var b = document.createElement('button');\n  b.style.setProperty('--bg', m.bg); b.style.setProperty('--c', m.color);\n  b.innerHTML = '<b>' + m.emoji + '<\/b>' + m.label;\n  b.addEventListener('click', function () { pickMood(m.key); });\n  b.dataset.k = m.key;\n  moodsEl.appendChild(b);\n});\nfunction pickMood(k) {\n  sel = k;\n  [].forEach.call(moodsEl.children, function (b) { b.classList.toggle('on', b.dataset.k === k); });\n  document.getElementById('noteArea').classList.toggle('show', moodOf(k).ask);\n  document.getElementById('okBtn').disabled = false;\n}\nfunction openPick(i) {\n  cur = i; var s = STUDENTS[i]; var t = (log[TODAY] || {})[s.name];\n  document.getElementById('mTitle').textContent = s.face + ' ' + s.name;\n  document.getElementById('note').value = t ? (t.note || '') : '';\n  sel = null; document.getElementById('okBtn').disabled = true;\n  document.getElementById('noteArea').classList.remove('show');\n  [].forEach.call(moodsEl.children, function (b) { b.classList.remove('on'); });\n  if (t) pickMood(t.mood);\n  document.getElementById('modal').classList.add('show');\n  moodsEl.children[0].focus();\n}\nfunction closePick() { document.getElementById('modal').classList.remove('show'); }\ndocument.getElementById('cancelBtn').addEventListener('click', closePick);\ndocument.getElementById('modal').addEventListener('click', function (e) { if (e.target.id === 'modal') closePick(); });\ndocument.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePick(); });\ndocument.getElementById('okBtn').addEventListener('click', function () {\n  if (cur === null || !sel) return;\n  var s = STUDENTS[cur], m = moodOf(sel);\n  log[TODAY] = log[TODAY] || {};\n  log[TODAY][s.name] = { mood: sel, note: m.ask ? document.getElementById('note').value.trim() : '' };\n  save(); closePick(); render();\n  var st = streak(s.name);\n  var msg = m.ask ? '알려 줘서 고마워요 ' + m.flower + '<br><span style=\"font-size:.7em\">선생님이 곧 이야기 들어 줄게요<\/span>'\n                  : s.face + ' ' + m.flower + ' 쑥쑥!' + (st >= 3 ? '<br><span style=\"font-size:.7em\">🔥 ' + st + '일 연속 참여!<\/span>' : '');\n  var y = document.getElementById('yay');\n  document.getElementById('yayText').innerHTML = msg;\n  y.classList.add('show'); clearTimeout(y._h); y._h = setTimeout(function () { y.classList.remove('show'); }, 1600);\n});\n\n// 선생님 기록\nfunction renderTable() {\n  var week = thisWeek();\n  var h = '<tr><th><\/th>' + week.map(function (d) { return '<th>' + (d.getMonth() + 1) + '/' + d.getDate() + ' ' + DAYS[d.getDay()] + '<\/th>'; }).join('') + '<\/tr>';\n  STUDENTS.forEach(function (s) {\n    h += '<tr><td class=\"nm\">' + s.face + ' <span data-n><\/span><\/td>' + week.map(function (d) {\n      var t = (log[dayKey(d)] || {})[s.name];\n      if (!t) return '<td style=\"color:#D9D0E3;font-size:16px\">·<\/td>';\n      return '<td>' + moodOf(t.mood).emoji + (t.note ? '<small data-note><\/small>' : '') + '<\/td>';\n    }).join('') + '<\/tr>';\n  });\n  var table = document.getElementById('table');\n  table.innerHTML = h;\n  // 이름과 한마디는 글자 그대로 넣기\n  var rows = table.querySelectorAll('tr');\n  STUDENTS.forEach(function (s, i) {\n    var r = rows[i + 1]; r.querySelector('[data-n]').textContent = s.name;\n    var cells = r.querySelectorAll('td');\n    week.forEach(function (d, j) {\n      var t = (log[dayKey(d)] || {})[s.name]; var sm = cells[j + 1].querySelector('[data-note]');\n      if (sm && t) sm.textContent = '“' + t.note + '”';\n    });\n  });\n}\ndocument.getElementById('recBtn').addEventListener('click', function () {\n  var r = document.getElementById('record'); var on = r.classList.toggle('show');\n  this.textContent = on ? '📒 기록 닫기' : '📒 이번 주 기록 보기';\n  if (on) renderTable();\n});\ndocument.getElementById('resetBtn').addEventListener('click', function () {\n  if (confirm('지금까지의 기분 기록을 모두 지울까요?')) { log = {}; save(); render(); }\n});\n\nrender();\n<\/script>\n<\/body>\n<\/html>\n", "prompt": "기본 기분판에서 이렇게 한 문장씩 덧붙였어요.\n① 오늘 날짜를 자동으로 보여줘.\n② 기분을 5개로 늘리고, 고르면 반 꽃밭에 꽃이 하나씩 피게 해줘.\n③ 새로고침해도 지워지지 않게, 날짜별로 기록해 줘.\n④ 카드에 이번 주 월~금 참여 별과 연속 참여 일수를 보여줘.\n⑤ 😢나 😠를 고르면 선생님께 한마디 쓰는 칸이 나오게 해줘.\n⑥ 선생님이 이번 주 기록을 표로 볼 수 있게 해줘."}, {"icon": "🎄", "title": "실습 ⑨ 우리 반 소원 트리 (심화)", "desc": "소원을 적어 장식으로 만들어 트리에 걸어요.", "file": "우리반_소원트리.html", "html": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>우리 반 소원 트리<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{ --ink:#F5F1E6; --deep:#0C2033; --line:rgba(255,255,255,.22);\n         --red:#E8556A; --green:#3FD68A; --gold:#FFD34D; --sky:#8FD7FF; }\n  *{box-sizing:border-box; margin:0; padding:0}\n  html,body{height:100%}\n  body{font-family:\"Gowun Dodum\",\"Apple SD Gothic Neo\",sans-serif; color:var(--ink);\n       background:linear-gradient(180deg,#081428 0%,#12345C 52%,#1F5A7E 100%); overflow:hidden}\n  .j,h1,h2,button,label{font-family:\"Jua\",sans-serif; font-weight:400}\n\n  .snow{position:fixed; inset:0; pointer-events:none; z-index:0}\n  .snow i{position:absolute; top:-12px; color:#fff; opacity:.8; animation:fall linear infinite}\n  @keyframes fall{to{transform:translateY(105vh) rotate(160deg)}}\n\n  .wrap{position:relative; z-index:1; height:100%; max-width:1500px; margin:0 auto; padding:12px 18px 16px;\n        display:flex; flex-direction:column; gap:10px}\n  header{display:flex; align-items:center; gap:10px; flex-wrap:wrap}\n  header h1{font-size:clamp(21px,2.5vw,32px)}\n  .chip{background:rgba(255,255,255,.14); border-radius:999px; padding:5px 14px; font-size:16px}\n  header .right{margin-left:auto; display:flex; gap:6px}\n  header .right button{font-size:15px; border:none; background:rgba(255,255,255,.16); color:#fff; border-radius:999px; padding:6px 14px; cursor:pointer}\n\n  .main{flex:1; min-height:0; display:grid; grid-template-columns:1.4fr .6fr; gap:12px}\n  .col{display:flex; flex-direction:column; gap:10px; min-height:0}\n\n  .stage{flex:1; min-height:0; border-radius:28px; background:rgba(255,255,255,.06); border:3px solid var(--line);\n         position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; padding:8px}\n  .stage svg{width:100%; height:100%}\n  .hint{position:absolute; left:50%; top:12px; transform:translateX(-50%); font-size:15px; background:rgba(8,20,40,.55);\n        border:1px solid rgba(255,255,255,.25); border-radius:999px; padding:6px 16px; white-space:nowrap; backdrop-filter:blur(4px)}\n\n  .panel{background:rgba(255,255,255,.1); border:3px solid var(--line); border-radius:24px; padding:14px; min-height:0; overflow-y:auto}\n  .panel h2{font-size:19px; margin-bottom:8px; color:#FFE9A8}\n  .panel.grow{flex:1}\n  label{font-size:16px; display:block; margin:8px 0 4px}\n  input[type=text],textarea{width:100%; border:3px solid var(--line); border-radius:14px; padding:10px 12px;\n    font:inherit; font-size:17px; background:rgba(0,0,0,.25); color:#fff}\n  textarea{height:92px; resize:none}\n  .picks{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px}\n  .picks button{font-family:\"Jua\",sans-serif; font-size:18px; width:42px; height:42px; border-radius:14px; cursor:pointer;\n    border:3px solid var(--line); background:rgba(255,255,255,.08); color:#fff; padding:0}\n  .picks button.on{border-color:#fff; background:rgba(255,255,255,.25); transform:scale(1.06)}\n  .colors button{width:32px; height:32px; border-radius:50%}\n  .hang{width:100%; margin-top:12px; font-family:\"Jua\",sans-serif; font-size:20px; border:none; border-radius:999px; padding:12px;\n    background:linear-gradient(180deg,#62E6A3,#2BB877); color:#06351F; cursor:pointer; box-shadow:0 6px 0 #1C8B58}\n  .hang:active{transform:translateY(4px); box-shadow:0 2px 0 #1C8B58}\n  .list{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}\n  .list span{background:rgba(255,255,255,.12); border-radius:999px; padding:4px 12px; font-size:15px; cursor:pointer}\n  .teacher{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}\n  .teacher button{font-size:14px; border:3px solid var(--line); background:rgba(255,255,255,.08); color:#fff; border-radius:999px; padding:6px 12px; cursor:pointer}\n\n  .card{position:absolute; inset:0; background:rgba(6,14,28,.9); display:none; align-items:center; justify-content:center; z-index:6; padding:18px}\n  .card.show{display:flex}\n  .note{background:#FFFBEF; color:#33404F; border-radius:26px; padding:26px 28px; width:min(560px,100%); text-align:center;\n        box-shadow:0 18px 40px rgba(0,0,0,.45); animation:pop .3s ease-out; position:relative}\n  .note:before{content:\"\"; position:absolute; left:50%; top:-14px; transform:translateX(-50%) rotate(-4deg); width:120px; height:24px;\n        background:rgba(232,85,106,.4); border-radius:4px}\n  @keyframes pop{from{transform:scale(.7) rotate(-2deg); opacity:0}to{transform:scale(1) rotate(0); opacity:1}}\n  .note .who{font-family:\"Gowun Batang\",serif; font-weight:700; font-size:26px; color:#E8556A; margin-bottom:8px}\n  .note .wish{font-family:\"Gowun Batang\",serif; font-size:24px; line-height:1.8; white-space:pre-wrap}\n  .note .btns{display:flex; gap:8px; justify-content:center; margin-top:18px; flex-wrap:wrap}\n  .note button{font-family:\"Jua\",sans-serif; font-size:17px; border:none; border-radius:999px; padding:10px 20px; cursor:pointer; background:#33404F; color:#fff}\n  .note button.ghost{background:#EDE7DA; color:#33404F}\n  .note button.del{background:#F3D2D7; color:#9B2733}\n\n  .toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:#fff; color:#12345C; font-family:\"Jua\",sans-serif;\n    padding:10px 22px; border-radius:999px; opacity:0; transition:.25s; z-index:9}\n  .toast.show{opacity:1}\n\n  .fly{animation:fly 26s linear infinite}\n  @keyframes fly{0%{transform:translate(-220px,14px)}50%{transform:translate(300px,-10px)}100%{transform:translate(820px,16px)}}\n  .tw{animation:tw 2.2s ease-in-out infinite}\n  @keyframes tw{50%{opacity:.4}}\n  .ornLabel{font-family:\"Gowun Dodum\",sans-serif; font-size:12px; fill:#FFF8E6; paint-order:stroke; stroke:rgba(8,20,40,.85); stroke-width:3px; stroke-linejoin:round; pointer-events:none}\n  .orn{cursor:pointer; transform-box:fill-box; transform-origin:center top; animation:swing 3.2s ease-in-out infinite}\n  @keyframes swing{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}\n  @media (prefers-reduced-motion:reduce){.snow i,.tw,.orn,.note{animation:none}}\n  @media (max-width:900px){\n    body{overflow:auto} .wrap{height:auto}\n    .main{grid-template-columns:1fr} .stage{min-height:420px}\n  }\n<\/style>\n<\/head>\n<body>\n<div class=\"snow\" id=\"snow\" aria-hidden=\"true\"><\/div>\n\n<div class=\"wrap\">\n  <header>\n    <h1>🎄 우리 반 소원 트리<\/h1>\n    <span class=\"chip\" id=\"countChip\">소원 0개<\/span>\n    <div class=\"right\">\n      <button id=\"fsBtn\" title=\"전체 화면\">⛶<\/button>\n    <\/div>\n  <\/header>\n\n  <div class=\"main\">\n    <div class=\"col\">\n      <div class=\"stage\">\n        <svg id=\"tree\" viewBox=\"0 0 560 420\" preserveAspectRatio=\"xMidYMax meet\" aria-label=\"소원 트리\"><\/svg>\n        <div class=\"hint\">🎁 장식을 누르면 친구의 소원이 열려요<\/div>\n        <div class=\"card\" id=\"card\">\n          <div class=\"note\">\n            <div class=\"who\" id=\"cWho\"><\/div>\n            <div class=\"wish\" id=\"cWish\"><\/div>\n            <div class=\"btns\">\n              <button class=\"ghost\" id=\"cPrev\">◀ 이전<\/button>\n              <button class=\"ghost\" id=\"cNext\">다음 ▶<\/button>\n              <button id=\"cClose\">닫기<\/button>\n              <button class=\"del\" id=\"cDel\">지우기<\/button>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"col\">\n      <div class=\"panel\">\n        <h2>✏️ 소원 적어서 걸기<\/h2>\n        <label for=\"who\">이름<\/label>\n        <input id=\"who\" type=\"text\" maxlength=\"12\" placeholder=\"이름이나 별명\" autocomplete=\"off\">\n        <label for=\"wish\">내 소원<\/label>\n        <textarea id=\"wish\" maxlength=\"200\" placeholder=\"올해 이루고 싶은 소원을 써 보세요\"><\/textarea>\n        <label>장식 모양<\/label>\n        <div class=\"picks\" id=\"shapes\"><\/div>\n        <label>색깔<\/label>\n        <div class=\"picks colors\" id=\"colors\"><\/div>\n        <button class=\"hang\" id=\"hangBtn\">🎁 트리에 걸기<\/button>\n      <\/div>\n\n      <div class=\"panel grow\">\n        <h2>🎀 걸린 소원<\/h2>\n        <div class=\"list\" id=\"list\"><\/div>\n        <div class=\"teacher\">\n          <button id=\"shuffleBtn\">🔀 자리 바꾸기<\/button>\n          <button id=\"resetBtn\">🗑 모두 지우기<\/button>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n<div class=\"toast\" id=\"toast\"><\/div>\n\n<script>\n/* ▼ 고치는 부분 ─────────────────────────────────── */\nvar SHAPES = ['ball', 'star', 'sock', 'cane', 'snow', 'bell',\n              'heart', 'gift', 'ginger', 'ribbon', 'pinecone', 'light'];   // 장식 모양\nvar COLORS = ['#E8556A', '#FFD34D', '#3FD68A', '#8FD7FF', '#C4A6FF', '#FF9EC4'];\nvar MAX = 28;                                                     // 한 트리에 걸 수 있는 소원 수\n/* ▲ 고치는 부분 끝 ───────────────────────────────── */\n\nvar KEY = 'wish-tree-v1';\nvar wishes = [], shape = SHAPES[0], color = COLORS[0], cIdx = 0;\ntry { wishes = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { wishes = []; }\nfunction save() { try { localStorage.setItem(KEY, JSON.stringify(wishes)); } catch (e) { toast('이 기기에 저장할 수 없어요'); } }\nvar $ = function (id) { return document.getElementById(id); };\nfunction esc(t) { return String(t).replace(/[&<>\"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]; }); }\nfunction toast(m) { var t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove('show'); }, 1900); }\n\nvar AC = null;\nfunction beep(f, dur, type, vol) {\n  try {\n    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();\n    var o = AC.createOscillator(), g = AC.createGain();\n    o.type = type || 'triangle'; o.frequency.value = f; g.gain.value = vol || .05;\n    o.connect(g); g.connect(AC.destination); o.start();\n    g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + (dur || .12));\n    o.stop(AC.currentTime + (dur || .12) + .02);\n  } catch (e) {}\n}\nfunction jingle() { [988, 1175, 1568].forEach(function (f, i) { setTimeout(function () { beep(f, .14); }, i * 100); }); }\n\n/* 눈 */\n(function () {\n  var box = $('snow');\n  for (var i = 0; i < 55; i++) {\n    var s = document.createElement('i');\n    s.textContent = ['❄', '❅', '·'][i % 3
