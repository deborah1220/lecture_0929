2{margin-bottom:7px;padding-bottom:6px}\n  }\n  @media (max-height:660px){\n    .sub{display:none}\n    body.rows .tile{padding:4px 8px}\n  }\n\n  @media (prefers-reduced-motion:no-preference){\n    .col{animation:rise .55s cubic-bezier(.21,.9,.28,1) both}\n  }\n  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}\n  @media (prefers-reduced-motion:reduce){.tile{transition:none}}\n<\/style>\n<\/head>\n<body class=\"rows wall\">\n\n<!-- ════════════════════════════════════════════════════════\n     ▼ 여기만 고치면 됩니다.\n       name  이름          desc  설명 (넓은 화면에서만)\n       url   주소          icon  아이콘\n       group 큰 칸 이름 · \"영어|한글\" 로 쓰면 두 줄\n       sub   칸 안의 작은 제목      wide  true 면 가로로 길게\n     ════════════════════════════════════════════════════════ -->\n<script>\nvar LINKS = [\n  {\n    \"group\": \"Work|업무\",\n    \"name\": \"학교 교육계획\",\n    \"desc\": \"\",\n    \"url\": \"#demo\",\n    \"icon\": \"🏫\",\n    \"sub\": \"계획 · 예산\"\n  },\n  {\n    \"group\": \"Work|업무\",\n    \"name\": \"교육연구비 예산\",\n    \"desc\": \"\",\n    \"url\": \"#demo\",\n    \"icon\": \"💰\",\n    \"sub\": \"계획 · 예산\"\n  },\n  {\n    \"group\": \"Work|업무\",\n    \"name\": \"품의 도우미\",\n    \"desc\": \"\",\n    \"url\": \"#demo\",\n    \"icon\": \"🧾\",\n    \"sub\": \"계획 · 예산\"\n  },\n  {\n    \"group\": \"Work|업무\",\n    \"name\": \"학교평가\",\n    \"desc\": \"\",\n    \"url\": \"#demo\",\n    \"icon\": \"📋\",\n    \"sub\": \"계획 · 예산\"\n  },\n  {\n    \"group\": \"Work|업무\",\n    \"name\": \"2학기 정기시험 과목\",\n    \"desc\": \"\",\n    \"url\": \"#demo\",\n    \"icon\": \"📄\",\n    \"sub\": \"정기시험\"\n  },\n  {\n    \"group\": \"Work|업무\",\n    \"name\": \"2학기 평가계획\",\n    \"desc\": \"\",\n    \"url\": \"#demo\",\n    \"icon\": \"📑\",\n    \"sub\": \"정기시험\"\n  },\n  {\n    \"group\": \"Work|업무\",\n    \"name\": \"우리들의 2026, 앞으로의 2027\",\n    \"desc\": \"\",\n    \"url\": \"#demo\",\n    \"icon\": \"🌱\",\n    \"sub\": \"기록 · 공유\"\n  },\n  {\n    \"group\": \"Work|업무\",\n 시보드\",\n    \"desc\": \"\",\n    \"url\": \"#demo\",\n    \"icon\": \"1️⃣\",\n    \"sub\": \"교사 대시보드\"\n  },\n  {\n    \"group\": \"Class|수업\",\n    \"name\": \"2026 2학년 수행평가 대시보드\",\n    \"desc\": \"\",\n    \"url\": \"#demo\",\n    \"icon\": \"2️⃣\",\n    \"sub\": \"교사 대시보드\"\n  }\n];\n\nvar PAGE_TITLE  = \"2026년 재T의 책상\";\nvar PAGE_SUB    = \"\";\nvar PAGE_KICKER = \"SHINIL BUSINESS HIGH SCHOOL\";\n\n/* 계정 안내 · 필요 없으면 null 로 두세요 */\nvar ACCOUNT = null;\n\n/* 맨 아래 한 줄 · 필요 없으면 \"\" 로 두세요 */\nvar PAGE_CREDIT = \"\";\n<\/script>\n<!-- ▲ 고치는 부분 끝 ─────────────────────────────────────── -->\n\n<header>\n  <span class=\"kicker\" id=\"kicker\">SHINIL BUSINESS HIGH SCHOOL<\/span>\n  <h1 id=\"ttl\">2026년 재T의 책상<\/h1>\n  <p class=\"sub\" id=\"sub\"><\/p>\n<\/header>\n\n<section class=\"account\" id=\"account\" hidden><\/section>\n\n<main class=\"board\" id=\"board\"><\/main>\n\n<p class=\"credit\" id=\"credit\" hidden><\/p>\n\n<button class=\"gear\" id=\"openEdit\" aria-label=\"링크 관리\">⚙<\/button>\n\n<dialog id=\"editor\">\n  <div class=\"sheet\">\n    <h2>링크 관리<\/h2>\n    <p class=\"note\">\n      바탕화면용 사본입니다. 링크가 엣지로 열립니다.<br><br>\n      고친 내용은 <b>이 기기에만<\/b> 저장됩니다. 다른 사람 화면에도 똑같이 보이게 하려면\n      아래 <b>코드 만들기<\/b>로 나온 내용을 GitHub 파일에 붙여넣으세요.\n    <\/p>\n\n    <div id=\"items\"><\/div>\n\n    <div class=\"row\" style=\"margin:16px 0 22px\">\n      <button id=\"add\">링크 추가<\/button>\n      <button class=\"btn-main\" id=\"save\">저장<\/button>\n      <button id=\"close\">닫기<\/button>\n    <\/div>\n\n    <div class=\"row\" style=\"margin-bottom:12px\">\n      <button id=\"export\">코드 만들기<\/button>\n      <button id=\"reset\">처음 상태로<\/button>\n    <\/div>\n    <textarea id=\"code\" readonly hidden><\/textarea>\n    <div class=\"row\" id=\"copyRow\" hidden style=\"margin-top:10px\">\n      <button class=\"btn-main\" id=\"copy\">코드 복사<\/button>\n    <\/div>\n  <\/div>\n<\/dialog>\n\n<div class=\"toast\" id=\"toast\"><\/div>\n\n<script>\n(function(){\n  var KEY = \"udhub.wall.demo\";\n  var PALETTE = [{\"a\": \"#F1EEFA\", \"b\": \"#DFD9F2\", \"deep\": \"#483D79\"}, {\"a\": \"#EDF6F0\", \"b\": \"#D5E9DD\", \"deep\": \"#33604D\"}];\n\n  var board  = document.getElementById(\"board\");\n  var editor = document.getElementById(\"editor\");\n  var itemsEl= document.getElementById(\"items\");\n  var codeEl = document.getElementById(\"code\");\n  var copyRow= document.getElementById(\"copyRow\");\n  var toastEl= document.getElementById(\"toast\");\n\n  var data = load();\n  document.getElementById(\"ttl\").textContent = PAGE_TITLE;\n  var subEl = document.getElementById(\"sub\");\n  if(PAGE_SUB){ subEl.textContent = PAGE_SUB; } else { subEl.remove(); }\n  document.getElementById(\"kicker\").textContent = PAGE_KICKER;\n  document.title = PAGE_TITLE;\n  render();\n  renderAccount();\n  var creditEl = document.getElementById(\"credit\");\n  if(PAGE_CREDIT){ creditEl.textContent = PAGE_CREDIT; creditEl.hidden = false; }\n  else{ creditEl.remove(); }\n\n  function copyText(text){\n    var ta = document.createElement(\"textarea\");\n    ta.value = text;\n    ta.style.position = \"fixed\";\n    ta.style.opacity = \"0\";\n    document.body.appendChild(ta);\n    ta.select();\n    ta.setSelectionRange(0, 99999);\n    var ok = false;\n    try{ ok = document.execCommand(\"copy\"); }catch(e){}\n    document.body.removeChild(ta);\n    if(ok){ toast(\"복사했습니다\"); return; }\n    if(navigator.clipboard){\n      navigator.clipboard.writeText(text).then(\n        function(){ toast(\"복사했습니다\"); },\n        function(){ toast(\"길게 눌러 직접 복사해 주세요\"); });\n    }else{\n      toast(\"길게 눌러 직접 복사해 주세요\");\n    }\n  }\n\n  function renderAccount(){\n    var box = document.getElementById(\"account\");\n    if(!ACCOUNT || !ACCOUNT.length){ box.remove(); return; }\n    box.hidden = false;\n    ACCOUNT.forEach(function(row){\n      var el = document.createElement(\"div\");\n      el.className = \"acc-row\";\n      el.innerHTML = '<span class=\"lab\"><\/span><span class=\"val\"><\/span><button class=\"cp\">복사<\/button>';\n      el.querySelector(\".lab\").textContent = row.label;\n      el.querySelector(\".val\").textContent = row.value;\n      el.querySelector(\".cp\").addEventListener(\"click\", function(){ copyText(row.value); });\n      box.appendChild(el);\n    });\n  }\n\n  function load(){\n    try{\n      var raw = localStorage.getItem(KEY);\n      if(raw){\n        var parsed = JSON.parse(raw);\n        if(Array.isArray(parsed) && parsed.length) return parsed;\n      }\n    }catch(e){}\n    return JSON.parse(JSON.stringify(LINKS));\n  }\n  function store(){\n    try{ localStorage.setItem(KEY, JSON.stringify(data)); }\n    catch(e){ toast(\"이 브라우저에 저장할 수 없습니다\"); }\n  }\n  function toast(msg){\n    toastEl.textContent = msg;\n    toastEl.classList.add(\"on\");\n    clearTimeout(toast.t);\n    toast.t = setTimeout(function(){ toastEl.classList.remove(\"on\"); }, 1900);\n  }\n\n  function render(){\n    board.innerHTML = \"\";\n    var order = [], buckets = {}, wide = {};\n    data.forEach(function(it){\n      var g = (it.group || \"\").trim() || \"그 밖에\";\n      if(!buckets[g]){ buckets[g] = []; order.push(g); }\n      if(it.wide){ wide[g] = true; }\n      buckets[g].push(it);\n    });\n\n    var wideCount = order.filter(function(g){ return wide[g]; }).length;\n    var cols = order.length - wideCount;\n    board.style.setProperty(\"--cols\", cols > 0 ? cols : 1);\n\n    /* 가로로 긴 칸은 적어둔 자리 그대로, 나머지는 한 줄에 나란히 */\n    var rows = [], normalPlaced = false;\n    order.forEach(function(g){\n      if(wide[g]){ rows.push(\"auto\"); }\n      else if(!normalPlaced){ rows.push(\"1fr\"); normalPlaced = true; }\n    });\n    board.style.gridTemplateRows = rows.join(\" \") || \"1fr\";\n\n    order.forEach(function(g, gi){\n      var c = PALETTE[gi % PALETTE.length];\n      var col = document.createElement(\"section\");\n      col.className = \"col\" + (wide[g] ? \" wide\" : \"\");\n      col.style.setProperty(\"--tintA\", c.a);\n      col.style.setProperty(\"--tintB\", c.b);\n      col.style.setProperty(\"--deep\", c.deep);\n      col.style.animationDelay = (gi * 70) + \"ms\";\n\n      var parts = g.split(\"|\");\n      var h = document.createElement(\"h2\");\n      var en = document.createElement(\"span\");\n      en.className = \"en\";\n      en.textContent = parts[0].trim();\n      h.appendChild(en);\n      if(parts[1]){\n        var ko = document.createElement(\"span\");\n        ko.className = \"ko\";\n        ko.textContent = parts[1].trim();\n        h.appendChild(ko);\n      }\n      col.appendChild(h);\n\n      var list = document.createElement(\"div\");\n      list.className = \"items\";\n      var lastSub = null;\n\n      buckets[g].forEach(function(it){\n        var s = (it.sub || \"\").trim();\n        if(s && s !== lastSub){\n          var sh = document.createElement(\"div\");\n          sh.className = \"subh\";\n          sh.textContent = s;\n          list.appendChild(sh);\n          lastSub = s;\n        }\n        var isDemo = (it.url || \"\").trim() === \"#demo\";\n        var has = it.url && it.url.trim() && !isDemo;\n        var el = document.createElement(has ? \"a\" : \"div\");\n        el.className = \"tile\" + ((has || isDemo) ? \"\" : \" empty\");\n        if(has){\n          el.href = it.url.trim();\n          el.rel = \"noopener\";\n        }else{\n          el.tabIndex = 0;\n          el.addEventListener(\"click\", function(){ toast(isDemo ? \"연수용 미리보기라 실제 링크는 열리지 않아요\" : \"주소가 아직 비어 있습니다\"); });\n        }\n        el.innerHTML =\n          '<span class=\"mark\"><\/span>' +\n          '<span class=\"txt\"><span class=\"name\"><\/span><span class=\"desc\"><\/span><\/span>';\n        el.querySelector(\".mark\").textContent = it.icon || \"\\uD83D\\uDD17\";\n        el.querySelector(\".name\").textContent = it.name || \"이름 없음\";\n        el.querySelector(\".desc\").textContent = has ? (it.desc || \"\") : (isDemo ? (it.desc || \"\") : \"주소 없음\");\n        list.appendChild(el);\n      });\n\n      col.appendChild(list);\n      board.appendChild(col);\n    });\n  }\n\n  function drawEditor(){\n    itemsEl.innerHTML = \"\";\n    data.forEach(function(it, i){\n      var box = document.createElement(\"div\");\n      box.className = \"item\";\n      box.innerHTML =\n        '<label>이름<\/label><input data-k=\"name\" type=\"text\" placeholder=\"예) 컵라면 활동지\">' +\n        '<label>주소<\/label><input data-k=\"url\" type=\"url\" inputmode=\"url\" autocapitalize=\"off\" autocorrect=\"off\" placeholder=\"https://deborah1220.github.io/저장소이름/\">' +\n        '<label>설명<\/label><input data-k=\"desc\" type=\"text\" placeholder=\"예) 1·2학년 공통\">' +\n        '<label>큰 칸 이름<\/label><input data-k=\"group\" type=\"text\" placeholder=\"예) Class|수업\">' +\n        '<label>작은 제목<\/label><input data-k=\"sub\" type=\"text\" placeholder=\"예) 학생 배포용\">' +\n        '<label>아이콘<\/label><input data-k=\"icon\" type=\"text\" maxlength=\"4\" placeholder=\"🍜\">' +\n        '<div class=\"ops\">' +\n          '<button data-op=\"up\">↑<\/button>' +\n          '<button data-op=\"down\">↓<\/button>' +\n          '<button class=\"del\" data-op=\"del\">삭제<\/button>' +\n        '<\/div>';\n      box.querySelectorAll(\"input\").forEach(function(inp){\n        inp.value = it[inp.dataset.k] || \"\";\n        inp.addEventListener(\"input\", function(){ it[inp.dataset.k] = inp.value; });\n      });\n      box.querySelectorAll(\"[data-op]\").forEach(function(btn){\n        btn.addEventListener(\"click\", function(){\n          var op = btn.dataset.op;\n          if(op === \"del\"){ data.splice(i,1); }\n          if(op === \"up\" && i > 0){ data.splice(i-1,0,data.splice(i,1)[0]); }\n          if(op === \"down\" && i < data.length-1){ data.splice(i+1,0,data.splice(i,1)[0]); }\n          drawEditor();\n        });\n      });\n      itemsEl.appendChild(box);\n    });\n    if(!data.length){\n      itemsEl.innerHTML = '<p class=\"note\">링크가 없습니다. 아래 <b>링크 추가<\/b>를 눌러 시작하세요.<\/p>';\n    }\n  }\n\n  document.getElementById(\"openEdit\").addEventListener(\"click\", function(){\n    drawEditor();\n    codeEl.hidden = true; copyRow.hidden = true;\n    editor.showModal();\n  });\n  document.getElementById(\"close\").addEventListener(\"click\", function(){ editor.close(); });\n  document.getElementById(\"add\").addEventListener(\"click\", function(){\n    data.push({group:\"\", sub:\"\", name:\"\", desc:\"\", url:\"\", icon:\"\\uD83D\\uDD17\"});\n    drawEditor();\n    itemsEl.lastElementChild.querySelector(\"input\").focus();\n  });\n  document.getElementById(\"save\").addEventListener(\"click\", function(){\n    store(); render(); editor.close(); toast(\"저장했습니다\");\n  });\n  document.getElementById(\"reset\").addEventListener(\"click\", function(){\n    if(!confirm(\"파일에 적힌 처음 상태로 되돌립니다. 계속할까요?\")) return;\n    try{ localStorage.removeItem(KEY); }catch(e){}\n    data = JSON.parse(JSON.stringify(LINKS));\n    drawEditor(); render(); toast(\"처음 상태로 되돌렸습니다\");\n  });\n\n  document.getElementById(\"export\").addEventListener(\"click\", function(){\n    var lines = data.map(function(it){\n      return \"  {\\n\" +\n        '    group: ' + JSON.stringify(it.group || \"\") + \",\\n\" +\n        (it.sub ? '    sub:   ' + JSON.stringify(it.sub) + \",\\n\" : \"\") +\n        (it.wide ? \"    wide:  true,\\n\" : \"\") +\n        '    name:  ' + JSON.stringify(it.name  || \"\") + \",\\n\" +\n        '    desc:  ' + JSON.stringify(it.desc  || \"\") + \",\\n\" +\n        '    url:   ' + JSON.stringify(it.url   || \"\") + \",\\n\" +\n        '    icon:  ' + JSON.stringify(it.icon  || \"\\uD83D\\uDD17\") + \"\\n\" +\n        \"  }\";\n    }).join(\",\\n\");\n    codeEl.value = \"var LINKS = [\\n\" + lines + \"\\n];\";\n    codeEl.hidden = false; copyRow.hidden = false;\n    codeEl.scrollIntoView({block:\"nearest\"});\n  });\n\n  document.getElementById(\"copy\").addEventListener(\"click\", function(){\n    codeEl.hidden = false;\n    codeEl.removeAttribute(\"readonly\");\n    codeEl.select();\n    codeEl.setSelectionRange(0, 99999);\n    var ok = false;\n    try{ ok = document.execCommand(\"copy\"); }catch(e){}\n    codeEl.setAttribute(\"readonly\",\"\");\n    if(navigator.clipboard && !ok){\n      navigator.clipboard.writeText(codeEl.value).then(\n        function(){ toast(\"복사했습니다\"); },\n        function(){ toast(\"길게 눌러 직접 복사해 주세요\"); });\n    }else{\n      toast(ok ? \"복사했습니다\" : \"길게 눌러 직접 복사해 주세요\");\n    }\n  });\n})();\n<\/script>\n<\/body>\n<\/html>\n", "prompt": "내 노트북 바탕화면으로 쓸 링크 모음 사이트를 만들어줘. 업무·수업·기록 같은 묶음으로 나누고, 각 칸에는 제목과 한 줄 설명이 있어서 누르면 그 주소가 열려. 자주 쓰는 계정 정보는 복사 버튼으로 복사돼. 링크를 직접 추가하고 고칠 수 있는 편집 창도 있고, 새로고침해도 지워지지 않게 해줘. 차분한 색으로, 화면 가득 보기 좋게.", "file": "wallpaper_연수데모.html"}, {"icon": "🌟", "title": "실습 ① 칭찬 스티커", "desc": "+/− 버튼으로 스티커를 세고, 10개면 축하!", "html": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>우리 반 칭찬 스티커<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Jua&display=swap\" rel=\"stylesheet\">\n<style>\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n  body {\n    font-family: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;\n    background: #FFF9E6;\n    background-image: radial-gradient(#FFE08A 2px, transparent 2px);\n    background-size: 28px 28px;\n    color: #3A2E5C;\n    min-height: 100vh;\n    padding: 28px 16px 48px;\n  }\n  h1 { text-align: center; font-size: clamp(30px, 6vw, 52px); margin-bottom: 6px; }\n  .sub { text-align: center; font-size: 20px; color: #7A6FA0; margin-bottom: 28px; }\n  .grid {\n    display: grid;\n    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));\n    gap: 20px; max-width: 1100px; margin: 0 auto;\n  }\n  .card {\n    background: #fff; border-radius: 28px; padding: 22px 18px 20px;\n    text-align: center; border: 5px solid var(--c);\n    box-shadow: 0 8px 0 var(--c);\n  }\n  .face { font-size: 54px; }\n  .name { font-size: 30px; margin: 4px 0 8px; }\n  .count { font-size: 84px; line-height: 1; color: var(--c); }\n  .count small { font-size: 24px; color: #9A90B8; }\n  .stars { font-size: 20px; min-height: 28px; margin: 8px 0 14px; letter-spacing: 1px; word-break: break-all; }\n  .btns { display: flex; gap: 12px; justify-content: center; }\n  button {\n    font-family: inherit; font-size: 40px; width: 76px; height: 76px;\n    border: none; border-radius: 50%; cursor: pointer; color: #fff;\n    transition: transform .1s;\n  }\n  button:active { transform: scale(.9); }\n  button:focus-visible { outline: 4px solid #3A2E5C; outline-offset: 3px; }\n  .plus { background: var(--c); }\n  .minus { background: #C9C2DD; }\n\n  .party {\n    position: fixed; inset: 0; background: rgba(58,46,92,.55);\n    display: none; align-items: center; justify-content: center; z-index: 10;\n  }\n  .party.show { display: flex; }\n  .party-box {\n    background: #fff; border-radius: 36px; padding: 40px 48px; text-align: center;\n    animation: pop .4s ease-out;\n  }\n  .party-box .big { font-size: clamp(44px, 9vw, 80px); color: #FF5C8A; }\n  .party-box p { font-size: 26px; margin: 10px 0 24px; }\n  .party-box button { width: auto; height: auto; border-radius: 20px; padding: 12px 32px; font-size: 26px; background: #5B8CFF; }\n  @keyframes pop { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }\n  @media (prefers-reduced-motion: reduce) { .party-box { animation: none; } }\n<\/style>\n<\/head>\n<body>\n  <h1>🌟 우리 반 칭찬 스티커 🌟<\/h1>\n  <p class=\"sub\">스티커 10개를 모으면 축하 파티!<\/p>\n  <div class=\"grid\" id=\"grid\"><\/div>\n\n  <div class=\"party\" id=\"party\">\n    <div class=\"party-box\">\n      <div class=\"big\">🎉 축하해요! 🎉<\/div>\n      <p id=\"partyName\"><\/p>\n      <button onclick=\"closeParty()\">좋아요!<\/button>\n    <\/div>\n  <\/div>\n\n<script>\n  // 실습용 가짜 이름 (진짜 학생 이름은 넣지 않아요)\n  const students = [\n    { name: '토끼', face: '🐰', color: '#FF7BA9' },\n    { name: '곰돌이', face: '🐻', color: '#FF9F43' },\n    { name: '여우', face: '🦊', color: '#F4C20D' },\n    { name: '판다', face: '🐼', color: '#2ECC8F' },\n    { name: '고양이', face: '🐱', color: '#4FA3FF' },\n    { name: '강아지', face: '🐶', color: '#9B6BFF' },\n  ];\n  const counts = students.map(() => 0);\n  const GOAL = 10;\n\n  function render() {\n    document.getElementById('grid').innerHTML = students.map((s, i) => `\n      <div class=\"card\" style=\"--c:${s.color}\">\n        <div class=\"face\">${s.face}<\/div>\n        <div class=\"name\">${s.name}<\/div>\n        <div class=\"count\">${counts[i]}<small> 개<\/small><\/div>\n        <div class=\"stars\">${'⭐'.repeat(counts[i])}<\/div>\n        <div class=\"btns\">\n          <button class=\"minus\" onclick=\"change(${i}, -1)\" aria-label=\"${s.name} 스티커 빼기\">−<\/button>\n          <button class=\"plus\" onclick=\"change(${i}, 1)\" aria-label=\"${s.name} 스티커 더하기\">+<\/button>\n        <\/div>\n      <\/div>`).join('');\n  }\n\n  function change(i, n) {\n    counts[i] = Math.max(0, counts[i] + n);\n    render();\n    if (n > 0 && counts[i] === GOAL) {\n      document.getElementById('partyName').textContent = `${students[i].face} ${students[i].name}이(가) 스티커 ${GOAL}개를 모았어요!`;\n      document.getElementById('party').classList.add('show');\n    }\n  }\n  function closeParty() { document.getElementById('party').classList.remove('show'); }\n\n  render();\n<\/script>\n<\/body>\n<\/html>\n", "prompt": "칭찬 스티커 카운터 웹페이지(사이트)를 만들어줘. 학생 6명이 카드로 나란히 있고, 각 카드에 + 버튼과 − 버튼, 현재 스티커 개수가 크게 보여. 10개가 되면 \"축하해요!\"가 떠. 알록달록한 색으로.", "file": "실습1_칭찬스티커.html"}, {"icon": "🎧", "title": "실습 ② 받아쓰기 불러주기", "desc": "수준별 문제를 읽어 주면 공책에 쓰고 정답을 함께 봐요.", "file": "실습2_받아쓰기불러주기.html", "html": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>받아쓰기 불러주기<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Nanum+Myeongjo:wght@400;700&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{\n    --bg:#F6F2E9; --panel:#FFFFFF; --ink:#33404F; --muted:#8A94A3; --line:#E7E2D7;\n    --blue:#3E7BD8; --blue-d:#2A5CAB; --mint:#2FB89A; --mint-d:#1F8F78; --amber:#F0B429; --rose:#E8697D;\n    --book:'교과서체','MD개성체','KoPubWorld바탕체','KoPub Batang','Nanum Myeongjo','바탕',serif;\n  }\n  *{box-sizing:border-box; margin:0; padding:0}\n  html,body{height:100%}\n  body{font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif; color:var(--ink);\n       background:var(--bg); overflow:hidden}\n  .j,h1,h2,button,label,.num,.count{font-family:'Jua','Apple SD Gothic Neo',sans-serif; font-weight:400}\n\n  .wrap{height:100%; max-width:1480px; margin:0 auto; padding:14px 20px 18px; display:flex; flex-direction:column; gap:12px}\n  header{display:flex; align-items:center; gap:10px; flex-wrap:wrap}\n  header h1{font-size:clamp(20px,2.3vw,30px)}\n  .chip{background:#fff; border:1px solid var(--line); border-radius:999px; padding:5px 14px; font-size:15px; color:var(--muted)}\n  header .right{margin-left:auto; display:flex; gap:6px}\n  header .right button{font-size:15px; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:999px; padding:6px 14px; cursor:pointer}\n\n  .main{flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1.02fr) minmax(380px,.98fr); gap:14px}\n  .num{transition:font-size .2s}\n  /* 교실 화면(칠판) 모드 */\n  body.present .main{grid-template-columns:1fr}\n  body.present .side{display:none}\n  body.present .num{font-size:clamp(90px,26vh,260px)}\n  body.present .mascot{width:clamp(150px,22vh,260px)}\n  body.present .numLabel,body.present .tapHint{font-size:20px}\n  body.present header .chip{font-size:18px}\n  .col{display:flex; flex-direction:column; gap:12px; min-height:0}\n\n  /* 문제 카드 */\n  .board{flex:1; min-height:0; background:var(--panel); border:1px solid var(--line); border-radius:26px;\n         box-shadow:0 12px 30px rgba(51,64,79,.07); display:flex; flex-direction:column; padding:20px 24px 22px; position:relative; overflow:hidden}\n  .progress{display:flex; align-items:center; gap:12px}\n  .progress .count{font-size:17px; color:var(--muted); white-space:nowrap}\n  .bar{flex:1; height:10px; border-radius:999px; background:#EFEADF; overflow:hidden}\n  .bar i{display:block; height:100%; width:0; border-radius:999px; background:linear-gradient(90deg,#8FC7FF,var(--blue)); transition:width .35s}\n  .dots{display:flex; gap:5px; flex-wrap:wrap; justify-content:center; margin-top:10px; min-height:20px}\n  .dots i{font-style:normal; font-size:15px; opacity:.35; transition:transform .2s,opacity .2s}\n  .dots i.done{opacity:1} .dots i.now{opacity:1; transform:scale(1.4)}\n\n  .center{flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px}\n  .numLabel{font-size:17px; color:var(--muted); letter-spacing:.04em}\n  .num{font-size:clamp(44px,9vh,86px); line-height:1.06; color:var(--blue-d)}\n  .mascot{width:clamp(96px,13vh,150px); cursor:pointer; transition:transform .15s; margin-top:6px}\n  .mascot svg{width:100%; height:auto; display:block}\n  .mascot:active{transform:scale(.95)}\n  .peek{font-family:var(--book); font-weight:700; font-size:clamp(34px,8vh,84px); color:var(--blue-d); min-height:1.1em}\n  .tapHint{font-size:15px; color:var(--muted)}\n\n  .controls{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; padding-top:12px; border-top:1px solid var(--line)}\n  .btn{font-size:clamp(16px,1.9vw,21px); border:1px solid transparent; border-radius:16px; padding:13px 22px; cursor:pointer;\n       background:var(--blue); color:#fff; transition:filter .15s, transform .12s}\n  .btn:hover{filter:brightness(1.05)} .btn:active{transform:translateY(1px)}\n  .btn.ghost{background:#fff; color:var(--ink); border-color:var(--line)}\n  .btn.mint{background:var(--mint)}\n  .btn:disabled{opacity:.42; cursor:default}\n\n  /* 정답 화면 */\n  .answers{position:absolute; inset:0; background:#FFFDF8; display:none; flex-direction:column; align-items:center; justify-content:center;\n           gap:14px; padding:24px; z-index:4; overflow-y:auto}\n  .answers.show{display:flex}\n  .answers h2{font-size:clamp(20px,2.4vw,28px)}\n  .aGrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:10px; width:100%; max-width:980px}\n  .aGrid div{background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px 16px; display:flex; gap:12px; align-items:baseline;\n             font-family:var(--book); font-weight:700; font-size:clamp(20px,2.4vw,28px); line-height:1.45}\n  .aGrid div b{font-family:'Jua',sans-serif; font-weight:400; color:var(--rose); font-size:.6em; white-space:nowrap}\n  .oneBig{font-family:var(--book); font-weight:700; font-size:clamp(48px,13vh,132px); color:var(--ink); text-align:center}\n  .oneBig .no{font-family:'Jua',sans-serif; font-size:.34em; color:var(--rose); display:block; margin-bottom:8px}\n\n  /* 오른쪽 */\n  .panel{background:var(--panel); border:1px solid var(--line); border-radius:22px; padding:16px; min-height:0; overflow-y:auto;\n         box-shadow:0 10px 24px rgba(51,64,79,.05)}\n  .panel.grow{flex:1; min-height:170px}\n  .panel h2{font-size:18px; margin-bottom:10px}\n  .levels{display:flex; flex-wrap:wrap; gap:6px}\n  .levels button{font-family:'Jua',sans-serif; font-size:14px; border:1px solid var(--line); background:#fff; color:var(--muted);\n                 border-radius:999px; padding:7px 13px; cursor:pointer}\n  .levels button.on{background:#FFF4D6; border-color:#F0D48A; color:#8A5A12}\n  .bank{display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 4px; max-height:30vh; overflow-y:auto; padding:2px}\n  .bank button{font-size:15px; border:1px solid var(--line); background:#fff; color:var(--muted); border-radius:999px; padding:6px 12px; cursor:pointer}\n  .bank button.on{border-color:var(--blue); background:#EAF1FD; color:var(--ink)}\n  .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px}\n  .row button{font-size:14px; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:999px; padding:7px 13px; cursor:pointer}\n  .row button.use{background:var(--mint); border-color:var(--mint); color:#fff; font-family:'Jua',sans-serif; font-size:16px; padding:9px 18px}\n  label.check{display:flex; align-items:center; gap:7px; font-size:15px; cursor:pointer; color:var(--ink)}\n  select{font:inherit; font-size:15px; border:1px solid var(--line); border-radius:999px; padding:6px 10px; background:#fff; color:var(--ink)}\n  textarea{width:100%; height:110px; border:1px solid var(--line); border-radius:14px; padding:10px 12px; font:inherit; font-size:15px; resize:none; background:#FCFBF7; color:var(--ink); margin-top:10px}\n  textarea:focus,select:focus{outline:none; border-color:var(--blue)}\n  .mini{font-family:'Jua',sans-serif; font-size:13px; border:1px solid var(--line); background:#fff; color:var(--muted);\n        border-radius:999px; padding:4px 10px; cursor:pointer; float:right}\n  .teacherList{display:grid; grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:6px}\n  .teacherList div{display:flex; gap:6px; align-items:baseline; background:#FCFBF7; border:1px solid var(--line); border-radius:10px;\n                   padding:6px 8px; font-family:var(--book); font-weight:700; font-size:16px}\n  .teacherList div b{font-family:'Jua',sans-serif; font-weight:400; color:var(--rose); font-size:12px}\n  .teacherList div.now{border-color:var(--blue); background:#EAF1FD}\n  .teacherList.hide div{color:transparent; text-shadow:none}\n  .teacherList.hide div b{color:var(--muted)}\n  .tip{font-size:14px; color:var(--muted); line-height:1.6; margin-top:10px}\n\n  .ear-l{transform-origin:84px 74px; animation:earL 3.4s ease-in-out infinite}\n  .ear-r{transform-origin:120px 72px; animation:earR 3.8s ease-in-out infinite}\n  @keyframes earL{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(6deg)}}\n  @keyframes earR{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-5deg)}}\n  .eyes{transform-origin:96px 101px; animation:blink 5s infinite}\n  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}\n  .mascot .waves{opacity:.22} .mascot .notes{opacity:0}\n  .mascot.playing{animation:hop .6s ease-in-out infinite}\n  .mascot.playing .waves{animation:pulseW .6s ease-in-out infinite}\n  .mascot.playing .notes{opacity:1}\n  .mascot.playing .n1{animation:noteUp 1.6s ease-in-out infinite}\n  .mascot.playing .n2{animation:noteUp 1.6s ease-in-out .5s infinite}\n  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}\n  @keyframes pulseW{0%,100%{opacity:.3}50%{opacity:1}}\n  @keyframes noteUp{0%{transform:translateY(6px); opacity:0}30%{opacity:1}100%{transform:translateY(-20px); opacity:0}}\n  @keyframes confFall{from{transform:translateY(0) rotate(0); opacity:1}to{transform:translateY(560px) rotate(620deg); opacity:0}}\n  @media (prefers-reduced-motion:reduce){.mascot.playing,.ear-l,.ear-r,.eyes,.mascot.playing .waves,.mascot.playing .n1,.mascot.playing .n2{animation:none}}\n\n  button:focus-visible,textarea:focus-visible,select:focus-visible,.mascot:focus-visible{outline:3px solid var(--blue); outline-offset:3px}\n  @media (max-width:1000px){\n    body{overflow:auto} .wrap{height:auto}\n    .main{grid-template-columns:1fr} .board{min-height:440px}\n  }\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <header>\n    <h1>🎧 받아쓰기 불러주기<\/h1>\n    <span class=\"chip\" id=\"stateChip\">공책과 연필을 준비해 주세요<\/span>\n    <div class=\"right\">\n      <button id=\"presentBtn\" title=\"교실 화면으로 크게\">📺 교실 화면<\/button>\n      <button id=\"speedBtn\" title=\"읽는 속도\">🐢 천천히<\/button>\n      <button id=\"fsBtn\" title=\"전체 화면\">⛶<\/button>\n    <\/div>\n  <\/header>\n\n  <div class=\"main\">\n    <div class=\"col\">\n      <div class=\"board\">\n        <div class=\"progress\">\n          <span class=\"count\" id=\"numLabel\">준비됐나요?<\/span>\n          <span class=\"bar\"><i id=\"barFill\"><\/i><\/span>\n        <\/div>\n        <div class=\"dots\" id=\"dots\"><\/div>\n\n        <div class=\"center\">\n          <div class=\"num\" id=\"num\">준비!<\/div>\n          <div class=\"mascot\" id=\"mascot\" role=\"button\" tabindex=\"0\" title=\"다시 들려주기\">\n            <svg viewBox=\"0 0 200 170\" aria-label=\"다시 들려주기\">\n              <g class=\"ear ear-l\">\n                <path d=\"M76 74 q-14 -56 2 -60 q16 -4 14 56Z\" fill=\"#FFF7FB\" stroke=\"#F8B6CF\" stroke-width=\"4\" stroke-linejoin=\"round\"/>\n                <path d=\"M79 68 q-8 -42 3 -45 q9 -2 8 43Z\" fill=\"#FFC2DA\"/>\n              <\/g>\n              <g class=\"ear ear-r\">\n                <path d=\"M112 72 q12 -56 28 -50 q15 6 -14 56Z\" fill=\"#FFF7FB\" stroke=\"#F8B6CF\" stroke-width=\"4\" stroke-linejoin=\"round\"/>\n                <path d=\"M115 66 q10 -42 21 -38 q8 4 -14 41Z\" fill=\"#FFC2DA\"/>\n              <\/g>\n              <circle cx=\"96\" cy=\"104\" r=\"50\" fill=\"#FFF7FB\" stroke=\"#F8B6CF\" stroke-width=\"4\"/>\n              <g class=\"eyes\">\n                <ellipse cx=\"77\" cy=\"101\" rx=\"8\" ry=\"10.5\" fill=\"#41386B\"/>\n                <ellipse cx=\"115\" cy=\"101\" rx=\"8\" ry=\"10.5\" fill=\"#41386B\"/>\n                <circle cx=\"80\" cy=\"96.5\" r=\"3\" fill=\"#fff\"/><circle cx=\"118\" cy=\"96.5\" r=\"3\" fill=\"#fff\"/>\n              <\/g>\n              <ellipse cx=\"58\" cy=\"118\" rx=\"11\" ry=\"7\" fill=\"#FFAFCB\" opacity=\".9\"/>\n              <ellipse cx=\"134\" cy=\"118\" rx=\"11\" ry=\"7\" fill=\"#FFAFCB\" opacity=\".9\"/>\n              <circle cx=\"96\" cy=\"110\" r=\"4\" fill=\"#FF9EC4\"/>\n              <path d=\"M87 117 q9 10 18 0\" stroke=\"#41386B\" stroke-width=\"3.6\" fill=\"none\" stroke-linecap=\"round\"/>\n              <g stroke=\"#F8B6CF\" stroke-width=\"2.6\" stroke-linecap=\"round\">\n                <path d=\"M44 106 h-14 M44 114 l-14 4\"/><path d=\"M148 106 h14 M148 114 l14 4\"/>\n              <\/g>\n              <g class=\"waves\" stroke=\"#3E7BD8\" stroke-width=\"4.5\" fill=\"none\" stroke-linecap=\"round\">\n                <path d=\"M160 92 q11 14 0 28\"/><path d=\"M174 80 q20 26 0 52\"/>\n              <\/g>\n              <g class=\"notes\" fill=\"#6A5CFF\" font-size=\"20\" font-family=\"Jua, sans-serif\">\n                <text class=\"n1\" x=\"26\" y=\"58\">♪<\/text><text class=\"n2\" x=\"158\" y=\"48\">♬<\/text>\n              <\/g>\n            <\/svg>\n          <\/div>\n          <div class=\"peek\" id=\"peek\"><\/div>\n          <p class=\"tapHint\">토끼를 누르면 다시 들려줘요<\/p>\n        <\/div>\n\n        <div class=\"controls\">\n          <button class=\"btn ghost\" id=\"prevBtn\">◀ 이전<\/button>\n          <button class=\"btn\" id=\"playBtn\">🔁 다시 들려주기<\/button>\n          <button class=\"btn\" id=\"nextBtn\">다음 문제 ▶<\/button>\n          <button class=\"btn ghost\" id=\"startBtn\">처음부터<\/button>\n          <button class=\"btn mint\" id=\"showAnswerBtn\">✅ 정답 보여주기<\/button>\n        <\/div>\n\n        <div class=\"answers\" id=\"answers\">\n          <h2 id=\"aTitle\">✅ 정답을 확인해요<\/h2>\n          <div id=\"aOne\" class=\"oneBig\"><\/div>\n          <div class=\"aGrid\" id=\"aGrid\"><\/div>\n          <div class=\"controls\" style=\"border:0\">\n            <button class=\"btn ghost\" id=\"aModeBtn\">한 개씩 보기<\/button>\n            <button class=\"btn ghost\" id=\"aPrev\">◀<\/button>\n            <button class=\"btn ghost\" id=\"aNext\">▶<\/button>\n            <button class=\"btn\" id=\"aClose\">닫기<\/button>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"col side\">\n      <div class=\"panel\">\n        <h2>📝 오늘의 받아쓰기<\/h2>\n        <div class=\"levels\" id=\"levels\"><\/div>\n        <div class=\"bank\" id=\"bank\"><\/div>\n        <div class=\"row\">\n          <button id=\"allBtn\">전체 선택<\/button>\n          <button id=\"noneBtn\">전체 해제<\/button>\n          <button id=\"randBtn\">무작위 10개<\/button>\n        <\/div>\n        <div class=\"row\"><button id=\"useBtn\" class=\"use\">✅ 고른 문제로 내기<\/button><\/div>\n      <\/div>\n\n      <div class=\"panel grow\">\n        <h2>👀 선생님용 정답 <button id=\"peekToggle\" class=\"mini\">가리기<\/button><\/h2>\n        <div class=\"teacherList\" id=\"teacherList\"><\/div>\n      <\/div>\n\n      <div class=\"panel\">\n        <h2>⚙️ 불러주기 설정<\/h2>\n        <div class=\"row\">\n          <label class=\"check\"><input type=\"checkbox\" id=\"repeatChk\" checked> 두 번씩 읽어 주기 (2초 쉬고)<\/label>\n        <\/div>\n        <div class=\"row\">\n          <label class=\"check\">자동 넘기기\n            <select id=\"autoSel\">\n              <option value=\"0\">끄기<\/option>\n              <option value=\"8\">8초<\/option>\n              <option value=\"10\">10초<\/option>\n              <option value=\"15\">15초<\/option>\n              <option value=\"20\">20초<\/option>\n            <\/select>\n          <\/label>\n        <\/div>\n        <textarea id=\"wordsBox\" aria-label=\"문제 목록\" placeholder=\"직접 적을 때는 한 줄에 하나씩\"><\/textarea>\n        <div class=\"row\"><button id=\"applyBtn\">직접 적은 문제 적용<\/button><\/div>\n        <p class=\"tip\" id=\"voiceTip\"><\/p>\n        <p class=\"tip\">아이들은 공책에 연필로 받아씁니다. 화면에는 번호만 보여서 정답이 미리 노출되지 않아요.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<script>\n/* ▼ 고치는 부분 ─────────────────────────────────── */\n// 수준별 받아쓰기 꾸러미 (원하는 대로 바꾸세요)\nvar LEVELS = [\n  { key: 'g1a', label: '1학년 · 받침 없는 낱말', words: ['사과','나비','기차','우유','모자','하늘','바다','나무','가지','오리','다리','머리','이마','코끼리','바나나','포도','구두','노래','하마','거미','시소','야구','타조','소나기'] },\n  { key: 'g1b', label: '1학년 · 받침 있는 낱말', words: ['학교','친구','동생','연필','색종이','선생님','운동장','가방','책상','거북','꽃잎','발가락','손톱','눈사람','김밥','물감','종이컵','창문','달걀','우산','장갑','강아지','숟가락','볶음밥'] },\n  { key: 'g2', label: '2학년 · 낱말', words: ['꽃밭','무지개','햇볕','이야기','잎사귀','반짝이다','깨끗하다','뛰어가다','웃음소리','지우개','시냇물','바람개비','놀이터','얼음','옷걸이','나뭇잎','손수건','밤하늘','가을바람','첫눈','낙엽','떡볶이','줄넘기','도서관'] },\n  { key: 'g3', label: '3학년 · 낱말', words: ['까닭','설명','독서','관찰','차례대로','씩씩하게','넓히다','꼼꼼하다','함께하다','깊은 산속','실험','관심','발표','의견','경험','소중하다','정리하다','기록하다','상상하다','규칙','약속','협동','배려','자세하게'] },\n  { key: 'sent', label: '짧은 문장', words: ['나는 학교에 갑니다.','오늘 날씨가 좋아요.','친구와 함께 놀았다.','책을 읽고 있어요.','우리 가족은 네 명입니다.','꽃이 활짝 피었다.','동생이 웃으며 달려온다.','내일은 비가 올까요?','운동장에서 줄넘기를 했다.','선생님께 인사를 드렸어요.','바람이 시원하게 불어요.','점심을 맛있게 먹었습니다.','나뭇잎이 노랗게 물들었다.','우산을 깜빡 잊고 왔어요.','우리 반 친구들은 사이가 좋다.','아침 일찍 일어나 세수를 했다.'] },\n  { key: 'tricky', label: '헷갈리는 말', words: ['깨끗이','반듯이','며칠','왠지','설거지','괜찮아','어떻게','할게요','있다가','낫다','바라다','담그다','가르치다','맞히다','붙이다','안 돼요','금세','오랜만에','웬일','얼마큼','오뚝이','설레다','부딪치다','삼가다'] }\n];\nvar DEFAULT_WORDS = LEVELS[0].words.slice();\nvar SPEEDS = [{ label: '🐢 천천히', rate: .6 }, { label: '🚶 보통', rate: .85 }, { label: '🐇 빠르게', rate: 1.1 }];\n/* ▲ 고치는 부분 끝 ───────────────────────────────── */\n\nvar KEY = 'dictation-read-v1';\nvar words = DEFAULT_WORDS.slice(), idx = -1, speedI = 0, autoTimer = null, aIdx = 0, aMode = 'grid';\nvar canSpeak = 'speechSynthesis' in window;\ntry { var sv = JSON.parse(localStorage.getItem(KEY) || 'null'); if (sv && sv.words && sv.words.length) words = sv.words; } catch (e) {}\nfunction save() { try { localStorage.setItem(KEY, JSON.stringify({ words: words })); } catch (e) {} }\nvar $ = function (id) { return document.getElementById(id); };\nfunction esc(t) { return String(t).replace(/[&<>\"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]; }); }\n\nvar AC = null;\nfunction beep(f, dur, type, vol) {\n  try {\n    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();\n    var o = AC.createOscillator(), g = AC.createGain();\n    o.type = type || 'triangle'; o.frequency.value = f; g.gain.value = vol || .05;\n    o.connect(g); g.connect(AC.destination); o.start();\n    g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + (dur || .12));\n    o.stop(AC.currentTime + (dur || .12) + .02);\n  } catch (e) {}\n}\nfunction chime() { [784, 988].forEach(function (f, i) { setTimeout(function () { beep(f, .14); }, i * 110); }); }\n\n/* 읽어 주기 */\nfunction speak(word, times) {\n  if (!canSpeak) { peek(word); return; }\n  try {\n    speechSynthesis.cancel();\n    var n = times || 1, said = 0;\n    function say() {\n      var u = new SpeechSynthesisUtterance(word);\n      u.lang = 'ko-KR'; u.rate = SPEEDS[speedI].rate; u.pitch = 1.05;\n      var ko = speechSynthesis.getVoices().filter(function (v) { return /ko/i.test(v.lang); })[0];\n      if (ko) u.voice = ko;\n      u.onstart = function () { $('mascot').classList.add('playing'); };\n      u.onend = u.onerror = function () {\n        $('mascot').classList.remove('playing');\n        said++;\n        if (said < n) setTimeout(say, 2000);      // 한 번 읽고 2초 쉬었다가 다시\n      };\n      speechSynthesis.speak(u);\n    }\n    say();\n    setTimeout(function () { $('mascot').classList.remove('playing'); }, 4000 * n + 3000);\n  } catch (e) { peek(word); }\n}\nfunction peek(word) {   // 소리가 안 되는 기기에서는 선생님이 읽어 주도록 화면에 잠깐 보여 줘요\n  $('peek').textContent = word;\n  setTimeout(function () { $('peek').textContent = ''; }, 2500);\n}\nfunction readNow() {\n  if (idx < 0 || idx >= words.length) return;\n  speak(words[idx], $('repeatChk').checked ? 2 : 1);\n}\n\n/* 진행 */\nfunction renderTeacherList() {\n  var box = $('teacherList');\n  if (!box) return;\n  box.innerHTML = words.map(function (w, i) {\n    return '<div class=\"' + (i === idx ? 'now' : '') + '\"><b>' + (i + 1) + '<\/b>' + esc(w) + '<\/div>';\n  }).join('');\n}\nfunction render() {\n  $('numLabel').textContent = idx < 0 ? '준비됐나요?' : (idx >= words.length ? '다 불러 줬어요' : '받아쓰기');\n  $('num').textContent = idx < 0 ? '준비!' : (idx >= words.length ? '참 잘했어요' : (idx + 1) + '번');\n  $('num').style.fontSize = (idx >= words.length) ? 'clamp(32px, 7vh, 78px)' : '';\n  $('stateChip').textContent = idx < 0 ? '공책과 연필을 준비해 주세요'\n    : (idx >= words.length ? '이제 정답을 확인해요' : (idx + 1) + ' / ' + words.length + '번째 문제');\n  $('dots').innerHTML = words.map(function (w, i) {\n    var cls = i < idx ? 'done' : (i === idx ? 'now' : '');\n    return '<i class=\"' + cls + '\">' + (i < idx ? '⭐' : (i === idx ? '✏️' : '☆')) + '<\/i>';\n  }).join('');\n  var pct = words.length ? Math.max(0, Math.min(1, (idx + (idx >= words.length ? 0 : 1)) / words.length)) : 0;\n  if (idx < 0) pct = 0;\n  $('barFill').style.width = (pct * 100) + '%';\n  $('prevBtn').disabled = idx <= 0;\n  $('nextBtn').textContent = idx >= words.length - 1 ? '끝내기 ✅' : '다음 문제 ▶';\n  $('playBtn').disabled = idx < 0 || idx >= words.length;\n  renderTeacherList();\n}\nfunction goTo(i) {\n  clearAuto();\n  idx = Math.max(0, Math.min(words.length, i));\n  render();\n  if (idx < words.length) { chime(); setTimeout(readNow, 700); startAuto(); }\n  else { $('mascot').classList.remove('playing'); cheer(); }\n}\nfunction startAuto() {\n  var sec = parseInt($('autoSel').value, 10);\n  if (!sec || idx >= words.length) return;\n  autoTimer = setTimeout(function () {\n    if (idx < words.length - 1) goTo(idx + 1); else goTo(words.length);\n  }, sec * 1000);\n}\nfunction cheer() {\n  var board = document.querySelector('.board'), cols = ['#FFCF5C', '#FF9EC4', '#5B8DEF', '#4CC38A', '#7FE0D4'];\n  for (var i = 0; i < 40; i++) {\n    var el = document.createElement('i');\n    el.style.cssText = 'position:absolute;width:10px;height:14px;border-radius:3px;z-index:5;pointer-events:none;top:-20px;left:' +\n      (Math.random() * 100) + '%;background:' + cols[i % cols.length] +\n      ';animation:confFall 2s linear ' + (Math.random() * .6) + 's forwards';\n    board.appendChild(el);\n    (function (x) { setTimeout(function () { x.remove(); }, 2900); })(el);\n  }\n}\nfunction clearAuto() { if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; } }\n\n/* 정답 보기 */\nfunction showAnswers() {\n  clearAuto(); aIdx = 0;\n  $('aGrid').innerHTML = words.map(function (w, i) {\n    return '<div><b>' + (i + 1) + '번<\/b> ' + esc(w) + '<\/div>';\n  }).join('');\n  setAMode(aMode);\n  $('answers').classList.add('show');\n  chime();\n}\nfunction setAMode(m) {\n  aMode = m;\n  var one = m === 'one';\n  $('aGrid').style.display = one ? 'none' : 'grid';\n  $('aOne').style.display = one ? '' : 'none';\n  $('aPrev').style.display = $('aNext').style.display = one ? '' : 'none';\n  $('aModeBtn').textContent = one ? '전체 보기' : '한 개씩 보기';\n  if (one) $('aOne').innerHTML = '<span class=\"no\">' + (aIdx + 1) + '번<\/span>' + esc(words[aIdx]);\n}\n\n/* 버튼 */\n$('startBtn').addEventListener('click', function () { goTo(0); });\n$('playBtn').addEventListener('click', readNow);\n$('mascot').addEventListener('click', readNow);\n$('mascot').addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); readNow(); } });\n$('nextBtn').addEventListener('click', function () { goTo(idx + 1); });\n$('prevBtn').addEventListener('click', function () { goTo(idx - 1); });\n$('showAnswerBtn').addEventListener('click', showAnswers);\n$('aClose').addEventListener('click', function () { $('answers').classList.remove('show'); });\n$('aModeBtn').addEventListener('click', function () { setAMode(aMode === 'one' ? 'grid' : 'one'); });\n$('aPrev').addEventListener('click', function () { aIdx = (aIdx - 1 + words.length) % words.length; setAMode('one'); });\n$('aNext').addEventListener('click', function () { aIdx = (aIdx + 1) % words.length; setAMode('one'); });\n$('speedBtn').addEventListener('click', function () {\n  speedI = (speedI + 1) % SPEEDS.length; this.textContent = SPEEDS[speedI].label;\n  if (idx >= 0 && idx < words.length) readNow();\n});\n$('autoSel').addEventListener('change', function () { clearAuto(); startAuto(); });\n$('applyBtn').addEventListener('click', function () {\n  var list = $('wordsBox').value.split('\\n').map(function (x) { return x.trim(); }).filter(function (x) { return x; });\n  if (!list.length) { alert('문제를 한 줄에 하나씩 적어 주세요'); return; }\n  words = list.slice(0, 50); save(); idx = -1; render(); beep(880, .1);\n  $('stateChip').textContent = '문제 ' + words.length + '개를 저장했어요';\n});\n$('peekToggle').addEventListener('click', function () {\n  var on = $('teacherList').classList.toggle('hide');\n  this.textContent = on ? '보이기' : '가리기';\n});\n$('presentBtn').addEventListener('click', function () {\n  var on = document.body.classList.toggle('present');\n  this.textContent = on ? '🙋 선생님 화면' : '📺 교실 화면';\n  if (on && document.documentElement.requestFullscreen && !document.fullscreenElement) document.documentElement.requestFullscreen();\n});\n$('fsBtn').addEventListener('click', function () {\n  if (document.fullscreenElement) { document.exitFullscreen(); this.textContent = '⛶'; }\n  else if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen(); this.textContent = '✕'; }\n});\ndocument.addEventListener('keydown', function (e) {\n  if (document.activeElement.tagName === 'TEXTAREA') return;\n  if (e.key === 'ArrowRight') { e.preventDefault(); $('nextBtn').click(); }\n  if (e.key === 'ArrowLeft') { e.preventDefault(); $('prevBtn').click(); }\n  if (e.key === ' ') { e.preventDefault(); readNow(); }\n  if (e.key === 'Escape') { $('answers').classList.remove('show'); if (document.body.classList.contains('present')) $('presentBtn').click(); }\n});\n\nvar bank = LEVELS[0].words.slice(), picked = {};\nfunction drawBank() {\n  var box = $('bank');\n  box.innerHTML = '';\n  bank.forEach(function (w) {\n    var b = document.createElement('button');\n    b.textContent = w;\n    if (picked[w]) b.className = 'on';\n    b.addEventListener('click', function () {\n      picked[w] = !picked[w];\n      b.classList.toggle('on', !!picked[w]);\n      countPicked();\n    });\n    box.appendChild(b);\n  });\n  countPicked();\n}\nfunction countPicked() {\n  var n = bank.filter(function (w) { return picked[w]; }).length;\n  $('useBtn').textContent = n ? '✅ 고른 ' + n + '개로 내기' : '✅ 고른 문제로 내기';\n}\nfunction loadLevel(lv, btn) {\n  bank = lv.words.slice(); picked = {};\n  bank.forEach(function (w) { picked[w] = true; });     // 처음엔 전부 선택\n  [].forEach.call($('levels').children, function (x) { x.classList.remove('on'); });\n  if (btn) btn.classList.add('on');\n  drawBank();\n  $('stateChip').textContent = lv.label + ' · 낼 문제를 골라 보세요';\n  $('wordsBox').value = bank.join('\\n');\n}\n(function () {\n  var box = $('levels');\n  LEVELS.forEach(function (lv, i) {\n    var b = document.createElement('button');\n    b.textContent = lv.label;\n    b.addEventListener('click', function () { loadLevel(lv, b); beep(880, .08); });\n    box.appendChild(b);\n    if (i === 0) setTimeout(function () { loadLevel(lv, b); }, 0);\n  });\n})();\n$('allBtn').addEventListener('click', function () { bank.forEach(function (w) { picked[w] = true; }); drawBank(); });\n$('noneBtn').addEventListener('click', function () { picked = {}; drawBank(); });\n$('randBtn').addEventListener('click', function () {\n  picked = {};\n  bank.slice().sort(function () { return Math.random() - .5; }).slice(0, 10).forEach(function (w) { picked[w] = true; });\n  drawBank(); beep(760, .08);\n});\n$('useBtn').addEventListener('click', function () {\n  var list = bank.filter(function (w) { return picked[w]; });\n  if (!list.length) { alert('낼 문제를 하나 이상 골라 주세요'); return; }\n  words = list.slice(); save(); idx = -1;\n  $('wordsBox').value = words.join('\\n');\n  render();\n  $('stateChip').textContent = '문제 ' + words.length + '개를 준비했어요';\n  beep(900, .12);\n});\n$('wordsBox').value = words.join('\\n');\n$('speedBtn').textContent = SPEEDS[speedI].label;\n$('voiceTip').textContent = canSpeak\n  ? '🔈 이 브라우저는 읽어 주기를 지원해요. 교실 스피커 볼륨을 확인해 주세요.'\n  : '🔇 읽어 주기가 안 되는 브라우저예요. 화면에 단어가 잠깐 보이니 선생님이 읽어 주세요.';\nrender();\n<\/script>\n<\/body>\n<\/html>\n", "prompt": "한 문장씩 차례로 넣어 보세요. 한 단계마다 결과를 눌러 보고 다음으로 넘어갑니다.\n\n1단계 · 기본 만들기\n받아쓰기 불러주는 화면을 만들어줘. 아이들은 공책에 연필로 쓰니까 화면에는 문제 번호만 크게 보이고, 단어는 소리로만 읽어 줘. 다음 문제 버튼으로 넘어가. 초등 1학년용으로 크게.\n\n2단계 · 다시 들려주기\n스피커를 누르면 다시 들려주고, 이전 문제로 돌아가는 버튼도 넣어줘. 읽는 속도도 천천히·보통·빠르게로 바꿀 수 있게.\n\n3단계 · 두 번씩 읽어 주기\n받아쓰기는 보통 두 번 불러 주니까, 한 번 읽고 2초 쉬었다가 한 번 더 읽어 주게 해줘. 켜고 끌 수 있게.\n\n4단계 · 정답 확인하기\n다 끝나면 '정답 보여주기'를 눌러서 1번부터 번호와 함께 정답을 한눈에 보여줘. 한 개씩 크게 넘겨 보는 것도 되게.\n\n5단계 · 수준별로 고르기\n1학년 받침 없는 낱말, 1학년 받침 있는 낱말, 2학년 낱말, 3학년 낱말, 짧은 문장, 헷갈리는 말 꾸러미를 버튼으로 고르고, 꾸러미 안의 낱말 24개 중에서 오늘 낼 것만 눌러서 고를 수 있게 해줘. 전체 선택·전체 해제·무작위 10개 버튼도. 선생님이 직접 적어서 저장하는 것도 되게.\n\n6단계 · 예쁘게 다듬기\n초등학생용이니까 공책 종이에 마스킹테이프를 붙인 것처럼 꾸미고, 귀여운 토끼가 소리를 들려주는 모습으로 만들어줘. 진행 표시는 별로, 정답은 교과서 글씨체로, 다 끝나면 색종이가 날리게.\n\n7단계 · 선생님 화면과 교실 화면 나누기\n평소에는 선생님이 보는 화면으로, 오른쪽에 문제 목록과 정답을 함께 보여줘. '교실 화면' 버튼을 누르면 번호만 아주 크게 나오는 화면으로 바뀌게 해줘.\n\n8단계 · 교실에서 쓰기 편하게\n선생님이 교실을 돌아다닐 수 있게 10초마다 자동으로 다음 문제로 넘어가는 것도 넣어줘. 교실 TV에 띄울 거니까 한 화면에 꽉 차게, 전체화면 버튼도.\n\n※ 읽어 주기는 브라우저에 따라 안 될 수 있어요. 그럴 때는 화면에 단어가 잠깐 보이니 선생님이 읽어 주시면 됩니다."}, {"icon": "🎯", "title": "실습 ③ 오늘의 도우미 뽑기", "desc": "룰렛·가챠·슬롯·카드로 도우미를 뽑아요.", "file": "실습3_오늘의도우미뽑기.html", "html": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>오늘의 도우미 뽑기<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap\" rel=\"stylesheet\">\n<style>\n  :root { --ink:#2B2140; --muted:#9A92B4; --line:#3A2F5C; --pink:#FF5FA2; --yellow:#FFD23F;\n          --blue:#3FC1FF; --green:#4CE0A0; --purple:#A566FF; --orange:#FF8A3D; }\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n  html, body { height: 100%; }\n  body { font-family: 'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif; color: #fff;\n         background: #1A1030; overflow: hidden; }\n  .j, h1, h2, button, .tab { font-family: 'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-weight: normal; }\n\n  .wrap { height: 100%; max-width: 1500px; margin: 0 auto; padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 10px;
