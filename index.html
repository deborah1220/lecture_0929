ound: conic-gradient(from 0deg, rgba(255,255,255,.10) 0 12deg, transparent 12deg 45deg);\n          animation: sweep 9s linear infinite; pointer-events: none; }\n  @keyframes sweep { to { transform: translateX(-50%) rotate(360deg); } }\n\n  .view { display: none; width: 100%; height: 100%; align-items: center; justify-content: center; position: relative; z-index: 1; }\n  .view.on { display: flex; }\n  .stage svg { max-width: 100%; max-height: 100%; }\n  #gacha { height: 100%; width: auto; }\n  .wheelBox { position: relative; height: 100%; width: 100%; display: flex; align-items: center; justify-content: center; }\n  #wheel { height: 100%; width: auto; transition: transform 5.4s cubic-bezier(.12,.72,.12,1); transform-origin: 50% 50%; filter: drop-shadow(0 0 22px rgba(255,210,63,.35)); }\n  .pointer { position: absolute; top: 2%; left: 50%; transform: translateX(-50%); font-size: clamp(30px, 4vw, 46px); z-index: 3;\n             filter: drop-shadow(0 3px 0 rgba(0,0,0,.35)); }\n\n  /* 슬롯 */\n  .slot { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px; }\n  .reelBox { position: relative; width: min(780px, 94%); height: clamp(140px, 30vh, 250px); overflow: hidden;\n             border-radius: 22px; border: 6px solid var(--yellow); background: #120B26;\n             box-shadow: inset 0 0 40px rgba(0,0,0,.6), 0 0 26px rgba(255,210,63,.35); }\n  .reel { position: absolute; left: 0; right: 0; top: 0; }\n  .reel div { height: clamp(140px, 30vh, 250px); display: flex; align-items: center; justify-content: center;\n              font-family: 'Jua', sans-serif; font-size: clamp(26px, 5vw, 52px); color: #fff; }\n  .reelBox::after { content: ''; position: absolute; inset: 0; pointer-events: none;\n                    background: linear-gradient(180deg, rgba(0,0,0,.55), transparent 35%, transparent 65%, rgba(0,0,0,.55)); }\n\n  /* 카드 */\n  .cards { display: grid; gap: 10px; width: 100%; height: 100%; align-content: center;\n           grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); }\n  .cardBtn { aspect-ratio: 3 / 4; border: none; border-radius: 16px; cursor: pointer; color: #fff; font-size: 30px;\n             background: linear-gradient(150deg, #7A4BE0, #4B2BA8); box-shadow: 0 6px 0 rgba(0,0,0,.35), inset 0 0 18px rgba(255,255,255,.15);\n             transition: transform .18s; position: relative; }\n  .cardBtn::after { content: '★'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;\n                    font-size: 26px; color: rgba(255,255,255,.3); }\n  .cardBtn:hover { transform: translateY(-6px) rotate(-2deg); }\n  .cardBtn.shuffling { animation: shuffle .45s ease-in-out; }\n  @keyframes shuffle { 50% { transform: translateX(14px) rotate(8deg); } }\n  .cardBtn.open { background: linear-gradient(150deg, #FFE27A, var(--yellow)); color: #3A2A00;\n                  font-family: 'Jua', sans-serif; font-size: clamp(15px, 1.8vw, 22px); transform: scale(1.12); }\n  .cardBtn.open::after { content: ''; }\n  .cardBtn.dim { opacity: .25; }\n\n  .bigBtn { font-size: clamp(20px, 2.6vw, 30px); border: none; border-radius: 999px; padding: 14px 10px; width: 100%;\n            background: linear-gradient(180deg, #FF7DB6, var(--pink)); color: #fff; cursor: pointer;\n            box-shadow: 0 7px 0 #C8316F, 0 0 26px rgba(255,95,162,.45); animation: pulse 1.8s ease-in-out infinite; }\n  .bigBtn:active { transform: translateY(5px); box-shadow: 0 2px 0 #C8316F; }\n  .bigBtn:disabled { opacity: .55; animation: none; box-shadow: none; }\n  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.02); } }\n\n  .panel { background: rgba(255,255,255,.08); border: 3px solid rgba(255,255,255,.14); border-radius: 22px; padding: 12px; min-height: 0; overflow-y: auto; }\n  .panel h2 { font-size: 19px; margin-bottom: 8px; color: var(--yellow); }\n  .panel.grow { flex: 1; }\n  textarea { width: 100%; height: 120px; border: 3px solid rgba(255,255,255,.18); border-radius: 14px; padding: 10px;\n             font: inherit; font-size: 15px; resize: none; background: rgba(0,0,0,.25); color: #fff; }\n  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }\n  .row button { font-size: 15px; border: 3px solid rgba(255,255,255,.2); background: rgba(255,255,255,.08); color: #fff; border-radius: 999px; padding: 6px 14px; cursor: pointer; }\n  label.check { display: flex; align-items: center; gap: 6px; font-size: 15px; cursor: pointer; color: #E7E0FF; }\n  .pool { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }\n  .pool span { background: rgba(255,255,255,.1); border-radius: 999px; padding: 3px 12px; font-size: 14px; }\n  .pool span.used { opacity: .4; text-decoration: line-through; }\n  .history { list-style: none; display: grid; gap: 6px; }\n  .history li { background: rgba(255,210,63,.16); border-radius: 12px; padding: 6px 12px; font-size: 15px; }\n  .history .empty { background: none; color: var(--muted); }\n\n  /* 결과 */\n  .result { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; z-index: 8;\n            background: radial-gradient(circle at 50% 45%, rgba(90,40,150,.55), rgba(10,5,25,.92)); }\n  .result.show { display: flex; }\n  .rays { position: absolute; width: 190%; height: 190%; background:\n          repeating-conic-gradient(from 0deg, rgba(255,210,63,.20) 0 9deg, transparent 9deg 22deg);\n          animation: spin 14s linear infinite; }\n  @keyframes spin { to { transform: rotate(360deg); } }\n  .rbox { position: relative; text-align: center; padding: 10px 20px; animation: popIn .5s cubic-bezier(.2,1.6,.4,1); }\n  .rbox .crown { font-size: clamp(40px, 7vw, 74px); animation: bob 1.6s ease-in-out infinite; }\n  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-10px) rotate(4deg); } }\n  .rbox .sub { font-family: 'Jua', sans-serif; font-size: clamp(18px, 2.4vw, 26px); color: #FFE27A; }\n  .rbox .who { font-family: 'Jua', sans-serif; font-size: clamp(40px, 9vw, 96px); line-height: 1.15; word-break: keep-all;\n               background: linear-gradient(90deg, #FFD23F, #FF5FA2, #3FC1FF, #FFD23F); background-size: 300% 100%;\n               -webkit-background-clip: text; background-clip: text; color: transparent; animation: flow 3s linear infinite;\n               filter: drop-shadow(0 4px 12px rgba(0,0,0,.4)); margin: 4px 0 16px; }\n  @keyframes flow { to { background-position: 300% 0; } }\n  @keyframes popIn { from { transform: scale(.4) rotate(-8deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }\n  .rbox .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }\n  .rbox button { font-size: 20px; border: none; border-radius: 999px; padding: 12px 26px; cursor: pointer; }\n  .again { background: linear-gradient(180deg, #C89BFF, var(--purple)); color: #fff; box-shadow: 0 5px 0 #6B37C6; }\n  .close { background: rgba(255,255,255,.18); color: #fff; }\n\n  .countdown { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; z-index: 7; }\n  .countdown.show { display: flex; }\n  .countdown span { font-family: 'Jua', sans-serif; font-size: clamp(70px, 16vw, 190px); color: #fff;\n                    text-shadow: 0 0 40px rgba(255,210,63,.9); animation: cd .7s ease-out; }\n  @keyframes cd { from { transform: scale(2.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }\n\n  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 9; }\n  .flash.go { animation: flash .45s ease-out; }\n  @keyframes flash { 0% { opacity: .9; } 100% { opacity: 0; } }\n\n  .confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 10; }\n  .confetti i { position: absolute; width: 11px; height: 15px; border-radius: 3px; animation: fall 2s linear forwards; }\n  @keyframes fall { from { transform: translateY(-60px) rotate(0); opacity: 1; } to { transform: translateY(640px) rotate(720deg); opacity: 0; } }\n\n  button:focus-visible, textarea:focus-visible { outline: 4px solid var(--yellow); outline-offset: 2px; }\n  @media (prefers-reduced-motion: reduce) {\n    .stars i, .beam, .rays, .rbox, .rbox .crown, .rbox .who, .bigBtn, .confetti i { animation: none !important; }\n    #wheel { transition: none; }\n  }\n  @media (max-width: 900px) {\n    body { overflow: auto; } .wrap { height: auto; }\n    .main { grid-template-columns: 1fr; } .stage { min-height: 380px; }\n  }\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <header>\n    <h1>🎪 오늘의 도우미 뽑기<\/h1>\n    <span class=\"chip\" id=\"poolChip\"><\/span>\n    <div class=\"right\">\n      <button id=\"soundBtn\" title=\"소리\">🔊<\/button>\n      <button id=\"fsBtn\" title=\"전체 화면\">⛶<\/button>\n    <\/div>\n  <\/header>\n\n  <div class=\"main\">\n    <div class=\"col\">\n      <div class=\"tabs\">\n        <button class=\"tab on\" data-m=\"wheel\">🎡 룰렛<\/button>\n        <button class=\"tab\" data-m=\"gacha\">🥚 가챠<\/button>\n        <button class=\"tab\" data-m=\"slot\">🎰 슬롯<\/button>\n        <button class=\"tab\" data-m=\"card\">🃏 카드<\/button>\n      <\/div>\n\n      <div class=\"stage\" id=\"stage\">\n        <div class=\"stars\" id=\"stars\"><\/div>\n        <div class=\"beam\"><\/div>\n\n        <div class=\"view on\" id=\"v-wheel\">\n          <div class=\"wheelBox\">\n            <span class=\"pointer\">🔻<\/span>\n            <svg id=\"wheel\" viewBox=\"0 0 320 320\" aria-label=\"룰렛\"><\/svg>\n          <\/div>\n        <\/div>\n\n        <div class=\"view\" id=\"v-gacha\">\n          <svg id=\"gacha\" viewBox=\"0 0 300 330\" aria-label=\"가챠 기계\"><\/svg>\n        <\/div>\n\n        <div class=\"view\" id=\"v-slot\">\n          <div class=\"slot\">\n            <div class=\"reelBox\"><div class=\"reel\" id=\"reel\"><\/div><\/div>\n            <div class=\"chip\">🎰 손잡이를 당기듯 뽑기 버튼을 눌러요<\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"view\" id=\"v-card\"><div class=\"cards\" id=\"cards\"><\/div><\/div>\n\n        <div class=\"countdown\" id=\"countdown\"><span id=\"cdText\"><\/span><\/div>\n        <div class=\"flash\" id=\"flash\"><\/div>\n\n        <div class=\"result\" id=\"result\">\n          <div class=\"rays\"><\/div>\n          <div class=\"rbox\">\n            <div class=\"crown\">👑<\/div>\n            <div class=\"sub\" id=\"resultSub\">오늘의 도우미는<\/div>\n            <div class=\"who\" id=\"resultWho\"><\/div>\n            <div class=\"btns\">\n              <button class=\"again\" id=\"againBtn\">한 번 더! 🎉<\/button>\n              <button class=\"close\" id=\"closeBtn\">닫기<\/button>\n            <\/div>\n          <\/div>\n        <\/div>\n        <div class=\"confetti\" id=\"confetti\"><\/div>\n      <\/div>\n\n      <button class=\"bigBtn\" id=\"drawBtn\">뽑기 시작!<\/button>\n    <\/div>\n\n    <div class=\"col\">\n      <div class=\"panel\">\n        <h2>👥 명단<\/h2>\n        <textarea id=\"namesBox\" aria-label=\"이름 목록\" placeholder=\"한 줄에 한 명씩\"><\/textarea>\n        <div class=\"row\">\n          <button id=\"applyBtn\">명단 적용<\/button>\n          <label class=\"check\"><input type=\"checkbox\" id=\"excludeChk\" checked> 뽑힌 친구는 빼기<\/label>\n        <\/div>\n        <div class=\"pool\" id=\"pool\"><\/div>\n      <\/div>\n      <div class=\"panel grow\">\n        <h2>🏅 오늘 뽑힌 친구<\/h2>\n        <ul class=\"history\" id=\"history\"><\/ul>\n        <div class=\"row\"><button id=\"resetBtn\">↺ 처음부터 다시<\/button><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<script>\n/* ▼ 고치는 부분 ─────────────────────────────────── */\nvar DEFAULT_NAMES = ['1번 토끼', '2번 곰돌이', '3번 여우', '4번 판다', '5번 고양이', '6번 강아지',\n                     '7번 병아리', '8번 햄스터', '9번 다람쥐', '10번 사슴'];\nvar COLORS = ['#FF5FA2', '#FFD23F', '#4CE0A0', '#3FC1FF', '#A566FF', '#FF8A3D', '#5BE7C4', '#FF7B7B'];\nvar TITLE = '오늘의 도우미는';\nvar COUNTDOWN = true;     // 뽑기 전 3·2·1 카운트다운\n/* ▲ 고치는 부분 끝 ───────────────────────────────── */\n\nvar KEY = 'helper-picker-v2';\nvar names = DEFAULT_NAMES.slice(), used = [], mode = 'wheel', busy = false, soundOn = true, angle = 0;\ntry {\n  var sv = JSON.parse(localStorage.getItem(KEY) || 'null');\n  if (sv && sv.names && sv.names.length) { names = sv.names; used = sv.used || []; }\n} catch (e) {}\nfunction save() { try { localStorage.setItem(KEY, JSON.stringify({ names: names, used: used })); } catch (e) {} }\nfunction esc(t) { return String(t).replace(/[&<>\"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]; }); }\nfunction pool() {\n  if (!document.getElementById('excludeChk').checked) return names.slice();\n  var left = names.filter(function (n) { return used.indexOf(n) < 0; });\n  return left.length ? left : names.slice();\n}\n\n/* ---------- 소리 ---------- */\nvar AC = null;\nfunction ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } return AC; }\nfunction beep(f, dur, type, vol) {\n  if (!soundOn || !ac()) return;\n  try {\n    var o = AC.createOscillator(), g = AC.createGain();\n    o.type = type || 'square'; o.frequency.value = f; g.gain.value = vol || .05;\n    o.connect(g); g.connect(AC.destination); o.start();\n    g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + (dur || .08));\n    o.stop(AC.currentTime + (dur || .08) + .02);\n  } catch (e) {}\n}\nfunction tick() { beep(1200, .03, 'square', .035); }\nfunction noise(dur, vol) {\n  if (!soundOn || !ac()) return;\n  try {\n    var len = Math.floor(AC.sampleRate * dur), buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);\n    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);\n    var src = AC.createBufferSource(), g = AC.createGain();\n    src.buffer = buf; g.gain.value = vol || .12; src.connect(g); g.connect(AC.destination); src.start();\n  } catch (e) {}\n}\nfunction applause() { noise(1.4, .16); setTimeout(function () { noise(1.0, .1); }, 260); }\nfunction fanfare() { [523, 659, 784, 1046, 1318].forEach(function (f, i) { setTimeout(function () { beep(f, .18, 'square', .06); }, i * 110); }); }\n\n/* ---------- 룰렛 ---------- */\nfunction drawWheel() {\n  var list = pool(), cx = 160, cy = 160, r = 142, g = '';\n  g += '<circle cx=\"160\" cy=\"160\" r=\"152\" fill=\"#2B1B52\" stroke=\"#6B4BB8\" stroke-width=\"6\"/>';\n  for (var b = 0; b < 16; b++) {\n    var ab = (b / 16) * Math.PI * 2, bx = cx + 150 * Math.cos(ab), by = cy + 150 * Math.sin(ab);\n    g += '<circle cx=\"' + bx.toFixed(1) + '\" cy=\"' + by.toFixed(1) + '\" r=\"5\" fill=\"' + (b % 2 ? '#FFD23F' : '#FF5FA2') + '\"/>';\n  }\n  list.forEach(function (name, i) {\n    var a0 = (i / list.length) * Math.PI * 2 - Math.PI / 2, a1 = ((i + 1) / list.length) * Math.PI * 2 - Math.PI / 2;\n    var x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0), x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);\n    var big = (a1 - a0) > Math.PI ? 1 : 0;\n    g += '<path d=\"M' + cx + ' ' + cy + ' L' + x0.toFixed(1) + ' ' + y0.toFixed(1) + ' A' + r + ' ' + r + ' 0 ' + big + ' 1 ' +\n         x1.toFixed(1) + ' ' + y1.toFixed(1) + 'Z\" fill=\"' + COLORS[i % COLORS.length] + '\" stroke=\"#1A1030\" stroke-width=\"2\"/>';\n    var am = (a0 + a1) / 2, tx = cx + (r * .62) * Math.cos(am), ty = cy + (r * .62) * Math.sin(am);\n    var short = name.length > 7 ? name.slice(0, 7) + '…' : name;\n    g += '<text x=\"' + tx.toFixed(1) + '\" y=\"' + ty.toFixed(1) + '\" font-size=\"' + (list.length > 14 ? 11 : 14) +\n         '\" font-family=\"Jua, sans-serif\" fill=\"#25163F\" text-anchor=\"middle\" dominant-baseline=\"middle\" transform=\"rotate(' +\n         (am * 180 / Math.PI).toFixed(1) + ' ' + tx.toFixed(1) + ' ' + ty.toFixed(1) + ')\">' + esc(short) + '<\/text>';\n  });\n  g += '<circle cx=\"160\" cy=\"160\" r=\"30\" fill=\"#1A1030\" stroke=\"#FFD23F\" stroke-width=\"5\"/>' +\n       '<text x=\"160\" y=\"169\" font-size=\"26\" text-anchor=\"middle\">🎪<\/text>';\n  document.getElementById('wheel').innerHTML = g;\n}\nfunction spinWheel() {\n  var list = pool(); if (!list.length) return;\n  var idx = Math.floor(Math.random() * list.length), seg = 360 / list.length;\n  var want = ((-(idx * seg + seg / 2)) % 360 + 360) % 360, cur = ((angle % 360) + 360) % 360;\n  angle = angle + 360 * 7 + ((want - cur + 360) % 360);\n  var w = document.getElementById('wheel');\n  w.style.transform = 'rotate(' + angle + 'deg)';\n  // 칸을 지날 때마다 딸깍 소리\n  var start = performance.now(), dur = 5400, from = cur, total = angle - (angle - (360 * 7 + ((want - cur + 360) % 360))), last = -1;\n  (function tickLoop(now) {\n    var t = Math.min(1, (now - start) / dur);\n    var e = 1 - Math.pow(1 - t, 3.2);\n    var passed = Math.floor((from + total * e) / seg);\n    if (passed !== last) { last = passed; tick(); }\n    if (t < 1) requestAnimationFrame(tickLoop);\n  })(start);\n  setTimeout(function () { finish(list[idx]); }, 5500);\n}\n\n/* ---------- 가챠 (공이 데굴데굴 구르는 기계) ---------- */\nvar GA = { balls: [], mode: 'idle', knob: 0, cap: null, open: 0, raf: null, shakeT: 0 };\nvar DOME = { x0: 58, x1: 242, y0: 30, y1: 182 };   // 공이 굴러다니는 유리통\n\nfunction makeBalls() {\n  GA.balls = [];\n  for (var i = 0; i < 16; i++) {\n    GA.balls.push({\n      x: DOME.x0 + 16 + Math.random() * (DOME.x1 - DOME.x0 - 32),\n      y: DOME.y0 + 20 + Math.random() * 100,\n      vx: (Math.random() - .5) * 60, vy: 0, r: 15, c: COLORS[i % COLORS.length],\n      spin: Math.random() * 6\n    });\n  }\n  for (var k = 0; k < 140; k++) stepBalls(1 / 60, false);   // 처음엔 바닥에 살포시 쌓아 두기\n}\nfunction stepBalls(dt, shaking) {\n  var g = 1500, bounce = .62, fr = shaking ? .99 : .992;\n  var cx = (DOME.x0 + DOME.x1) / 2, cy = (DOME.y0 + DOME.y1) / 2;\n  GA.balls.forEach(function (b) {\n    if (shaking) {\n      // 사방으로 마구 흔들기\n      b.vx += (Math.random() - .5) * 3600 * dt;\n      b.vy += (Math.random() - .5) * 3600 * dt;\n      // 통 안에서 빙글빙글 도는 흐름\n      var dx = b.x - cx, dy = b.y - cy;\n      b.vx += -dy * 7 * dt; b.vy += dx * 7 * dt;\n      // 속도가 너무 빨라지지 않게\n      var sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy);\n      if (sp > 950) { b.vx *= 950 / sp; b.vy *= 950 / sp; }\n    }\n    b.vy += g * dt; b.x += b.vx * dt; b.y += b.vy * dt;\n    b.spin += b.vx * dt * .08;\n    if (b.x < DOME.x0 + b.r) { b.x = DOME.x0 + b.r; b.vx = -b.vx * bounce; }\n    if (b.x > DOME.x1 - b.r) { b.x = DOME.x1 - b.r; b.vx = -b.vx * bounce; }\n    if (b.y < DOME.y0 + b.r) { b.y = DOME.y0 + b.r; b.vy = -b.vy * bounce; }\n    if (b.y > DOME.y1 - b.r) { b.y = DOME.y1 - b.r; b.vy = -b.vy * bounce; b.vx *= .96; }\n    b.vx *= fr; b.vy *= fr;\n  });\n  // 공끼리 부딪히며 서로 밀어내기 (두 번 반복하면 더 자연스러워요)\n  for (var pass = 0; pass < 2; pass++)\n  for (var i = 0; i < GA.balls.length; i++) {\n    for (var j = i + 1; j < GA.balls.length; j++) {\n      var a = GA.balls[i], c = GA.balls[j];\n      var dx = c.x - a.x, dy = c.y - a.y, d = Math.sqrt(dx * dx + dy * dy) || .01, min = a.r + c.r - 1;\n      if (d < min) {\n        var ux = dx / d, uy = dy / d, push = (min - d) / 2;\n        a.x -= ux * push; a.y -= uy * push; c.x += ux * push; c.y += uy * push;\n        var p = (a.vx - c.vx) * ux + (a.vy - c.vy) * uy;\n        if (p > 0) { a.vx -= p * ux * .85; a.vy -= p * uy * .85; c.vx += p * ux * .85; c.vy += p * uy * .85; }\n      }\n    }\n  }\n}\nfunction ballMarkup(b) {\n  var deg = (b.spin * 60).toFixed(0);\n  return '<g transform=\"translate(' + b.x.toFixed(1) + ' ' + b.y.toFixed(1) + ') rotate(' + deg + ')\">' +\n         '<circle r=\"' + b.r + '\" fill=\"' + b.c + '\"/>' +\n         '<path d=\"M' + (-b.r) + ' 0 a' + b.r + ' ' + b.r + ' 0 0 1 ' + (b.r * 2) + ' 0Z\" fill=\"rgba(255,255,255,.45)\"/>' +\n         '<circle cx=\"-4\" cy=\"-5\" r=\"3\" fill=\"rgba(255,255,255,.7)\"/><\/g>';\n}\nfunction drawGachaFrame() {\n  var shake = GA.mode === 'shake' ? (Math.random() * 7 - 3.5) : 0;\n  var g = '<g transform=\"translate(' + shake.toFixed(1) + ' 0)\">';\n  g += '<ellipse cx=\"150\" cy=\"318\" rx=\"98\" ry=\"10\" fill=\"rgba(0,0,0,.35)\"/>';\n  // 유리통\n  g += '<rect x=\"56\" y=\"24\" width=\"188\" height=\"162\" rx=\"30\" fill=\"rgba(170,225,255,.22)\" stroke=\"#8FD7FF\" stroke-width=\"5\"/>';\n  GA.balls.forEach(function (b) { g += ballMarkup(b); });\n  g += '<rect x=\"56\" y=\"24\" width=\"188\" height=\"70\" rx=\"28\" fill=\"rgba(255,255,255,.12)\"/>';\n  // 몸통\n  g += '<rect x=\"44\" y=\"180\" width=\"212\" height=\"126\" rx=\"24\" fill=\"#FF5FA2\" stroke=\"#C8316F\" stroke-width=\"5\"/>';\n  g += '<rect x=\"128\" y=\"182\" width=\"44\" height=\"52\" rx=\"10\" fill=\"#2B1B52\" opacity=\".35\"/>';   // 공이 내려오는 길\n  g += '<circle cx=\"80\" cy=\"220\" r=\"26\" fill=\"#FFF3D6\" stroke=\"#C8316F\" stroke-width=\"5\"/>';\n  g += '<rect x=\"68\" y=\"212\" width=\"24\" height=\"16\" rx=\"5\" fill=\"#C8316F\" transform=\"rotate(' + GA.knob.toFixed(0) + ' 80 220)\"/>';\n  g += '<rect x=\"104\" y=\"258\" width=\"92\" height=\"46\" rx=\"14\" fill=\"#2B1B52\" stroke=\"#C8316F\" stroke-width=\"4\"/>';\n  // 나온 캡슐\n  if (GA.cap) {\n    var c = GA.cap, sep = GA.open * 26;\n    g += '<g transform=\"translate(' + c.x.toFixed(1) + ' ' + c.y.toFixed(1) + ') rotate(' + (c.rot || 0).toFixed(0) + ')\">' +\n         '<path d=\"M-21 ' + (-sep) + ' a21 21 0 0 1 42 0Z\" fill=\"#FFF3D6\" stroke=\"#C99A1D\" stroke-width=\"2\"/>' +\n         '<path d=\"M-21 ' + sep + ' a21 21 0 0 0 42 0Z\" fill=\"#FFD23F\" stroke=\"#C99A1D\" stroke-width=\"2\"/>' +\n         (GA.open > .4 ? '<circle r=\"' + (6 + GA.open * 10).toFixed(1) + '\" fill=\"rgba(255,255,255,' + (1 - GA.open).toFixed(2) + ')\"/>' : '') +\n         '<\/g>';\n  }\n  g += '<\/g>';\n  document.getElementById('gacha').innerHTML = g;\n}\nfunction gachaLoop(now) {\n  var dt = 1 / 60;\n  if (GA.mode === 'shake') {\n    GA.knob += 10; GA.shakeT += dt;\n    stepBalls(dt, true);\n    if (Math.random() < .03) {           // 가끔 몇 개만 크게 튕겨 올려요\n      GA.balls.forEach(function (b) {\n        if (Math.random() < .4) { b.vy -= 250 + Math.random() * 350; b.vx += (Math.random() - .5) * 700; }\n      });\n    }\n  } else if (GA.mode === 'drop') {\n    stepBalls(dt, false);\n    var c = GA.cap;\n    c.vy += 1500 * dt; c.x += c.vx * dt; c.y += c.vy * dt; c.rot = (c.rot || 0) + c.vx * dt * .6;\n    if (c.y > 286) {                       // 받침대에 통통\n      c.y = 286; c.vy = -c.vy * .45; c.vx *= .7;\n      if (Math.abs(c.vy) > 40) beep(260, .06, 'triangle', .05);\n      if (Math.abs(c.vy) < 40) { c.vy = 0; c.vx = 0; }\n    }\n    if (c.x < 112) { c.x = 112; c.vx = -c.vx * .5; }\n    if (c.x > 190) { c.x = 190; c.vx = -c.vx * .5; }\n  } else if (GA.mode === 'open') {\n    GA.open = Math.min(1, GA.open + dt * 2.6);\n  } else {\n    stepBalls(dt, false);\n  }\n  drawGachaFrame();\n  GA.raf = requestAnimationFrame(gachaLoop);\n}\nfunction startGachaLoop() {\n  if (!GA.balls.length) makeBalls();\n  if (GA.raf) cancelAnimationFrame(GA.raf);\n  GA.raf = requestAnimationFrame(gachaLoop);\n}\nfunction stopGachaLoop() { if (GA.raf) cancelAnimationFrame(GA.raf); GA.raf = null; }\n\nfunction spinGacha() {\n  var list = pool(); if (!list.length) return;\n  var pick = list[Math.floor(Math.random() * list.length)];\n  GA.cap = null; GA.open = 0; GA.mode = 'shake';\n  var tickIv = setInterval(tick, 110);\n  setTimeout(function () {                       // 공 하나가 빠져나와요\n    clearInterval(tickIv);\n    GA.mode = 'drop';\n    GA.cap = { x: 150, y: 196, vx: (Math.random() - .5) * 60, vy: 40, rot: 0 };\n    beep(420, .1, 'triangle', .06);\n  }, 2000);\n  setTimeout(function () { GA.mode = 'open'; noise(.25, .1); beep(980, .15, 'triangle', .07); }, 3300);\n  setTimeout(function () { GA.mode = 'idle'; finish(pick); }, 3900);\n}\n\n/* ---------- 슬롯 ---------- */\nfunction drawSlot(list) {\n  var reel = document.getElementById('reel');\n  var seq = [];\n  for (var r = 0; r < 8; r++) seq = seq.concat(list);\n  reel.style.transition = 'none';\n  reel.style.transform = 'translateY(0)';\n  reel.innerHTML = seq.map(function (n) { return '<div>' + esc(n) + '<\/div>'; }).join('');\n  return seq;\n}\nfunction spinSlot() {\n  var list = pool(); if (!list.length) return;\n  var seq = drawSlot(list);\n  var idx = Math.floor(Math.random() * list.length);\n  var stopAt = list.length * 6 + idx;           // 여섯 바퀴쯤 돌고 멈춤\n  var h = document.querySelector('.reelBox').clientHeight;\n  var reel = document.getElementById('reel');\n  var start = performance.now(), dur = 3400, last = -1;\n  requestAnimationFrame(function () {\n    reel.style.transition = 'transform 3.4s cubic-bezier(.1,.75,.1,1)';\n    reel.style.transform = 'translateY(' + (-stopAt * h) + 'px)';\n  });\n  (function loop(now) {\n    var t = Math.min(1, (now - start) / dur), e = 1 - Math.pow(1 - t, 3.2);\n    var cell = Math.floor(stopAt * e);\n    if (cell !== last) { last = cell; tick(); }\n    if (t < 1) requestAnimationFrame(loop);\n  })(start);\n  setTimeout(function () { beep(220, .2, 'sawtooth', .07); finish(list[idx]); }, 3600);\n}\n\n/* ---------- 카드 ---------- */\nfunction drawCards() {\n  var list = pool(), box = document.getElementById('cards');\n  box.innerHTML = '';\n  var shuffled = list.slice().sort(function () { return Math.random() - .5; });\n  shuffled.forEach(function (name, i) {\n    var b = document.createElement('button');\n    b.className = 'cardBtn shuffling'; b.style.animationDelay = (i * .05) + 's';\n    b.textContent = ''; b.dataset.name = name;\n    b.addEventListener('click', function () {\n      if (busy) return;\n      busy = true;\n      [].forEach.call(box.children, function (c) { if (c !== b) c.classList.add('dim'); c.disabled = true; });\n      b.classList.add('open'); b.textContent = name;\n      beep(900, .1); noise(.2, .08);\n      setTimeout(function () { finish(name); }, 800);\n    });\n    box.appendChild(b);\n  });\n  if (soundOn) for (var k = 0; k < 6; k++) setTimeout(tick, k * 70);\n}\n\n/* ---------- 공통 ---------- */\nfunction start() {\n  var list = pool(); if (!list.length || busy) return;\n  busy = true;\n  document.getElementById('drawBtn').disabled = true;\n  if (!COUNTDOWN) return run();\n  var cd = document.getElementById('countdown'), txt = document.getElementById('cdText');\n  var steps = ['3', '2', '1', '두구두구!'];\n  cd.classList.add('show');\n  steps.forEach(function (s, i) {\n    setTimeout(function () {\n      txt.textContent = s; txt.style.animation = 'none'; void txt.offsetWidth; txt.style.animation = '';\n      beep(i === 3 ? 900 : 500 + i * 80, .12, 'square', .05);\n      if (i === steps.length - 1) setTimeout(function () { cd.classList.remove('show'); run(); }, 500);\n    }, i * 600);\n  });\n}\nfunction run() {\n  if (mode === 'wheel') spinWheel();\n  else if (mode === 'gacha') spinGacha();\n  else spinSlot();\n}\nfunction finish(name) {\n  busy = false;\n  document.getElementById('drawBtn').disabled = (mode === 'card');\n  if (used.indexOf(name) < 0) used.push(name);\n  save();\n  var fl = document.getElementById('flash');\n  fl.classList.remove('go'); void fl.offsetWidth; fl.classList.add('go');\n  document.getElementById('resultSub').textContent = TITLE;\n  document.getElementById('resultWho').textContent = name;\n  document.getElementById('result').classList.add('show');\n  fanfare(); applause(); confetti(60);\n  setTimeout(function () { confetti(30); }, 700);\n  renderSide();\n}\nfunction confetti(n) {\n  var box = document.getElementById('confetti');\n  for (var i = 0; i < n; i++) {\n    var s = document.createElement('i');\n    s.style.left = Math.random() * 100 + '%';\n    s.style.background = COLORS[i % COLORS.length];\n    s.style.animationDelay = (Math.random() * .6) + 's';\n    s.style.transform = 'rotate(' + (Math.random() * 180) + 'deg)';\n    box.appendChild(s);\n    (function (el) { setTimeout(function () { el.remove(); }, 2800); })(s);\n  }\n}\nfunction renderStage() {\n  ['wheel', 'gacha', 'slot', 'card'].forEach(function (m) {\n    document.getElementById('v-' + m).classList.toggle('on', m === mode);\n  });\n  if (mode === 'wheel') drawWheel();\n  if (mode === 'gacha') startGachaLoop(); else stopGachaLoop();\n  if (mode === 'slot') drawSlot(pool());\n  if (mode === 'card') drawCards();\n  var btn = document.getElementById('drawBtn');\n  btn.textContent = mode === 'card' ? '👆 마음에 드는 카드를 골라요!' : (mode === 'slot' ? '🎰 레버 당기기!' : '뽑기 시작!');\n  btn.disabled = mode === 'card';\n}\nfunction renderSide() {\n  var left = pool();\n  document.getElementById('poolChip').textContent = '남은 친구 ' + left.length + '명 · 전체 ' + names.length + '명';\n  document.getElementById('pool').innerHTML = names.map(function (n) {\n    return '<span class=\"' + (used.indexOf(n) >= 0 ? 'used' : '') + '\">' + esc(n) + '<\/span>';\n  }).join('');\n  var h = document.getElementById('history');\n  h.innerHTML = used.length ? '' : '<li class=\"empty\">아직 없어요. 먼저 뽑아 볼까요?<\/li>';\n  used.slice().reverse().forEach(function (n, i) {\n    var li = document.createElement('li');\n    li.textContent = (used.length - i) + '번째 · ' + n;\n    h.appendChild(li);\n  });\n}\nfunction renderAll() { renderStage(); renderSide(); }\n\n/* 배경 별 */\n(function () {\n  var st = document.getElementById('stars');\n  for (var i = 0; i < 40; i++) {\n    var s = document.createElement('i');\n    s.style.left = Math.random() * 100 + '%'; s.style.top = Math.random() * 100 + '%';\n    s.style.animationDelay = (Math.random() * 2.4) + 's';\n    s.style.width = s.style.height = (2 + Math.random() * 3).toFixed(1) + 'px';\n    st.appendChild(s);\n  }\n})();\n\n/* 버튼 */\n[].forEach.call(document.querySelectorAll('.tab'), function (t) {\n  t.addEventListener('click', function () {\n    if (busy) return;\n    mode = t.dataset.m;\n    [].forEach.call(document.querySelectorAll('.tab'), function (x) { x.classList.remove('on'); });\n    t.classList.add('on'); beep(760, .08); renderAll();\n  });\n});\ndocument.getElementById('drawBtn').addEventListener('click', function () { if (mode !== 'card') start(); });\ndocument.getElementById('againBtn').addEventListener('click', function () {\n  document.getElementById('result').classList.remove('show');\n  renderAll();\n  if (mode !== 'card') setTimeout(start, 200);\n});\ndocument.getElementById('closeBtn').addEventListener('click', function () {\n  document.getElementById('result').classList.remove('show'); renderAll();\n});\ndocument.getElementById('applyBtn').addEventListener('click', function () {\n  var list = document.getElementById('namesBox').value.split('\\n')\n    .map(function (x) { return x.trim(); }).filter(function (x) { return x; });\n  if (!list.length) { alert('이름을 한 줄에 한 명씩 적어 주세요'); return; }\n  names = list.slice(0, 40);\n  used = used.filter(function (u) { return names.indexOf(u) >= 0; });\n  save(); renderAll(); beep(880, .1);\n});\ndocument.getElementById('excludeChk').addEventListener('change', renderAll);\ndocument.getElementById('resetBtn').addEventListener('click', function () { used = []; save(); renderAll(); beep(660, .1); });\ndocument.getElementById('soundBtn').addEventListener('click', function () { soundOn = !soundOn; this.textContent = soundOn ? '🔊' : '🔇'; });\ndocument.getElementById('fsBtn').addEventListener('click', function () {\n  if (document.fullscreenElement) { document.exitFullscreen(); this.textContent = '⛶'; }\n  else if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen(); this.textContent = '✕'; }\n});\ndocument.addEventListener('keydown', function (e) {\n  if (e.key === 'Escape') document.getElementById('result').classList.remove('show');\n  if (e.key === ' ' && document.activeElement.tagName !== 'TEXTAREA') { e.preventDefault(); document.getElementById('drawBtn').click(); }\n});\n\ndocument.getElementById('namesBox').value = names.join('\\n');\nrenderAll();\n<\/script>\n<\/body>\n<\/html>\n", "prompt": "한 문장씩 차례로 넣어 보세요. 한 단계마다 결과를 눌러 보고 다음으로 넘어갑니다.\n\n1단계 · 기본 만들기\n우리 반 도우미 뽑기 룰렛을 만들어줘. 이름을 직접 적을 수 있고, 버튼을 누르면 룰렛이 돌다가 한 명이 뽑혀. 초등학생용으로 크고 알록달록하게.\n\n2단계 · 교실에서 쓸 수 있게\n뽑힌 친구는 다시 안 뽑히게 하고, 오늘 뽑힌 순서를 옆에 보여줘.\n\n3단계 · 애타게 만들기\n뽑기 전에 3, 2, 1 카운트다운이 뜨고, 룰렛이 돌 때 칸을 지날 때마다 딸깍 소리가 나게 해줘.\n\n4단계 · 결과를 화려하게\n뽑히면 화면이 번쩍하고 왕관이랑 무지개색 이름이 크게 뜨게 해줘. 팡파르랑 색종이도.\n\n5단계 · 뽑는 방법 늘리기\n룰렛 말고 가챠, 슬롯, 카드 뽑기도 고를 수 있게 해줘. 위에 탭으로.\n\n6단계 · 마음에 안 드는 부분 고치기\n가챠 공이 위에만 떠 있어. 서로 밀어내면서 통 안을 이리저리 굴러다니게 고쳐줘.\n\n7단계 · 교실 화면에 맞추기\n교실 TV에 띄울 거야. 한 화면에 꽉 차게 하고 전체화면 버튼도 넣어줘."}, {"icon": "🐝", "title": "실습 ④ 읽기 활동지 + 단어게임", "desc": "꿀벌 이야기 활동지와 뜻 맞히기·짝 맞추기.", "html": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>꿀벌 이야기 · 읽기 활동지와 단어게임<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap\" rel=\"stylesheet\">\n<style>\n  :root { --honey:#F7B500; --deep:#5A3D12; --leaf:#4CAF7A; --sky:#EAF4FF; --paper:#FFFCF2; --red:#F2545B; }\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n  body { font-family: 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: var(--paper); color: var(--deep); }\n  h1, h2, h3, button, .tab, .word-chip, .big { font-family: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-weight: normal; }\n  header { background: var(--honey); padding: 22px 16px 0; text-align: center; }\n  header h1 { font-size: clamp(28px, 6vw, 44px); }\n  .tabs { display: flex; justify-content: center; gap: 8px; margin-top: 14px; }\n  .tab { font-size: 22px; padding: 12px 26px; border: none; border-radius: 18px 18px 0 0; background: #FFE08A; color: var(--deep); cursor: pointer; }\n  .tab.on { background: var(--paper); }\n  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 60px; }\n  section.page { display: none; } section.page.on { display: block; }\n  h2 { font-size: 28px; margin: 28px 0 12px; }\n  .reading { background: #fff; border-radius: 20px; padding: 24px; font-size: 21px; line-height: 1.9; border: 3px solid #FFE08A; }\n  .reading mark { background: #FFF1B8; padding: 0 3px; border-radius: 4px; }\n  .vocab { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }\n  .flip { background: #fff; border: 3px solid var(--leaf); border-radius: 16px; padding: 16px 10px; min-height: 100px; text-align: center; cursor: pointer; font-size: 18px; display:flex; flex-direction:column; justify-content:center; }\n  .flip .big { font-size: 28px; color: var(--leaf); }\n  .flip .hint { font-size: 14px; color: #A89A7C; margin-top: 4px; }\n  .q { background: #fff; border-radius: 20px; padding: 20px; margin-bottom: 14px; border: 3px solid #EFE6CC; }\n  .q h3 { font-size: 22px; margin-bottom: 12px; }\n  .opts { display: grid; gap: 8px; }\n  .opt { text-align: left; font-family: 'Gowun Dodum', sans-serif; font-size: 19px; padding: 12px 16px; border-radius: 12px; border: 2px solid #E8DDBF; background: var(--paper); cursor: pointer; color: var(--deep); }\n  .opt.sel { border-color: var(--honey); background: #FFF1B8; }\n  .opt.right { border-color: var(--leaf); background: #DFF5E8; }\n  .opt.wrong { border-color: var(--red); background: #FFE1E2; }\n  .primary { font-size: 24px; padding: 14px 40px; border: none; border-radius: 999px; background: var(--leaf); color: #fff; cursor: pointer; margin-top: 8px; }\n  .result { font-family: 'Jua', sans-serif; font-size: 30px; text-align: center; margin-top: 18px; }\n  button:focus-visible, .flip:focus-visible { outline: 4px solid var(--deep); outline-offset: 3px; }\n\n  .modes { display: flex; gap: 10px; justify-content: center; margin-bottom: 18px; flex-wrap: wrap; }\n  .mode { font-size: 22px; padding: 10px 24px; border-radius: 999px; border: 3px solid var(--honey); background: #fff; color: var(--deep); cursor: pointer; }\n  .mode.on { background: var(--honey); }\n  .score { text-align: center; font-family: 'Jua', sans-serif; font-size: 26px; margin-bottom: 16px; }\n  .quiz-card { background: #fff; border-radius: 28px; padding: 30px 20px; text-align: center; border: 4px solid var(--honey); }\n  .quiz-card .meaning { font-size: clamp(26px, 5vw, 36px); line-height: 1.4; margin-bottom: 24px; font-family: 'Jua', sans-serif; }\n  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }\n  .word-chip { font-size: clamp(24px, 5vw, 32px); padding: 18px 8px; border-radius: 20px; border: 3px solid #FFE08A; background: var(--paper); color: var(--deep); cursor: pointer; }\n  .word-chip.right { background: #DFF5E8; border-color: var(--leaf); }\n  .word-chip.wrong { background: #FFE1E2; border-color: var(--red); }\n  .match { display: grid; grid-template-columns: 1fr 1.6fr; gap: 12px; }\n  .col { display: flex; flex-direction: column; gap: 10px; }\n  .m-item { font-size: 18px; padding: 14px 10px; border-radius: 14px; border: 3px solid #E8DDBF; background: #fff; cursor: pointer; color: var(--deep); font-family: 'Gowun Dodum', sans-serif; }\n  .m-item.w { font-family: 'Jua', sans-serif; font-size: 24px; }\n  .m-item.sel { border-color: var(--honey); background: #FFF1B8; }\n  .m-item.done { border-color: var(--leaf); background: #DFF5E8; opacity: .55; cursor: default; }\n  .m-item.shake { animation: shake .3s; border-color: var(--red); }\n  @keyframes shake { 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }\n  @media (prefers-reduced-motion: reduce) { .m-item.shake { animation: none; } }\n<\/style>\n<\/head>\n<body>\n<header>\n  <h1>🐝 꿀벌 이야기<\/h1>\n  <div class=\"tabs\">\n    <button class=\"tab on\" onclick=\"showPage('read', this)\">📖 읽기 활동지<\/button>\n    <button class=\"tab\" onclick=\"showPage('game', this)\">🎮 단어게임<\/button>\n  <\/div>\n<\/header>\n\n<main>\n  <!-- ① 읽기자료 인터랙티브 활동지 -->\n  <section class=\"page on\" id=\"read\">\n    <h2>1. 글을 읽어요 (초등 3학년)<\/h2>\n    <div class=\"reading\">\n      <mark>꿀벌<\/mark>은 여럿이 함께 모여 사는 <mark>곤충<\/mark>이에요.\n      <mark>벌집<\/mark> 하나에는 알을 낳는 <mark>여왕벌<\/mark>과 일을 하는 수많은 <mark>일벌<\/mark>이 살아요.\n      일벌은 꽃을 찾아다니며 꿀과 <mark>꽃가루<\/mark>를 모아요.\n      이때 몸에 묻은 꽃가루가 다른 꽃으로 옮겨져서 <mark>열매<\/mark>가 맺히도록 도와줘요.\n      먹이가 많은 곳을 찾은 일벌은 벌집으로 돌아와 엉덩이를 흔들며 <mark>춤<\/mark>을 춰요.\n      이 춤으로 친구들에게 꽃이 있는 방향과 거리를 알려 준답니다.\n    <\/div>\n\n    <h2>2. 낱말 뜻을 알아봐요<\/h2>\n    <div class=\"vocab\" id=\"vocab\"><\/div>\n\n    <h2>3. 문제를 풀어요<\/h2>\n    <div id=\"questions\"><\/div>\n    <div style=\"text-align:center\"><button class=\"primary\" onclick=\"grade()\">채점하기<\/button><\/div>\n    <div class=\"result\" id=\"result\"><\/div>\n  <\/section>\n\n  <!-- ② 단어게임 -->\n  <section class=\"page\" id=\"game\">\n    <div class=\"modes\">\n      <button class=\"mode on\" onclick=\"startQuiz(this)\">뜻 맞히기<\/button>\n      <button class=\"mode\" onclick=\"startMatch(this)\">짝 맞추기<\/button>\n    <\/div>\n    <div class=\"score\" id=\"score\"><\/div>\n    <div id=\"gameArea\"><\/div>\n  <\/section>\n<\/main>\n\n<script>\n  // ===== 핵심 단어 8개 (여기만 바꾸면 다른 글로도 쓸 수 있어요) =====\n  const words = [\n    { w: '꿀벌', m: '꽃에서 꿀을 모으는 곤충' },\n    { w: '곤충', m: '다리가 여섯 개인 작은 동물' },\n    { w: '벌집', m: '벌들이 모여 사는 집' },\n    { w: '여왕벌', m: '벌집에서 알을 낳는 벌' },\n    { w: '일벌', m: '꿀과 꽃가루를 모으는 벌' },\n    { w: '꽃가루', m: '꽃 안에 있는 작은 가루' },\n    { w: '열매', m: '꽃이 지고 난 뒤 맺히는 것' },\n    { w: '춤', m: '일벌이 먹이 있는 곳을 알리는 방법' },\n  ];\n\n  // ===== 읽기 활동지 =====\n  const vocabList = ['곤충', '여왕벌', '일벌', '꽃가루', '열매'];\n  document.getElementById('vocab').innerHTML = vocabList.map(v => {\n    const m = words.find(x => x.w === v).m;\n    return `<div class=\"flip\" tabindex=\"0\" role=\"button\" data-w=\"${v}\" data-m=\"${m}\" onclick=\"flip(this)\" onkeydown=\"if(event.key==='Enter')flip(this)\">\n      <span class=\"big\">${v}<\/span><span class=\"hint\">눌러서 뜻 보기<\/span><\/div>`;\n  }).join('');\n  function flip(el) {\n    const showing = el.dataset.open === '1';\n    el.dataset.open = showing ? '0' : '1';\n    el.innerHTML = showing\n      ? `<span class=\"big\">${el.dataset.w}<\/span><span class=\"hint\">눌러서 뜻 보기<\/span>`\n      : `<span>${el.dataset.m}<\/span><span class=\"hint\">다시 누르면 낱말<\/span>`;\n  }\n\n  const questions = [\n    { q: '알을 낳는 벌은 누구인가요?', o: ['일벌', '여왕벌', '수벌', '꿀벌 아기'], a: 1 },\n    { q: '일벌이 꽃에서 모으는 것은 무엇인가요?', o: ['물과 흙', '잎과 줄기', '꿀과 꽃가루', '씨앗과 모래'], a: 2 },\n    { q: '꽃가루가 다른 꽃으로 옮겨지면 어떤 일이 생기나요?', o: ['꽃이 시들어요', '열매가 맺혀요', '벌집이 커져요', '비가 와요'], a: 1 },\n    { q: '일벌이 춤을 추는 까닭은 무엇인가요?', o: ['기분이 좋아서', '여왕벌에게 인사하려고', '먹이 있는 곳을 알려 주려고', '몸을 따뜻하게 하려고'], a: 2 },\n  ];\n  const answers = questions.map(() => null);\n  document.getElementById('questions').innerHTML = questions.map((q, i) => `\n    <div class=\"q\"><h3>${i + 1}. ${q.q}<\/h3>\n      <div class=\"opts\">${q.o.map((o, j) => `<button class=\"opt\" id=\"o${i}_${j}\" onclick=\"choose(${i},${j})\">${'①②③④'[j]} ${o}<\/button>`).join('')}<\/div>\n    <\/div>`).join('');\n  function choose(i, j) {\n    answers[i] = j;\n    questions[i].o.forEach((_, k) => document.getElementById(`o${i}_${k}`).className = 'opt' + (k === j ? ' sel' : ''));\n  }\n  function grade() {\n    let score = 0;\n    questions.forEach((q, i) => {\n      q.o.forEach((_, k) => {\n        const el = document.getElementById(`o${i}_${k}`);\n        el.className = 'opt' + (k === q.a ? ' right' : (k === answers[i] ? ' wrong' : ''));\n      });\n      if (answers[i] === q.a) score++;\n    });\n    const msg = score === 4 ? '🎉 다 맞았어요!' : score >= 2 ? '👍 잘했어요!' : '💪 글을 한 번 더 읽어 봐요!';\n    document.getElementById('result').textContent = `${questions.length}문제 중 ${score}개 맞음 · ${msg}`;\n  }\n\n  function showPage(id, btn) {\n    document.querySelectorAll('.page').forEach(p => p.classList.toggle('on', p.id === id));\n    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t === btn));\n  }\n\n  // ===== 단어게임 =====\n  const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]);\n  const area = () => document.getElementById('gameArea');\n  const setScore = t => document.getElementById('score').textContent = t;\n  function setMode(btn) { document.querySelectorAll('.mode').forEach(b => b.classList.toggle('on', b === btn)); }\n\n  // 뜻 맞히기\n  let order = [], qi = 0, pts = 0, locked = false;\n  function startQuiz(btn) {\n    if (btn) setMode(btn);\n    order = shuffle(words); qi = 0; pts = 0; nextQuiz();\n  }\n  function nextQuiz() {\n    locked = false;\n    if (qi >= order.length) {\n      setScore(`⭐ 점수 ${pts} / ${order.length}`);\n      area().innerHTML = `<div class=\"quiz-card\"><div class=\"meaning\">${pts === order.length ? '🏆 만점이에요!' : '🎉 끝! 수고했어요'}<\/div>\n        <button class=\"primary\" onclick=\"startQuiz()\">다시 하기<\/button><\/div>`;\n      return;\n    }\n    setScore(`⭐ 점수 ${pts}   ·   ${qi + 1} / ${order.length}번째`);\n    const cur = order[qi];\n    const choices = shuffle([cur, ...shuffle(words.filter(x => x !== cur)).slice(0, 3)]);\n    area().innerHTML = `<div class=\"quiz-card\"><div class=\"meaning\">“${cur.m}”<\/div>\n      <div class=\"choices\">${choices.map(c => `<button class=\"word-chip\" onclick=\"answerQuiz(this, '${c.w}')\">${c.w}<\/button>`).join('')}<\/div><\/div>`;\n  }\n  function answerQuiz(el, w) {\n    if (locked) return; locked = true;\n    const correct = w === order[qi].w;\n    if (correct) pts++;\n    el.classList.add(correct ? 'right' : 'wrong');\n    if (!correct) [...document.querySelectorAll('.word-chip')].find(b => b.textContent === order[qi].w).classList.add('right');\n    setTimeout(() => { qi++; nextQuiz(); }, 900);\n  }\n\n  // 짝 맞추기\n  let selW = null, selM = null, matched = 0, tries = 0;\n  function startMatch(btn) {\n    setMode(btn); matched = 0; tries = 0; selW = selM = null;\n    setScore(`🔗 맞춘 짝 0 / ${words.length}`);\n    area().innerHTML = `<div class=\"match\">\n      <div class=\"col\">${shuffle(words).map(x => `<button class=\"m-item w\" data-k=\"${x.w}\" onclick=\"pickM(this,'w')\">${x.w}<\/button>`).join('')}<\/div>\n      <div class=\"col\">${shuffle(words).map(x => `<button class=\"m-item\" data-k=\"${x.w}\" onclick=\"pickM(this,'m')\">${x.m}<\/button>`).join('')}<\/div>\n    <\/div>`;\n  }\n  function pickM(el, side) {\n    if (el.classList.contains('done')) return;\n    if (side === 'w') { selW && selW.classList.remove('sel'); selW = el; }\n    else { selM && selM.classList.remove('sel'); selM = el; }\n    el.classList.add('sel');\n    if (selW && selM) {\n      tries++;\n      if (selW.dataset.k === selM.dataset.k) {\n        [selW, selM].forEach(e => { e.classList.remove('sel'); e.classList.add('done'); });\n        matched++;\n      } else {\n        [selW, selM].forEach(e => { e.classList.remove('sel'); e.classList.add('shake'); setTimeout(() => e.classList.remove('shake'), 350); });\n      }\n      selW = selM = null;\n      setScore(matched === words.length\n        ? `🏆 다 맞췄어요! (${tries}번 만에)`\n        : `🔗 맞춘 짝 ${matched} / ${words.length}`);\n    }\n  }\n\n  startQuiz();\n<\/script>\n<\/body>\n<\/html>\n", "prompt": "① 글을 초등 3학년용으로 쉽게 바꿔줘.\n② 방금 글로 인터랙티브 활동지를 만들어줘. 읽기글, 낱말뜻, 객관식 4문제, 바로 채점.\n③ 핵심 단어 8개로 단어게임 만들어줘. 뜻 맞히기, 짝 맞추기, 점수 표시. 폰에서도 크게, 귀여운 디자인으로.", "file": "실습4_읽기활동지_단어게임.html"}, {"icon": "🌏", "title": "실습 ⑤ 환경교육: 우리 반 초록 화분", "desc": "실천할수록 화분이 자라고 숲에 동물 친구가 모여요.", "file": "실습5_우리반초록화분.html", "html": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>우리 반 초록 화분<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap\" rel=\"stylesheet\">\n<style>\n  :root { --ink:#2F4632; --muted:#6F836F; --card:#FFFFFF; --leaf:#5DBB63; --leaf2:#3F9A48; --soil:#8B5E3C; --sky:#EAF7FF; --sand:#FFF6DF; --line:#E3EFD9; --water:#4FA9F0; --sun:#FFC933; }\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n  body { font-family: 'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif; color: var(--ink); background: var(--sand); min-height: 100vh; }\n  .j, h1, h2, h3, button { font-family: 'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-weight: normal; }\n  .wrap { max-width: 1040px; margin: 0 auto; padding: 20px 16px 50px; }\n  header { text-align: center; margin-bottom: 16px; }\n  .date { display: inline-block; background: #fff; border-radius: 999px; padding: 5px 16px; color: var(--muted); font-size: 16px; }\n  h1 { font-size: clamp(32px, 7vw, 54px); margin-top: 6px; }\n  .mode { font-size: 14px; color: var(--muted); margin-top: 2px; }\n\n  .top { display: grid; grid-template-columns: 1.05fr 1fr; gap: 18px; align-items: start; }\n  .stage { background: linear-gradient(180deg, var(--sky) 0%, #F4FBFF 70%, #EAF6E0 70%); border-radius: 32px; padding: 14px; position: relative; overflow: hidden; border: 4px solid #fff; }\n  .stage svg { width: 100%; height: auto; display: block; }\n  .badge { position: absolute; left: 16px; top: 14px; background: #fff; border-radius: 999px; padding: 6px 14px; font-family: 'Jua',sans-serif; font-size: 20px; }\n  .fx { position: absolute; inset: 0; pointer-events: none; }\n  .fx span { position: absolute; font-size: 34px; animation: fall 1.4s ease-in forwards; }\n  @keyframes fall { from { transform: translateY(-30px); opacity: 0; } 20% { opacity: 1; } to { transform: translateY(170px); opacity: 0; } }\n  .prog { margin-top: 10px; background: #fff; border-radius: 999px; height: 22px; overflow: hidden; position: relative; }\n  .prog i { display: block; height: 100%; background: linear-gradient(90deg, #9BE08F, var(--leaf)); border-radius: 999px; transition: width .6s; }\n  .prog b { position: absolute; inset: 0; text-align: center; font-family: 'Jua',sans-serif; font-weight: normal; font-size: 14px; line-height: 22px; }\n  .next { text-align: center; font-size: 15px; color: var(--muted); margin-top: 6px; }\n\n  .panel { background: var(--card); border-radius: 28px; padding: 18px; border: 4px solid var(--line); }\n  .panel h2 { font-size: 24px; margin-bottom: 10px; }\n  .who { display: flex; flex-wrap: wrap; gap: 6px; }\n  .who button { border: 3px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; font-size: 17px; cursor: pointer; color: var(--ink); }\n  .who button.on { border-color: var(--leaf); background: #E9F8E5; }\n  .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }\n  .act { text-align: left; border: 4px solid var(--line); background: #fff; border-radius: 20px; padding: 12px; cursor: pointer; color: var(--ink); position: relative; min-height: 104px; }\n  .act .e { font-size: 30px; }\n  .act .t { font-size: 19px; display: block; }\n  .act .d { font-family: 'Gowun Dodum',sans-serif; font-size: 13.5px; color: var(--muted); display: block; line-height: 1.4; }\n  .act .g { position: absolute; right: 10px; top: 10px; font-size: 13px; background: var(--sand); border-radius: 999px; padding: 2px 8px; }\n  .act.on { border-color: var(--leaf); background: #E9F8E5; }\n  .act.did { opacity: .5; cursor: default; }\n  .act.did .g { background: #E9F8E5; }\n  .send { width: 100%; margin-top: 14px; font-size: 24px; border: none; border-radius: 999px; padding: 12px; background: var(--leaf); color: #fff; cursor: pointer; box-shadow: 0 6px 0 var(--leaf2); }\n  .send:disabled { opacity: .45; cursor: default; box-shadow: none; }\n  .hint { text-align: center; color: var(--muted); font-size: 14px; margin-top: 8px; min-height: 20px; }\n  .plant-btn { width: 100%; font-size: 26px; border: none; border-radius: 24px; padding: 18px; background: var(--soil); color: #fff; cursor: pointer; }\n\n  .bottom { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 18px; }\n  .gauges { display: grid; gap: 10px; }\n  .gg { display: grid; grid-template-columns: 90px 1fr 44px; align-items: center; gap: 8px; font-size: 16px; }\n  .gg .bar { background: #F0F4EC; border-radius: 999px; height: 16px; overflow: hidden; }\n  .gg .bar i { display: block; height: 100%; border-radius: 999px; transition: width .5s; }\n  .gg b { font-family: 'Jua',sans-serif; font-weight: normal; text-align: right; }\n  .stat { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }\n  .stat span { background: var(--sand); border-radius: 999px; padding: 4px 12px; font-size: 15px; }\n  .feed { list-style: none; display: grid; gap: 6px; max-height: 260px; overflow-y: auto; }\n  .feed li { background: #F7FBF4; border-radius: 14px; padding: 8px 12px; font-size: 16px; }\n  .feed .empty { color: var(--muted); background: none; }\n\n  .teacher { margin-top: 22px; text-align: center; }\n  .teacher summary { cursor: pointer; font-family: 'Jua',sans-serif; font-size: 17px; color: var(--muted); list-style: none; }\n  .teacher .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }\n  .teacher button { font-size: 16px; border: 2px solid var(--line); background: #fff; color: var(--ink); border-radius: 999px; padding: 6px 16px; cursor: pointer; }\n  button:focus-visible { outline: 4px solid var(--ink); outline-offset: 2px; }\n\n  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 20px; border-radius: 999px; font-family: 'Jua',sans-serif; font-size: 18px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10; text-align: center; }\n  .toast.show { opacity: 1; }\n\n  .sway { transform-origin: 150px 290px; animation: sway 5s ease-in-out infinite; }\n  @keyframes sway { 0%,100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }\n  .fly { animation: fly 6s ease-in-out infinite; }\n  @keyframes fly { 0%,100% { transform: translate(0,0); } 50% { transform: translate(14px,-12px); } }\n  @media (prefers-reduced-motion: reduce) { .sway, .fly, .fx span { animation: none; } }\n  @media (max-width: 760px) { .top, .bottom { grid-template-columns: 1fr; } }\n\n  html, body { height: 100%; }\n  body { padding: 0; overflow: hidden; }\n  .wrap { height: 100%; max-width: 1500px; margin: 0 auto; padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 10px; }\n  header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; text-align: left; }\n  header h1 { font-size: clamp(22px, 2.6vw, 34px); margin: 0; }\n  header .date, header .mode { background: #fff; border-radius: 999px; padding: 4px 14px; font-size: 14px; color: var(--muted); }\n  .teacher { margin: 0 0 0 auto; position: relative; text-align: right; }\n  .teacher summary { font-size: 14px; background: #fff; border-radius: 999px; padding: 5px 14px; }\n  .teacher .row { position: absolute; right: 0; top: 34px; background: #fff; border-radius: 16px; padding: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.12); z-index: 5; display: flex; flex-direction: column; gap: 6px; width: max-content; margin: 0; }\n  .teacher button { white-space: nowrap; }\n\n  .main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.05fr .95fr .95fr; gap: 12px; }\n  .col { display: flex; flex-direction: column; gap: 10px; min-height: 0; }\n  .stage { flex: 1; min-height: 0; margin: 0; }\n  .stage svg { width: 100%; height: 100%; }\n  .panel { min-height: 0; overflow-y: auto; }\n  .panel.grow { flex: 1; }\n  .feed { max-height: none; }\n\n  @media (max-width: 1080px) {\n    .main { grid-template-columns: 1.1fr 1fr; grid-template-rows: 1fr auto; }\n    .main .col:nth-child(3) { grid-column: 1 / -1; flex-direction: row; }\n    .main .col:nth-child(3) .panel { flex: 1; }\n  }\n  @media (max-width: 760px) {\n    body { overflow: auto; }\n    .wrap { height: auto; }\n    .main { grid-template-columns: 1fr; }\n    .main .col:nth-child(3) { flex-direction: column; }\n    .stage { min-height: 320px; }\n  }\n\n  .tabs { display: flex; gap: 6px; }\n  .tab { font-family: 'Jua', sans-serif; font-size: 16px; border: 3px solid var(--line); background: #fff; color: var(--muted); border-radius: 999px; padding: 5px 16px; cursor: pointer; }\n  .tab.on { border-color: var(--leaf); background: #E9F8E5; color: var(--ink); }\n  #forest { width: 100%; height: 100%; }\n  [hidden] { display: none !important; }\n  .sway-slow { transform-origin: 0px 4px; animation: swaySlow 6s ease-in-out infinite; }\n  @keyframes swaySlow { 0%,100% { transform: rotate(-1.2deg); } 50% { transform: rotate(1.2deg); } }\n  .hop { animation: hop 3.2s ease-in-out infinite; }\n  @keyframes hop { 0%,70%,100% { transform: translateY(0); } 80% { transform: translateY(-7px); } 90% { transform: translateY(0); } }\n  @media (prefers-reduced-motion: reduce) { .sway-slow, .hop { animation: none; } }\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <header>\n    <h1>🌏 우리 반 초록 화분<\/h1>\n    <span class=\"date\" id=\"date\"><\/span>\n    <span class=\"mode\" id=\"mode\"><\/span>\n    <details class=\"teacher\">\n      <summary>🔒 선생님<\/summary>\n      <div class=\"row\">\n        <button id=\"demoBtn\">🎬 시연용으로 쑥쑥 키우기<\/button>\n        <button id=\"meBtn\">👤 이름 다시 고르기<\/button>\n        <button id=\"resetBtn\">🗑️ 처음부터 다시<\/button>\n      <\/div>\n    <\/details>\n  <\/header>\n\n  <main class=\"main\">\n    <section class=\"col col-stage\">\n      <div class=\"tabs\">\n        <button class=\"tab on\" id=\"tabPot\">🪴 우리 화분<\/button>\n        <button class=\"tab\" id=\"tabForest\">🌳 우리 숲<\/button>\n      <\/div>\n      <div class=\"stage\">\n        <span class=\"badge\" id=\"badge\"><\/span>\n        <svg id=\"plant\" viewBox=\"0 0 300 360\" preserveAspectRatio=\"xMidYMax meet\" role=\"img\" aria-label=\"우리 반 화분\"><\/svg>\n        <svg id=\"forest\" viewBox=\"0 0 520 360\" preserveAspectRatio=\"xMidYMax meet\" role=\"img\" aria-label=\"우리 반 숲\" style=\"display:none\"><\/svg>\n        <div class=\"fx\" id=\"fx\"><\/div>\n      <\/div>\n      <div class=\"prog\"><i id=\"progBar\"><\/i><b id=\"progText\"><\/b><\/div>\n      <p class=\"next\" id=\"next\"><\/p>\n    <\/section>\n\n    <section class=\"col\">\n      <div class=\"panel grow\" id=\"panel\"><\/div>\n    <\/section>\n\n    <section class=\"col\">\n      <div class=\"panel\">\n        <h2>☀️ 오늘 화분이 받은 것<\/h2>\n        <div class=\"gauges\" id=\"gauges\"><\/div>\n        <div class=\"stat\" id=\"stat\"><\/div>\n      <\/div>\n      <div class=\"panel grow\">\n        <h2>📣 오늘의 실천 소식<\/h2>\n        <ul class=\"feed\" id=\"feed\"><\/ul>\n      <\/div>\n    <\/section>\n  <\/main>\n<\/div>\n<div class=\"toast\" id=\"toast\"><\/div>\n\n<script>\n/* ▼ 고치는 부분 ─────────────────────────────────── */\n// 학생 별명 (실제로 쓸 때도 번호나 별명을 추천해요)\nvar STUDENTS = ['🐰 토끼', '🐻 곰돌이', '🦊 여우', '🐼 판다', '🐱 고양이', '🐶 강아지', '🐥 병아리', '🐹 햄스터'];\n\n// 실천 항목: 무엇을 하면 화분에 무엇이 가는지\nvar ACTIONS = [\n  { key: 'water', emoji: '💧', title: '물 아끼기',   desc: '양치컵 쓰기, 수도꼭지 꼭 잠그기', gives: '물',   fx: '💧', color: '#4FA9F0' },\n  { key: 'paper', emoji: '📄', title: '종이 아끼기', desc: '이면지 쓰기, 공책 끝까지 쓰기', gives: '거름', fx: '🍂', color: '#B7864F' },\n  { key: 'light', emoji: '💡', title: '전기 아끼기', desc: '빈 교실 불 끄기, 플러그 뽑기',  gives: '햇빛', fx: '☀️', color: '#FFC933' },\n  { key: 'cup',   emoji: '🥤', title: '일회용품 줄이기', desc: '텀블러 쓰기, 장바구니 챙기기', gives: '나비', fx: '🦋', color: '#B58CF0' }\n];\n\n// 우리 반 목표 점수 (실천 1개 = 1점). 학생 수 × 3 × 20일 정도가 알맞아요.\nvar GOAL = 150;\n\n// 여러 패드에서 함께 키우려면 구글 Apps Script 웹앱 주소를 넣으세요.\n// 비워 두면 이 기기 하나에서만 기록돼요(시연용).\nvar SCRIPT_URL = '';\n// 숲에 찾아오는 동물 친구들 (at = 목표 점수 중 몇 %일 때 오는지)\nvar ANIMALS = [\n  { key: 'butterfly', icon: '🦋', name: '나비',     at: .04, x: 168, y: 214, s: .9, air: true },\n  { key: 'squirrel',  icon: '🐿️', name: '다람쥐',   at: .10, x: 384, y: 322, s: .85 },\n  { key: 'bird',      icon: '🐦', name: '작은 새',   at: .18, x: 262, y: 186, s: .8, air: true },\n  { key: 'rabbit',    icon: '🐇', name: '산토끼',   at: .28, x: 104, y: 330, s: .9 },\n  { key: 'hedgehog',  icon: '🦔', name: '고슴도치', at: .38, x: 306, y: 340, s: .85 },\n  { key: 'fox',       icon: '🦊', name: '여우',     at: .50, x: 438, y: 322, s: 1 },\n  { key: 'owl',       icon: '🦉', name: '부엉이',   at: .62, x: 236, y: 250, s: .8, air: true },\n  { key: 'deer',      icon: '🦌', name: '사슴',     at: .76, x: 72,  y: 296, s: 1.05 },\n  { key: 'bear',      icon: '🐻', name: '곰',       at: .90, x: 254, y: 292, s: 1.05 }\n];\n/* ▲ 고치는 부분 끝 ───────────────────── m(LOCAL_KEY, JSON.stringify(s)); } catch (e) {}\n    return s;\n  }\n};\n\nvar me = null; try { me = localStorage.getItem(ME_KEY); } catch (e) {}\nvar chosen = [];\n\nfunction actOf(k) { return ACTIONS.find(function (a) { return a.key === k; }); }\nfunction score() { return state.records.length; }\nfunction stageIdx() { var p = score() / GOAL, i = 0; STAGES.forEach(function (s, k) { if (p >= s.at) i = k; }); return i; }\nfunction todayRecs() { return state.records.filter(function (r) { return r.d === TODAY; }); }\n\n/* ---------- 화분 그리기 ---------- */\nfunction drawPlant() {\n  var st = state.planted ? stageIdx() : -1;\n  var all = state.records;\n  var butterflies = Math.min(3, Math.floor(all.filter(function (r) { return r.act === 'cup'; }).length / 6));\n  var sunToday = todayRecs().filter(function (r) { return r.act === 'light'; }).length;\n  var stemH = [0, 26, 52, 92, 128, 158, 170, 180][Math.max(st, 0)];\n  var pairs = [0, 0, 1, 2, 3, 4, 4, 5][Math.max(st, 0)];\n  var topY = 286 - stemH;\n  var g = '';\n\n  // 해\n  g += '<circle cx=\"250\" cy=\"48\" r=\"' + (22 + Math.min(sunToday, 10)) + '\" fill=\"#FFE27A\" opacity=\".45\"/><circle cx=\"250\" cy=\"48\" r=\"20\" fill=\"#FFC933\"/>';\n  // 구름\n  g += '<g fill=\"#fff\"><ellipse cx=\"60\" cy=\"52\" rx=\"30\" ry=\"14\"/><ellipse cx=\"82\" cy=\"44\" rx=\"20\" ry=\"14\"/><\/g>';\n\n  // 식물\n  var p = '';\n  if (st === 0) p += '<ellipse cx=\"150\" cy=\"286\" rx=\"9\" ry=\"6\" fill=\"#7A4A26\"/><path d=\"M146 283 q4 -6 8 0\" stroke=\"#5DBB63\" stroke-width=\"2\" fill=\"none\"/>';\n  if (st >= 1) {\n    p += '<path d=\"M150 288 C 146 ' + (288 - stemH * .5) + ', 154 ' + (288 - stemH * .7) + ', 150 ' + topY + '\" stroke=\"#3F9A48\" stroke-width=\"' + (st >= 4 ? 7 : 5) + '\" fill=\"none\" stroke-linecap=\"round\"/>';\n    if (st <= 2) p += '<ellipse cx=\"138\" cy=\"' + (topY + 2) + '\" rx=\"13\" ry=\"7\" fill=\"#7FD27F\" transform=\"rotate(-25 138 ' + (topY + 2) + ')\"/><ellipse cx=\"162\" cy=\"' + (topY + 2) + '\" rx=\"1
